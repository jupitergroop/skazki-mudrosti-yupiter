voprosy_i_zadaniya:
  tayna_skazki_2stroki_ru: "Лиса на словах называла Журавля дорогим гостем, а на деле подала кашу так, чтобы съесть всё самой. Сказка учит: настоящая дружба — это забота о том, чтобы хорошо и удобно было твоему другу!"
  voprosy_besedy_s_rebenkom:
    - "1. Почему Журавль остался голодным в гостях у Лисы: Разве у Лисы не было глубокой миски? Почему она размазала кашу по мелкой тарелке, хотя видела, что у Журавля длинный клюв?"
    - "2. Как повёл себя Журавль в ответ на хитрость Лисы: Он не стал ругаться и драться, а показал Лисе её собственный поступок как в зеркале — поставил узкий кувшин. Почему Лиса обиделась на то, что вчера сделала сама?"
    - "3. А как бы поступили Лиса и Журавль, если бы были настоящими друзьями: Какую посуду поставила бы для Журавля добрая хозяйка, и в какой миске подал бы угощение для Лисы заботливый друг?"
  mudraya_poslovica_ru: "«Как аукнется, так и откликнется: чего себе не желаешь — того и другу не делай!»"
  volshebnye_slova_druzhby:
    - "Когда ко мне приходят гости или мы играем с друзьями, я забочусь о том, чтобы радостно было каждому."
    - "Я помню правило «Как аукнется, так и откликнется» и отношусь к людям так, как хочу, чтобы относились ко мне."
  igra_vybor_3_dorogi:
    situaciya: "Представь: к тебе домой пришёл в гости друг (или младший брат), и вы выбираете игру или делите угощение. Какой путь ты выберешь?"
    variant_a_oshibka: "Путь 1 (Как Хитрая Лиса — «Мелкая тарелка только для себя»): На словах улыбаться, а на деле выбрать такую игру и такие правила, где выиграть и получить радость можешь только ты сам."
    variant_b_oshibka: "Путь 2 (Путь бесконечной обиды — «Кувшин в ответ на тарелку»): Долго мстить друг другу, дразниться и в итоге совсем рассориться и остаться без друзей."
    variant_v_vernyy: "★ Путь 3 — Мудрый выбор! (Чуткий и щедрый хозяин): Подумать о том, что любит твой гость и как ему будет удобно: Журавлю подать кувшин, а Лисичке — тарелочку, чтобы за столом все были сыты и счастливы!"
  tvorcheskoe_zadanie_risunok: "❖ Творческое задание: нарисуй дружный стол, где Лиса и Журавль помирились и у каждого своя удобная посуда!"
  naputstvie_semye_ru: "«Пусть за вашим семейным столом каждому будет тепло, сытно и радостно, а чуткость друг к другу хранит ваш дом от любых размолвок!»"
  praktikum_rukovoditelya_5_tochek:
    - "1. Проверка клиентской «посуды»: Нет ли на нашем сайте или в предложении «мелкой тарелки», о которую клиент стучит клювом и уходит несолоно хлебавши?"
    - "2. Честность партнёрской доли: Достаточно ли зарабатывают наши ключевые партнёры, чтобы хотеть работать с нами годами?"
    - "3. Распознавание «Лисьих обедов»: Не трачу ли я время на встречи и союзы, где партнёр думает исключительно о собственном интересе?"
    - "4. Культура выдержки: Умею ли я, как Журавль, сохранять безупречную вежливость и достоинство при столкновении с чужим лукавством?"
    - "5. Индивидуальный подход к людям: Учитываю ли я в управлении командой, что разные по складу сотрудники («Лисы» и «Журавли») требуют разной постановки задач?"
matrica_semeynaya_2x2:
  zagolovok_ru: "❖ ЧЕТЫРЕ УРОКА СКАЗКИ ДЛЯ СЕМЬИ И ВОСПИТАНИЯ ❖"
  vvodnaya_mysl_ru: "Главная ошибка многих любящих родителей и супругов — давать близкому человеку заботу в той форме, которая удобна нам самим («мелкая тарелка»), и искренне обижаться, почему ребёнок или супруг остаётся эмоционально «голодным»."
  os_y_vertikalnaya: "ИСКРЕННЯЯ ДОБРОТА И ЖЕЛАНИЕ ПОДЕЛИТЬСЯ →"
  os_x_gorizontalnaya:
    levo_ru: "Зацикленность на себе («Своя посуда»)"
    centr_ru: "ЧУТКОСТЬ К ОСОБЕННОСТЯМ ДРУГОГО ЧЕЛОВЕКА"
    pravo_ru: "Понимание природы близкого"
  kvadraty:
    kvadrat_1_levyy_nizhniy:
      zagolovok_ru: "Урок I • Лукавый эгоизм — ПИР ЛИСЫ (ТОЛЬКО НА СЛОВАХ)"
      sut_ru: "Красивые обещания и вежливые слова при полном равнодушии к реальным нуждам ближнего. Ведёт к быстрой потере доверия."
    kvadrat_2_levyy_verhniy:
      zagolovok_ru: "Урок II • Забота без чуткости — ЗАБОТА НА СВОЙ ЛАД (ТАРЕЛКА ДЛЯ ЖУРАВЛЯ)"
      sut_ru: "Родитель искренне старается для ребёнка, но навязывает ему свои собственные мечты и правила, не учитывая его природный «клюв»."
    kvadrat_3_pravyy_nizhniy:
      zagolovok_ru: "Урок III • Холодное зеркало — ОТВЕТНЫЙ КУВШИН ЖУРАВЛЯ"
      sut_ru: "Ты хорошо понимаешь особенности другого человека, но используешь это знание для того, чтобы уколоть его в ответ: «Ты мне — так, а я тебе — вот так!»."
    kvadrat_4_pravyy_verhniy_pravilnyy_otvet:
      zagolovok_ru: "★ ГАРМОНИЯ В СЕМЬЕ И ЖИЗНИ — ЧУТКАЯ ЛЮБОВЬ И ВЗАИМНОСТЬ"
      sut_ru: "В семье видят и уважают уникальность каждого: с каждым ребёнком и близким говорят на его языке любви и подают заботу в удобной для него форме."
  tri_roditelskih_pravila:
    - "Правило 1. Спрашивайте: «Как тебе удобнее?»: Прежде чем помогать или дарить подарок, узнайте, что действительно порадует близкого."
    - "Правило 2. Судите по делам, а не по сладким словам: Учите детей видеть разницу между лисьим «кушай, голубчик!» и настоящей заботой."
    - "Правило 3. Учите культуре гостеприимства: Гость в доме — это упражнение для ребёнка во внимании к другому человеку."
  tablica_semeynyh_situaciy:
    - situaciya: "Ребёнок позвал друга в гости, но сам играет в приставку, а гость скучает"
      oshibochnaya_reakciya: "Ругать ребёнка при госте."
      teplyy_i_mudryy_otvet: "Тихонько шепнуть на ушко: «Смотри, у нас сейчас каша на мелкой тарелке как у Лисы! Давай дадим другу второй джойстик»."
    - situaciya: "Медлительный ребёнок («Журавль») не успевает за вашим быстрым темпом"
      oshibochnaya_reakciya: "Раздражаться: «Почему ты такой копуша?!»"
      teplyy_i_mudryy_otvet: "Вспомнить, что у Журавля длинный клюв и высокий шаг — дать ему чёткий план и чуть больше времени."
    - situaciya: "Дети начали мстить друг другу по принципу «ты мне — я тебе»"
      oshibochnaya_reakciya: "Наказать обоих без разбора."
      teplyy_i_mudryy_otvet: "Напомнить финал сказки: «После кувшина Журавля оба остались голодными и без друзей. Давайте лучше накроем стол для двоих!»"
metodika_i_matrica_2x2:
  paradox_skazki_ru: "Построим матрицу по двум независимым осям: Ось Y — защита собственных интересов и достоинства, Ось X — учёт интересов и особенностей партнёра или клиента («удобная посуда»)."
  kto_est_kto_4_roli:
    - "1. «Лиса с мелкой тарелкой» — Имитатор партнёрства и корыстный подрядчик: Говорит медовые речи на старте («масла не жалела!»), но составляет договор и порядок работы так, чтобы все сливки слизать самой, а партнёра оставить стучать клювом по пустому фарфору."
    - "2. «Журавль за столом Лисы» — Выдержка и холодная фиксация правил игры: Высший класс переговорщика: увидев уловку, Журавль не тратит силы на крик, а мгновенно считывает истинную цену «кумы» и переводит отношения в зеркальный режим."
    - "3. «Кувшин с узким горлышком» — Зеркальный ответ «Как аукнется, так и откликнется»: Точное воспроизведение условий контрагента в его же адрес. Лучший способ без единого грубого слова показать хитрецу, как выглядят его собственные правила со стороны."
    - "4. «Мастер Взаимной Выгоды (Квадрат 4)» — Созидатель удобного сервиса: Тот, кто заранее изучает «клюв» своего клиента или партнёра и подаёт ценность ровно в том виде, который клиент может легко и с удовольствием принять."
  dve_lovushki:
    - "Ловушка 1 — Продукт, сделанный «под язык Лисы», а не «под клюв Журавля»: Компания создаёт отличный продукт (каша действительно вкусная!), но упаковывает его так, как удобно бухгалтерии или разработчикам, а не клиенту. Клиент не может «подцепить» ценность и уходит к конкурентам."
    - "Ловушка 2 — Однобокий договор, где все права у одной стороны, а штрафы — у другой: Некоторые юристы и собственники гордятся тем, что «продавили партнёра» (размазали кашу по своей тарелке). Но на втором же этапе дела партнёр выставляет им ответный «узкий кувшин», и совместное предприятие умирает."
    - "★ Секрет долгосрочного союза — Проверка на «Удобство чужого клюва»: Перед подписанием любого партнёрского соглашения спросите себя: «А сможет ли мой партнёр по-настоящему заработать и насытиться из этой посуды?»."
  sekret_skazki_ru: "Второй сделки с «мелкой тарелкой» не бывает: либо вы ставите посуду под партнёра, либо завтра он встретит вас узким кувшином."
  os_y_vertikalnaya:
    nazvanie_ru: "ЗАЩИТА СВОЕГО ИНТЕРЕСА И ДОСТОИНСТВА →"
    niz_ru: "Низкая"
    verh_ru: "Высокая ↑"
  os_x_gorizontalnaya:
    nazvanie_ru: "УЧЁТ ПРИРОДЫ И ВЫГОДЫ ПАРТНЁРА / КЛИЕНТА"
    levo_ru: "Игнорирование партнёра («Своя посуда»)"
    pravo_ru: "Точная подстройка («Под клюв гостя»)"
  kvadraty:
    kvadrat_1_levyy_nizhniy:
      zagolovok_ru: "Квадрат 1 • Пустой стол и обман — ПУСТАЯ СДЕЛКА"
      sut_ru: "Ни качественного продукта, ни уважения к партнёру — только пустые обещания на крыльце."
    kvadrat_2_levyy_verhniy:
      zagolovok_ru: "Квадрат 2 • Хитрость Лисы / Ответ Журавля — ВОЙНА ТАРЕЛОК И КУВШИНОВ"
      sut_ru: "Каждая сторона тянет одеяло на себя или отвечает зеркальными преградами. Итог сказки: «С тех пор и дружба врозь» (разрыв союза)."
    kvadrat_3_pravyy_nizhniy:
      zagolovok_ru: "Квадрат 3 • Уступчивость себе в убыток — ГОЛОДНЫЙ ГОСТЬ"
      sut_ru: "Раз за разом ходить на «лисьи обеды», терпеть невыгодные условия и бояться защитить свои границы."
    kvadrat_4_pravyy_verhniy_pravilnyy_otvet:
      zagolovok_ru: "★ Квадрат 4 (ПРАВЫЙ ВЕРХНИЙ УГОЛ): СТОЛ ВЗАИМНОГО БОГАТСТВА"
      sut_ru: "Высокая ценность продукта («окрошка и каша с маслом») подаётся в посуде, удобной для каждого участника. Долгосрочный союз и повторные сделки."
  tri_pravila_perehoda_v_kvadrat_4:
    - "Правило 1. Проверка сервиса глазами «Журавля»: Проверьте путь клиента на сайте и в отделе продаж: удобно ли ему «брать кашу» или удобно только вам?"
    - "Правило 2. Равновесие в договорах с соратниками: В сильном союзе риски и вознаграждение распределяются так, чтобы обе стороны были заинтересованы в общем успехе."
    - "Правило 3. Зеркало Журавля для ловкачей: Если контрагент неисправимо играет в «мелкую тарелку» — спокойно и без лишних слов закройте сделку его же правилом."
  tablica_rabochih_situaciy:
    - situaciya: "Разработка сайта, предложения или клиентского сервиса"
      ubytschnyy_otvet: "Написать сложным внутренним языком компании («мелкая тарелка»)."
      pravilnyy_otvet_kvadrat_4: "Подать выгоду и кнопки заявки под «клюв» клиента — просто, наглядно и в одно касание."
    - situaciya: "Составление партнёрского договора"
      ubytschnyy_otvet: "Спрятать в мелком шрифте условия, лишающие партнёра дохода."
      pravilnyy_otvet_kvadrat_4: "Прописать прозрачную формулу деления прибыли, чтобы партнёр работал с полной отдачей."
    - situaciya: "Контрагент нарушил дух договорённостей, прикрывшись буквой правил"
      ubytschnyy_otvet: "Устраивать шумный скандал в переписке."
      pravilnyy_otvet_kvadrat_4: "Включить выдержку Журавля: вежливо применить к нему его же пункт правил («кувшин»)."
    - situaciya: "Международные переговоры (Китай, Индия, страны БРИКС)"
      ubytschnyy_otvet: "Навязывать свои привычные лекала без учёта чужой культуры."
      pravilnyy_otvet_kvadrat_4: "Изучить деловой обычай партнёра и подать предложение в уважаемой им «посуде»."
  krylatyy_slovar_komandy:
    - "«Мы сейчас размазали кашу по мелкой тарелке!» — Наше предложение, сайт или отчёт сделаны формально — клиент не может извлечь из них пользу. (Действие: Переделываем подачу и сервис под реальное удобство клиента.)"
    - "«У этого клиента длинный клюв Журавля — ему нужен кувшин, а не блюдце!» — Крупному корпоративному заказчику не подходит наш шаблонный розничный разговор. (Действие: Готовим глубокую личную встречу под его порядок принятия решений.)"
    - "«Нас зовут на лисий обед стучать клювом по тарелке!» — Нам предлагают громкий статусный проект, в котором вся прибыль уйдёт устроителям. (Действие: Отказываемся от невыгодных условий или меняем устройство сделки.)"
    - "«Не кричите на Лису — просто поставьте на стол узкий кувшин!» — Контрагент ведёт себя нечестно, но шуметь невыгодно. (Действие: Спокойно и юридически безупречно возвращаем ему зеркальные условия.)"
sovet_18_ekspertov:
  kontur_1_smysl_i_metodologiya:
    rol_01_dba_instrument: "Гарвардский метод переговоров (Разделение позиции и подлинного интереса, поиск взаимной выгоды Win-Win) и клиентоцентричный дизайн продукта (JTBD / Customer Empathy)"
    rol_02_mckinsey_mece_proverka: "Ось X (Учёт реальных возможностей и устройства партнёра) × Ось Y (Защита собственных интересов и ценность угощения) — раскладывают коммуникацию на 4 чистых квадранта: от равнодушия (Кв. 1) и скрытой манипуляции «тарелкой/кувшином» (Кв. 2–3) к союзу уважения (★ Кв. 4)."
    rol_03_edtech_perenos_v_privychku_24ch:
      dlya_semyi_segodnya_vecherom: "Сегодня вечером спросите каждого за столом: «Как тебе сегодня удобнее и теплее — поговорить, поиграть или спокойно отдохнуть?» — подберите «посуду по клюву» близкого человека."
      dlya_rukovoditelya_zavtra_utrom: "Проверьте 1 коммерческое предложение или регламент вашей компании глазами клиента: где мы подаём ценный продукт «на плоской тарелке с манной кашей», которую клиенту неудобно взять?"
    rol_04_skazochnik_transkreator: "T1 + T4: Вместо окончания «и с тех пор дружба врозь» добавлен созидательный урок гостеприимства: как накрыть стол с двумя приборами, чтобы каждый гость ушёл сытым и благодарным."
    rol_05_rezhisser_chteniya_vsluh_i_audio: "Контраст звукописи: в сцене 2 — дробный стук клюва Журавля по тарелке («тук-тук-тук» с паузами досады); в сцене 3 — глухое эхо узкого кувшина; в финале — мелодичный звон двух удобных чаш."
    rol_06_briks_i_vostok_most: "Эзоп и Федр: античная басня о Лисице и Аисте; Индия: притча о гостеприимстве слона и воробья; Китай: принцип «Индивидуального подхода к ученику и гостю» Конфуция (Инь Цай Ши Цзяо)."
  kontur_2_chetyre_auditorii:
    rol_07_deti_6_10_let: "1. Думай о друге: Настоящее угощение — то, которое удобно и приятно твоему гостю. 2. Закон эха: Как ты поступаешь с людьми, так и они ответят тебе. 3. Умей мириться: Вместо того чтобы мстить кувшином за тарелку — покажи пример настоящей дружбы."
    rol_08_semya_i_60_plyus: "100% чистый русский язык без англицизмов и жаргона; уважение к бабушкам и дедушкам (60+) как хранителям семейного лада."
    rol_09_upravlency_mba: "1. Учитывайте природу ребёнка: Подбирайте методы обучения под «клюв» конкретного ребёнка. 2. Языки любви в семье: Дарите тепло в той форме, которую близкий человек способен принять. 3. Искренность вместо декораций: Дети мгновенно чувствуют фальшь за красивыми словами."
    rol_10_predprinimateli_sovladelcy: "Второй сделки с «мелкой тарелкой» не бывает: либо вы ставите посуду под партнёра, либо завтра он встретит вас узким кувшином."
  kontur_3_vizual_produkt_pravo:
    rol_11_hudozhnik_illyustrator: "Пресет STYLE_1_RUSSIAN_TEREM, палитра #fbf6ec, #7a1c14, #b88938, #1e352f"
    rol_12_infodizayner_matric: "Правильный ответ всегда закреплён в Правом Верхнем Углу (★ Квадрат 4) с золотой рамкой и мгновенным считыванием за 3 секунды."
    rol_13_verstalshchik_gost: "Эталон 13 страниц (1 обложка + 12 страниц блока по ГОСТ Р 7.0.4-2020), висячие строки = 0, воздух ≥ 25%."
    rol_14_inzhener_pechati_kdp: "CMYK FOGRA39 (TAC ≤ 240%), вылеты 3.2 мм (0.125 in); индивидуальный выпуск 13 стр. для Kindle eBook + сборка в тома по 3 сказки (36 стр.) для KDP Paperback и по 8 сказок (108 стр.) для KDP Hardcover."
    rol_15_ii_pedagog_sokrat: "Сократический режим: ИИ-наставник сначала задаёт наводящий вопрос по сказке и хвалит за размышление; не собирает персональные данные детей (Zero PII)."
    rol_16_prodyuser_amazon_kdp: "Наднациональное позиционирование 'The Fox and the Crane: The Secret of True Hospitality and Empathy' + западный культурный мостик в 1-й строке предисловия."
    rol_17_yurist_rf: "ГК РФ ст. 10 (Запрет злоупотребления правом — формальное исполнение обязательства в заведомо непригодной для кредитора форме), ст. 428 (Договор присоединения — защита от кабальных и односторонних условий), ст. 309 (Исполнение обязательств надлежащим образом)."
