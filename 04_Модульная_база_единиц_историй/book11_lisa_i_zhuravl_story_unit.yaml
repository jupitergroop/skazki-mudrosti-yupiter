celi_i_klyuchi:
  cel_rebenka_6plus: "Лиса на словах называла Журавля дорогим гостем, а на деле подала кашу так, чтобы съесть всё самой. Сказка учит: настоящая дружба — это забота о том, чтобы хорошо и удобно было твоему другу!"
  cel_roditelya_i_lidera: "Любой договор, продукт или сайт компании — это либо «мелкая тарелка» (удобно только продавцу), либо «узкий кувшин», либо стол, за которым уважают особенности партнёра."
  zolotoy_klyuchik_malym_ru: "1. Думай о друге: Настоящее угощение — то, которое удобно и приятно твоему гостю. 2. Закон эха: Как ты поступаешь с людьми, так и они ответят тебе. 3. Умей мириться: Вместо того чтобы мстить кувшином за тарелку — покажи пример настоящей дружбы."
  zolotoy_klyuchik_bolshim_ru: "1. Учитывайте природу ребёнка: Подбирайте методы обучения под «клюв» конкретного ребёнка. 2. Языки любви в семье: Дарите тепло в той форме, которую близкий человек способен принять. 3. Искренность вместо декораций: Дети мгновенно чувствуют фальшь за красивыми словами."
  deviz_skazki_ru: "«Как аукнется, так и откликнется: угощай друга так, чтобы было радостно ему»"
  deviz_upravleniya_ru: "«Сделка, удобная только одной стороне, живёт ровно до ответного визита в гости»"
tekst_istorii:
  predislovie_avtora_ru: "Известная всему миру со времён Эзопа история Лисы и Журавля раскрывает главный закон общения: даже самое щедрое угощение теряет смысл, если подано в посуде, удобной только хозяину. Почему распалась дружба Лисы и Журавля, хотя оба ходили друг к другу в гости, улыбались и говорили ласковые слова? Потому что Лиса думала только о себе и размазала кашу по мелкой тарелке, а Журавль в ответ подал окрошку в кувшине с узким горлышком! Для ребёнка эта сказка — лучшее зеркало эгоизма в дружбе («давай играть только по моим правилам!»), а для родителей — глубокое напоминание о том, что все дети разные: у одного «клюв Журавля», у другого «язычок Лисы», и любить близкого нужно на понятном ему языке."
  predislovie_upravlenie_ru: "Почему так много громких партнёрств, начинающихся с объятий и тостов («куманёк дорогой!»), заканчиваются тихим разрывом уже после первой сделки? Русская сказка «Лиса и Журавль» даёт исчерпывающий ответ: потому что одна из сторон под видом партнёрства подаёт на стол «кашу, размазанную по мелкой тарелке» — условия, в которых вся выгода достаётся только хозяину. Но не менее поучительна и стратегия Журавля: он не устраивает скандалов, не бьёт посуду и не портит себе доброе имя. Он вежливо благодарит и на следующем шаге создаёт точно такие же зеркальные условия («узкий кувшин»), после чего лукавый партнёр уходит сам. Перечитаем сказку и разберём матрицу долгосрочных союзов."
  sceny_family_5str:
    - scena: 1
      aforizm_ru: "❧ Лист I. Лесная дружба и пышное приглашение Лисы на званый обед ❧"
      tekst_ru: "Подружились как-то в весеннем лесу Лиса с Журавлём — да так крепко, что даже кумовьями назвались, когда у знакомой медведицы медвежонка крестили. Ходят друг за другом по солнечной опушке, беседы ведут, нахваливают друг друга да не наглядятся.\n\nВот однажды и вздумала Лиса позвать Журавля к себе в гости на званый обед: «Приходи, куманёк, приходи, мой дорогой! Уж как я тебя угощу, как встречу — век моей хлебосольности не забудешь!»"
    - scena: 2
      aforizm_ru: "❧ Лист II. Манная каша на мелкой тарелке: лукавое гостеприимство Лисы ❧"
      tekst_ru: "Пришёл Журавль к Лисе на званый пир. А Лиса наварила манной каши и размазала её тонким-тонким слоем по мелкой глиняной тарелке — как ей самой слизывать сподручнее. Подала на стол и приговаривает ласково: «Кушай, мой голубчик куманёк! Сама стряпала, масла не жалела!»\n\nЖуравль хлоп-хлоп длинным носом, стучал-стучал кончиком клюва по мелкой тарелке — ничегошеньки ухватить не может! А Лисица в это время лижет себе да лижет кашу языком — так всю до последней крупинки сама и съела."
    - scena: 3
      aforizm_ru: "❧ Лист III. Спокойное достоинство Журавля и ответное приглашение в гости ❧"
      tekst_ru: "Как вылизала Лиса всю кашу дочиста, так и говорит с лукавой усмешкой: «Не обессудь, любезный кум! Больше потчевать тебя нечем!»\n\nНе стал воспитанный Журавль ни кричать, ни спорить за столом, только поклонился вежливо и отвечает спокойно: «Спасибо, кума, и на этом! Приходи же завтра ко мне в гости на болото — теперь мой черёд тебя отблагодарить!»"
    - scena: 4
      aforizm_ru: "❧ Лист IV. Высокий кувшин с узким горлышком: зеркальный урок для кумы ❧"
      tekst_ru: "На другой день приходит Лиса к Журавлю в гости, предвкушая богатый да сытный обед. А Журавль наготовил душистой окрошки со свежей зеленью да мясом, наклал её в высокий глиняный кувшин с узким-преузким горлышком, поставил на стол и говорит: «Кушай, кумушка! Право, больше потчевать нечем!»\n\nЛиса начала вертеться вокруг кувшина: и так зайдёт, и эдак, и лизнёт его снаружи, и понюхает — всё никак достать не может! Не лезет голова в узкий кувшин, хоть плачь! А Журавль стоит на своих высоких ногах, длинным носом знай себе клюёт да клюёт окрошку из кувшина, пока всё сам не съел."
    - scena: 5
      aforizm_ru: "❧ Лист V. «Как аукнется, так и откликнется!» — конец неискренней дружбы ❧"
      tekst_ru: "Съел Журавль всю окрошку до донышка, вытер длинный клюв расшитым полотенцем и говорит точь-в-точь лисьими словами: «Ну, не обессудь, кума! Чем богаты — тем и рады, больше угощать нечем!»\n\nВзяла тут Лису великая досада: думала она, что на целую неделю у кума наестся, а пошла домой голодная — как несолоно хлебавши! Как аукнулось, так и откликнулось. С тех самых пор и дружба у Лисы с Журавлём врозь."
  sceny_mgmt_3str:
    - scena: 1
      aforizm_ru: "❧ Лист I из III. Ловушка «мелкой тарелки»: обещание дружбы при односторонней выгоде ❧"
      tekst_ru: "Подружились Лиса с Журавлём, назвались кумовьями, и позвала Лиса Журавля к себе на званый обед: «Приходи, куманёк дорогой, уж как я тебя угощу!». Наварила Лиса манной каши и размазала по мелкой тарелке — как ей самой слизывать удобно.\n\nСтучал-стучал Журавль длинным клювом по мелкой тарелке — ничего ухватить не может! А Лиса знай себе лижет кашу языком, пока всю сама не съела: «Не обессудь, куманёк, больше потчевать нечем!»"
    - scena: 2
      aforizm_ru: "❧ Лист II из III. Дипломатическое зеркало Журавля: высокий кувшин с узким горлышком ❧"
      tekst_ru: "Не стал Журавль спорить и скандалить, вежливо поблагодарил и позвал Лису на завтра к себе в гости. Наготовил он душистой окрошки и сложил её в высокий кувшин с узким-преузким горлышком: «Кушай, кумушка!»\n\nВертелась Лиса вокруг кувшина, и лизнёт его, и понюхает — не лезет голова в узкое горлышко! А Журавль длинным клювом знай себе таскает окрошку из кувшина, пока всю до дна не съел."
    - scena: 3
      aforizm_ru: "❧ Лист III из III. Закон рынка: неравноправная сделка всегда разрушает союз ❧"
      tekst_ru: "Вытер Журавль клюв и вернул Лисе её же фразу слово в слово: «Не обессудь, кума, больше угощать нечем!». Пошла Лиса домой голодная — как несолоно хлебавши.\n\nКак аукнулось, так и откликнулось! С тех самых пор и дружба у Лисы с Журавлём врозь."
