      pravilnyy_otvet_kvadrat_4: "Спокойно предъявить юридический расчёт и шаг за шагом довести процедуру до конца."
    - situaciya: "Выбор защитника интересов компании или семьи"
      ubytschnyy_otvet: "Искать «самого крупного по статусу» советника без специализации."
      pravilnyy_otvet_kvadrat_4: "Привлечь целевого практика («Петушка с косой»), который не боится шума."
  krylatyy_slovar_komandy:
    - "«Ледяная избушка» — витринный проект без запаса прочности, который тает при первом кризисе."
    - "«Пустить на крылечко» — дать доступ к ключевым активам без юридической фиксации границ."
    - "«Позвать Петушка с косой» — заменить статусных говорунов на решительного профильного исполнителя."
  sekret_skazki_ru: "1. Держите фокус в Правом Верхнем Квадрате (Квадрат 4): твёрдый актив + защищённые границы. 2. Не пускайте «на печку» без регламента: договор дороже устных обещаний на крыльце. 3. Иммунитет к голосовому блефу."
