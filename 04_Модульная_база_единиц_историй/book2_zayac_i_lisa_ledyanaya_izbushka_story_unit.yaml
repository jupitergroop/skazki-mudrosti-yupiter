voprosy_i_zadaniya:
  tayna_skazki_2stroki_ru: "Доброта не должна быть беззащитной! Добрый Заяц умел отлично строить, но не умел вовремя сказать «Стоп», а маленький Петушок оказался сильнее Медведя, потому что не испугался пустого крика."
  voprosy_besedy_s_rebenkom:
    - "Вопрос I (Тайна трёх шажков): Почему Лиса не стала сразу выгонять Зайца, а просилась сначала «на дворик», потом «на крылечко», а потом «на печку»?"
    - "Вопрос II (Загадка про страх великанов): Почему зубастый Волк и огромный Медведь убежали от крика Лисы, а маленький Петушок не испугался?"
    - "Вопрос III (Как помочь и дом не потерять): Как Зайцу надо было уговориться с Лисой ещё у калитки, чтобы и соседку от простуды спасти, и хозяином в своём доме остаться?"
  volshebnye_slova_druzhby:
    - "Погреться с мороза — пожалуйста, садись на лавочку у входа! А хозяйская печка и ключи от дома — только мои!"
  igra_vybor_3_dorogi:
    situaciya: "Тренажёр «Три ступеньки к печке»: где поставить границу?"
    variant_a_oshibka: "Ступенька 1 («На дворик»): отказать другу даже в запасной ручке на один урок."
    variant_b_oshibka: "Ступенька 2 («На крылечко»): промолчать, когда приятель без спроса хозяйничает в твоём рюкзаке."
    variant_v_vernyy: "Ступенька 3 («Стоп-линия Петушка»): помогать по-доброму, но ключи и правила в своём доме держать твёрдо!"
  tvorcheskoe_zadanie_risunok: "Придумай и нарисуй деревянную табличку «Правила гостеприимного дома Зайца» над его резным крыльцом."
  praktikum_rukovoditelya_5_tochek:
    - "1. Какое дело вашей компании или семьи построено «изо льда» (на показном блеске), а какое — «из луба» (вдолгую)?"
    - "2. Где вы пустили партнёра или сотрудника «на крылечко» без письменного уговора и чётких обязательств?"
    - "3. Какие «Волки и Медведи» (громкие по званию советники) создают шум вместо решения вопроса?"
    - "4. Кто ваш «Петушок с косой» — профильный практик, способный довести защиту прав до конца?"
    - "5. Какое правило доступа к ключевому достоянию («печке») вы закрепите сегодня?"
