    - "Шаг 2. Фиксируйте границы на «крылечке» письменным регламентом ДО входа во внутренний контур (Анти-Заяц)."
    - "Шаг 3. Выбирайте «Петушка с косой» вместо «Медведя» — узкого практика с инструментом и готовностью идти до конца."
  tablica_rabochih_situaciy:
    - situaciya: "Партнёр просит «временно поработать без договора»"
      ubytschnyy_otvet: "«Ладно, мы же свои люди, потом оформим» (путь на печку)."
      pravilnyy_otvet_kvadrat_4: "«Дружбу ценим, поэтому все права и границы фиксируем на берегу до старта»."
    - situaciya: "Оппонент включает голосовой блеф («Пойдут клочки!»)"
