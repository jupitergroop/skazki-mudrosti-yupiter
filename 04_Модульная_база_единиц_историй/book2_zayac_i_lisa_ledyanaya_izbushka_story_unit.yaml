celi_i_klyuchi:
  cel_rebenka_6plus: "Отличить надёжный труд («лубяную избушку») от хвастовства («ледяной избушки») и научиться вовремя ставить границу на крылечке."
  cel_roditelya_i_lidera: "Понять механизм ползучего захвата активов в 3 шага («дворик → крылечко → печка») и почему узкий практик с инструментом («Петушок с косой») эффективнее статусных советников («Волка и Медведя»)."
  zolotoy_klyuchik_malym_ru: "1. Трудись основательно: ледяное хвастовство растает весной, а честный труд простоит долгие годы. 2. Береги свой порог: доброму гостю — радость, а хитрецу — твёрдое слово. 3. Будь храбрым, как Петушок!"
  zolotoy_klyuchik_bolshim_ru: "1. Держите фокус в Правом Верхнем Квадрате (Квадрат 4): твёрдый актив + защищённые границы. 2. Не пускайте «на печку» без регламента: договор дороже устных обещаний на крыльце. 3. Иммунитет к голосовому блефу."
  golden_key_children_en: "Build with solid bark rather than melting ice, guard your threshold wisely, and stand brave like the Rooster."
  golden_key_adults_en: "Pair a resilient core asset with ironclad governance on the porch, and rely on decisive specialists rather than loud titles."
tekst_istorii:
  predislovie_avtora_ru: "Перекликаясь с всемирно известной притчей о «Носе верблюда в шатре», история Заюшкиной лубяной и лисьей ледяной избушек показывает, как шаг за шагом нарушаются границы — и как твёрдое правило возвращает хозяину его дом. Сказка про лубяную и ледяную избушку с детства знакома каждому, но в ней скрыт удивительно глубокий урок. Ребёнок видит в этой истории, чем трудолюбие Зайца отличается от ледяного хвастовства Лисы, и понимает, почему добрый дом нуждается в смелой защите. А взрослый руководитель узнаёт классический кейс о том, как можно собственными руками впустить недобросовестного партнёра на порог и почему громкие титулы советников (Волка и Медведя) пасуют там, где побеждает точная решимость Петушка."
  sceny_family_5str:
    - scena: 1
      aforizm_ru: "Тот, кто строит на совесть, встречает весну под крепкой крышей, а кто строит напоказ — остаётся у талой лужи."
      tekst_ru: "Жили-были на лесной опушке Лиса да Заяц. Пришла осенняя пора холодная — решили они себе к зиме избы рубить. Трудолюбивый Заяц не поленился: натаскал крепкого древесного луба, проконопатил стены мхом и выстроил тёплую лубяную избушку — пусть не блестит на солнце, зато ни вьюга, ни весеннее тепло ей не страшны. А хитрая Лиса работать долго не любила: слепила себе сияющую избушку ледяную, села у резного окошка и давай над соседом посмеиваться: «У меня горница светлая, хрустальная, а у тебя, косой, тёмная да простая!» Только пришла красна весна — пригрело ласковое солнышко: у Зайца избушка стоит как стояла, а у Лисы вся до капельки и растаяла."
    - scena: 2
      aforizm_ru: "Весенняя распутица: Лиса просится к доброму Зайцу на крылечко обсохнуть."
      tekst_ru: "Осталась Лиса без крова под весенним ветром. Подошла она к заячьему теремку, сложила лапки у груди и запела тоненьким, жалобным голоском: «Заинька-соседушка, пусти меня хоть на твой дворик постоять, лапки обсохнут — я и пойду!» Добрая душа у Зайца — пожалел он соседку и отворил ворота без всякого уговора. А к вечеру Лиса уж в дверь стучится: «Пусти, Заинька, на крылечко, а с крылечка — в тёплую горницу, да на печку погреться!» Пустил её простодушный хозяин на печку, а наутро Лиса хвостом махнула, топнула лапой и самого Зайца за порог выставила: «Ступай прочь, косой, теперь это мой дом!»"
    - scena: 3
      aforizm_ru: "Неудачное заступничество: грозные Волк и Медведь бегут от крика с печки."
      tekst_ru: "Идёт Заяц по лесной тропинке да горько плачет. Навстречу ему серый Волк, а за ним и сам косолапый Медведь в боярском кафтане: «О чём, Заинька, слёзы льёшь?» — «Как же мне не плакать! Была у меня избушка лубяная, а у Лисы ледяная; попросилась она ко мне погреться, да меня же из дому и выгнала!» Вскипели лесные великаны: «Не плачь, косой, мы её мигом выгоним!» Подошли к избушке, зарычали: «Поди, Лиса, вон!» А Лиса с тёплой печки как закричит страшным голосом: «Как выскочу, как выпрыгну — пойдут клочки по закоулочкам!» Испугались и Волк, и Медведь громкого крика — и бросились врассыпную по кустам."
    - scena: 4
      aforizm_ru: "Встреча на лесной дорожке: Петушок — золотой гребешок спешит Зайцу на выручку."
      tekst_ru: "Сидит Заяц на мшистом пеньке, ещё пуще прежнего горюет: коли уж ни Волк, ни могучий Медведь не совладали с плутовкой, кто же ему подмогу даст? Вдруг шагает по лесной дорожке Петушок — золотой гребешок, в красных сапожках, а на плече острую косу несёт: «Ку-ка-ре-ку! О чём, Заинька, плачешь?» Рассказал Заяц про свою беду и вздохнул: «Куда уж тебе, Петушок: гнали её и Волк, и Медведь — не выгнали!» А Петушок расправил крылья, тряхнул золотым гребнем и отвечает звонко: «А вот они не выгнали, а я выгоню! Пойдём со мной к твоему дому!»"
    - scena: 5
      aforizm_ru: "Торжество правды: решительный шаг Петушка обращает лисий блеф в бегство."
      tekst_ru: "Подошёл Петушок к лубяной избушке, стукнул каблуком по резному крыльцу и запел во весь голос: «Ку-ка-ре-ку! Иду на пятах, несу косу на плечах, хочу Лису посечи — слезай, Лиса, с печи, поди, Лиса, вон!» Струхнула плутовка, засуетилась: «Одеваюсь, шубу надеваю!» — а Петушок не ждёт, пуще прежнего шаг чеканит да косой позвякивает. Увидела Лиса, что пугать тут некого: отворила дверь да стрелой метнулась в чащу без оглядки! А Заяц с Петушком вошли в тёплую лубяную горницу, поставили медный самовар и стали жить-поживать в крепкой дружбе да согласии."
