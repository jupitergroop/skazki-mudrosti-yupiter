celi_i_klyuchi:
  cel_rebenka_6plus: "Каждая из трёх глав сказки дарит ребёнку свой золотой урок: в Главе I — не путать главное дело с блестящей клеткой, в Главе II — учиться с первого раза, в Главе III — хранить верную дружбу и честь!"
  cel_roditelya_i_lidera: "Перед нами точная модель любого бизнеса: союз смелого, но увлекающегося созидателя («Ивана-царевича») и опытного операционного руководителя и наставника («Серого Волка»)."
  zolotoy_klyuchik_malym_ru: "1. Урок Главы I: Не меняй главное сокровище на блестящую мишуру и слушай совет наставника. 2. Урок Главы II: Учись с первого раза и не повторяй старую ошибку у золотой уздечки. 3. Урок Главы III: Храни верность друзьям и родным — правда всегда побеждает зависть."
  zolotoy_klyuchik_bolshim_ru: "1. Тренируйте выдержку: Умение вовремя остановить руку перед «клеткой» — основа взрослой воли. 2. Наставничество с любовью: Обучайте на ошибках, оставаясь для ребёнка надёжным тылом. 3. Берегите единство детей: Воспитывайте в братьях и сёстрах взаимную радость вместо соперничества."
  deviz_skazki_ru: "«Бери саму Жар-птицу, не зарься на мишуру золотой клетки и береги верного друга»"
  deviz_upravleniya_ru: "«Талант находит перо Жар-птицы, но только дисциплина и наставник доводят проект до победы»"
tekst_istorii:
  predislovie_avtora_ru: "Родственная европейской сказке братьев Гримм «Золотая птица» и великим восточным эпосам о верных спутниках, история Ивана-царевича и Серого Волка учит искусству стратегического союза, дисциплины и верности дружине. Сказка «Иван-царевич и Серый Волк» устроена как захватывающее путешествие из трёх глав-испытаний. Почему смелый и добрый Иван-царевич дважды подряд попадал в беду у самой цели? Потому что в последнюю секунду ему не хватало выдержки: когда Жар-птица и Златогривый конь были уже в руках, он тянулся за блестящей «золотой клеткой» и «золотой уздечкой», нарушая совет мудрого Серого Волка. В этом издании мы специально разделили сказку на три главы и подготовили вопросы по каждой главе — чтобы вы могли обсудить с ребёнком и цену самообладания, и роль настоящего наставника, и победу верной дружбы над братской завистью."
  predislovie_upravlenie_ru: "«Иван-царевич и Серый Волк» — это готовый трёхглавный учебник проектного управления и работы с кадрами. В Главе I талантливый, но увлекающийся исполнитель уже держит цель («Жар-птицу») в руках, но нарушает регламент ради блестящей упаковки («золотой клетки») и включает сигнализацию кризиса. В Главе II он повторяет ошибку с «золотой уздечкой», потому что не прочувствовал цену первого сбоя. А в Главе III мудрый наставник (Серый Волк) принимает решение высшего пилотажа: оставляет царевича «у дуба», делает критический шаг лично и спасает проект от захвата «старшими братьями» на финише. Разберём все три главы по шагам."
  sceny_family_5str:
    - scena: 1
      aforizm_ru: "❧ Глава I (Лист 1). Ночной дозор Ивана-царевича и встреча с Серым Волком ❧"
      tekst_ru: "Глава I. Жил-был в некотором царстве царь Берендей, и было у него три сына, а младшего звали Иваном-царевичем. Росла в царском саду чудесная яблоня с золотыми яблоками, да повадилась летать в сад Жар-птица — на ней перья золотые, а глаза восточного хрусталя. Старшие братья на ночном карауле проспали, а Иван-царевич не сомкнул глаз и ухватил Жар-птицу за хвост — осталось у него в руке одно сияющее перо.\n\nОтправился Иван-царевич за тридевять земель на поиски Жар-птицы. Долго ли, коротко ли ехал, потерял в дремучем лесу своего богатырского коня, но вышел к нему навстречу могучий Серый Волк и молвил человеческим голосом: «Жаль мне тебя, Иван-царевич! Садись на меня да держись крепче — сослужу я тебе верную службу!»"
    - scena: 2
      aforizm_ru: "❧ Глава I (Лист 2). Ошибка у золотой клетки: когда блеск ослепляет разум ❧"
      tekst_ru: "Домчал Серый Волк царевича быстрее ветра до белокаменных палат царя Афрона и строго-настрого наказал ему у стены: «Перелезь через ограду, Иван-царевич: сторожа все крепко спят. Возьми в тереме Жар-птицу, да смотри — золотую клетку ни за что не трогай, не то беды не миновать!»\n\nВошёл Иван-царевич в палаты, взял чудесную Жар-птицу в руки, да разгорелись у него глаза на клетку из чистого золота с самоцветами: «Ах, какая красота! Как же я такую птицу да без золотой клетки понесу?». Только протянул руку к клетке — загремели по всему саду гусли да колокола, проснулась стража и схватила царевича! А царь Афрон велел: «Добудешь мне у царя Кусмана Златогривого коня — прощу и отдам Жар-птицу!»"
    - scena: 3
      aforizm_ru: "❧ Глава II (Лист 3). Вторая ошибка нетерпения: соблазн золотой уздечки ❧"
      tekst_ru: "Глава II. Пожурил Серый Волк Ивана-царевича: «Говорил же я тебе — не бери золотую клетку! Ну да ладно, не вешай головы, садись на меня». Примчал он царевича к белокаменным конюшням царя Кусмана и снова даёт твёрдый уговор: «Выводи Златогривого коня тихонько, а на стене висит золотая уздечка — её ни за что не бери!»\n\nВошёл Иван-царевич в конюшню, взял за гриву Златогривого коня, да увидел на стене уздечку, всю усыпанную крупным жемчугом и алмазами: «Эх, чем же я такого славного коня поведу!». Только снял уздечку с гвоздя — загремел гром по всем конюшням, сбежались конюхи и отвели его к царю Кусману. А тот назначил новую службу: добыть за тридевять земель красавицу Елену Прекрасную."
    - scena: 4
      aforizm_ru: "❧ Глава III (Лист 4). Мудрый шаг Серого Волка и возвращение с победой ❧"
      tekst_ru: "Глава III. Вздохнул Серый Волк и говорит: «Опять ты моего слова не послушался, Иван-царевич! Видно, в третий раз мне самому идти надо». Велел он царевичу ждать у зелёного дуба за городом, а сам перемахнул через золотую решётку в заповедный сад, дождался, когда Елена Прекрасная выйдет гулять с нянюшками, и умчал её вместе с Иваном-царевичем.\n\nА по дороге назад перекинулся мудрый Серый Волк сперва Еленой Прекрасной, а затем и Златогривым конём — так смекалкой да верной дружбой помог он Ивану-царевичу и слово перед царями сдержать, и все сокровища сохранить, и с невестой Еленой Прекрасной в родное царство отправиться."
    - scena: 5
      aforizm_ru: "❧ Глава III (Лист 5). Спасение живой водой и торжество чести во дворце ❧"
      tekst_ru: "Доехал Иван-царевич до родных рубежей, тепло простился с Серым Волком и прилёг отдохнуть в чистом поле под шатром. Тут наехали на него старшие братья, позавидовали чёрной завистью его богатырской добыче, погубили брата, а Жар-птицу, коня и Елену Прекрасную забрали себе, строго пригрозив ей не открывать правду отцу.\n\nНо почуял беду верный Серый Волк, прибежал в чистое поле, добыл у старого ворона живой и мёртвой воды и оживил Ивана-царевича! Промчал он друга прямо во дворец в самый час свадьбы: бросилась Елена Прекрасная к своему настоящему жениху, открылась вся правда перед царём Берендеем, а Иван-царевич на всю жизнь запомнил три великих урока Серого Волка."
  sceny_mgmt_3str:
    - scena: 1
      aforizm_ru: "❧ Глава I (Лист I из III). Срыв готовой операции из-за соблазна «золотой клетки» ❧"
      tekst_ru: "Глава I (Жар-птица и золотая клетка). У царя Берендея было три сына. Старшие братья в ночном карауле проспали, а младший, Иван-царевич, добыл перо Жар-птицы и поехал на её поиски. В дремучем лесу встретил он мудрого Серого Волка, который стал его наставником и верным другом.\n\nПримчал Волк царевича к палатам царя Афрона и дал чёткий наказ: «Бери Жар-птицу, а золотую клетку не трогай!». Взял царевич птицу, но не устоял перед блеском золотой клетки — только коснулся её, как загремела тревога и стража схватила его. За прощение пришлось взяться за новый долг — добыть Златогривого коня."
    - scena: 2
      aforizm_ru: "❧ Глава II (Лист II из III). Повторное нарушение регламента: ловушка «золотой уздечки» ❧"
      tekst_ru: "Глава II (Златогривый конь и золотая уздечка). Пожурил Серый Волк царевича, но примчал его к конюшням царя Кусмана и снова предупредил: «Выводи Златогривого коня тихонько, а золотую уздечку на стене ни за что не бери!»\n\nВошёл Иван-царевич в конюшню, взял коня, но увидел уздечку в алмазах: «Как же я такого коня без золотой уздечки поведу!». Только снял её с гвоздя — поднялась тревога по всему двору, схватили царевича конюхи, и царь Кусман потребовал в обмен привезти Елену Прекрасную."
    - scena: 3
      aforizm_ru: "❧ Глава III (Лист III из III). Личный выход Мастера и защита результата на финише ❧"
      tekst_ru: "Глава III (Елена Прекрасная и защита победы на финише). Увидев, что царевич дважды сорвал инструкцию, Серый Волк сказал: «В этот раз ты жди у дуба, а я пойду сам!». Волк лично добыл Елену Прекрасную, а своей смекалкой сохранил для царевича и Златогривого коня, и Жар-птицу.\n\nУ самой границы родного царства старшие братья из зависти напали на спящего в поле Ивана-царевича и присвоили всю его добычу. Но Серый Волк оживил друга живой водой, доставил во дворец к моменту свадьбы и вернул ему законную победу."
