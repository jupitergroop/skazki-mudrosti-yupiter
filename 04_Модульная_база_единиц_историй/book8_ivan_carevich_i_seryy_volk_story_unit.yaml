voprosy_i_zadaniya:
  tayna_skazki_2stroki_ru: "Каждая из трёх глав сказки дарит ребёнку свой золотой урок: в Главе I — не путать главное дело с блестящей клеткой, в Главе II — учиться с первого раза, в Главе III — хранить верную дружбу и честь!"
  voprosy_besedy_s_rebenkom:
    - "Вопросы к Главе I («Жар-птица и золотая клетка»): Почему старшие братья проспали в саду, а Иван-царевич добыл перо? О чём предупредил Серый Волк у терема и почему царевич не удержался и схватил золотую клетку? Что важнее — сама Жар-птица или её клетка?"
    - "Вопросы к Главе II («Златогривый конь и золотая уздечка»): Почему Иван-царевич во второй раз повторил ту же самую ошибку и снял золотую уздечку? Как поступил Серый Волк: бросил ли он друга из-за оплошности или помог исправить беду?"
    - "Вопросы к Главе III («Елена Прекрасная и зависть братьев»): Почему в третий раз Серый Волк пошёл в сад сам, а царевича оставил у дуба? Почему лесной Волк оказался вернее родных братьев, ослеплённых завистью, и как правда победила?"
  mudraya_poslovica_ru: "«Смелость города берёт, а самообладание и верный друг победу берегут!»"
  volshebnye_slova_druzhby:
    - "Я умею отличать главное дело («Жар-птицу») от блестящей приманки («золотой клетки») и держу слово."
    - "Я радуюсь успехам братьев, сестёр и друзей и никогда не пускаю в сердце зависть."
  igra_vybor_3_dorogi:
    situaciya: "Представь: родители или тренер доверили тебе важное дело и предупредили, чего делать нельзя, чтобы всё получилось. Какой путь ты выберешь?"
    variant_a_oshibka: "Путь 1 (Ошибка Глав I и II — «Схватить золотую клетку и уздечку!»): Забыть про уговор, потянуться за блестящим соблазном, нарушить правило безопасности и подвести всю команду."
    variant_b_oshibka: "Путь 2 (Ошибка старших братьев из Главы III — «Зависть и неправда»): Лентяйничать на дежурстве, завидовать чужому успеху и пытаться присвоить чужой труд нечестным путём."
    variant_v_vernyy: "★ Путь 3 — Мудрый выбор! (Иван-царевич, усвоивший уроки Серого Волка): Бодрствовать на своём посту, твёрдо держать слово наставника, учиться с первого раза и быть верным другом и братом!"
  tvorcheskoe_zadanie_risunok: "❖ Творческое задание: нарисуй любимую главу сказки — Ивана-царевича на Сером Волке и сияющую Жар-птицу!"
  naputstvie_semye_ru: "«Пусть у ваших детей будет зоркое сердце Ивана-царевича, мудрая выдержка Серого Волка и верная, нерушимая дружба на всю жизнь!»"
  praktikum_rukovoditelya_5_tochek:
    - "1. Вопрос к Главе I («Жар-птица или клетка?»): В каком проекте мы сейчас тратим время и деньги на «золотую клетку» вместо того, чтобы быстро забрать саму Жар-птицу?"
    - "2. Вопрос к Главе II («Золотая уздечка»): Где в моей компании повторяется одна и та же ошибка во второй раз из-за того, что после первого раза не был изменён регламент?"
    - "3. Вопрос к Главе III («У зелёного дуба»): Какую ключевую сделку или задачу я должен сейчас провести лично как Серый Волк, не перекладывая её на «царевича»?"
    - "4. Защита от «Старших братьев»: Защищены ли наши разработки, база клиентов и контракты от перехвата на финальной стадии?"
    - "5. Мои «Серые Волки»: Кто в моём деле играет роль верного Серого Волка и достаточно ли я ценю этот союз?"
matrica_semeynaya_2x2:
  zagolovok_ru: "❖ ЧЕТЫРЕ УРОКА СКАЗКИ ДЛЯ СЕМЬИ И ВОСПИТАНИЯ ❖"
  vvodnaya_mysl_ru: "Психология взросления ребёнка проходит ровно через три главы этой сказки: сначала мы учим ребёнка тормозить импульс («не хватай клетку»), затем — извлекать урок из ошибок без потери доверия (позиция Серого Волка), и наконец — беречь мир между братьями и сёстрами."
  os_y_vertikalnaya: "САМООБЛАДАНИЕ И ДИСЦИПЛИНА СЛОВА →"
  os_x_gorizontalnaya:
    levo_ru: "Зависть и обида на замечания"
    centr_ru: "ДОВЕРИЕ НАСТАВНИКУ И БРАТСКАЯ ВЕРНОСТЬ"
    pravo_ru: "Уважение к старшим и дружба"
  kvadraty:
    kvadrat_1_levyy_nizhniy:
      zagolovok_ru: "Урок I • Каприз и зависть — ПУТЬ СТАРШИХ БРАТЬЕВ"
      sut_ru: "Нежелание трудиться самому («сон в карауле»), нарушение всех правил и чёрная зависть к тем, кто добился успеха честным трудом."
    kvadrat_2_levyy_verhniy:
      zagolovok_ru: "Урок II • Сухое послушание без тепла — СТРАХ НАКАЗАНИЯ"
      sut_ru: "Правила соблюдаются только из страха, а между детьми в семье царит холодная конкуренция за похвалу родителей."
    kvadrat_3_pravyy_nizhniy:
      zagolovok_ru: "Урок III • Доброе сердце без выдержки — ЮНЫЙ ЦАРЕВИЧ В ГЛАВАХ I–II"
      sut_ru: "Ребёнок добрый, смелый и любящий, но из-за нехватки самоконтроля раз за разом наступает на одни и те же грабли."
    kvadrat_4_pravyy_verhniy_pravilnyy_otvet:
      zagolovok_ru: "★ ГАРМОНИЯ В СЕМЬЕ И ЖИЗНИ — СОЮЗ ЦАРЕВИЧА И СЕРОГО ВОЛКА"
      sut_ru: "Родитель выступает мудрым наставником, ребёнок учится владеть своими порывами («не трогать клетку»), а братья и сёстры стоят друг за друга горой."
  tri_roditelskih_pravila:
    - "Правило Главы I. Отделяйте Жар-птицу от клетки: Объясняйте ребёнку смысл каждого запрета: почему именно «клетка» включает тревогу и портит дело."
    - "Правило Главы II. Разбор повторной ошибки: Если ребёнок ошибся дважды — спокойно поменяйте тактику и пройдите трудный участок вместе с ним."
    - "Правило Главы III. Культ братской выручки: С детства учите детей, что родные братья и сёстры — самая главная опора на всю жизнь."
  tablica_semeynyh_situaciy:
    - situaciya: "Глава I: Ребёнок нарушил уговор, отвлёкшись на яркий соблазн"
      oshibochnaya_reakciya: "Кричать: «Я же тебе сто раз говорила!»"
      teplyy_i_mudryy_otvet: "«Смотри, как в первой главе сказки: Жар-птица была уже у тебя в руках, но ты потянулся за золотой клеткой! В следующий раз бережём главное»."
    - situaciya: "Глава II: Снова наступил на те же грабли («золотая уздечка»)"
      oshibochnaya_reakciya: "Навесить ярлык «Ты необучаемый!»."
      teplyy_i_mudryy_otvet: "«А вот и вторая глава про золотую уздечку! Давай, как Серый Волк, придумаем, как не повторить это в третий раз»."
    - situaciya: "Глава III: Ссора или зависть между детьми из-за подарка или оценки"
      oshibochnaya_reakciya: "Сравнивать детей между собой."
      teplyy_i_mudryy_otvet: "Вспомнить финал сказки: «Сила нашей семьи — когда братья и сёстры радуются друг за друга и берегут общую победу»."
metodika_i_matrica_2x2:
  paradox_skazki_ru: "Оценим команду и проекты по двум осям: Ось X — соблюдение уговора и финансово-юридической дисциплины, Ось Y — смелость, инициатива и нацеленность на добычу («Жар-птицу»)."
  kto_est_kto_4_roli:
    - "1. «Иван-царевич» — Смелый первопроходец и увлекающийся созидатель: Не спит в карауле, видит возможности («перо Жар-птицы»), но в момент успеха теряет дисциплину и тянется за блестящей мишурой («клеткой» и «уздечкой») вопреки уговору."
    - "2. «Серый Волк» — Зрелый наставник, антикризисный руководитель и Архитектор дела: Точно знает карту рисков, ставит чёткие границы задачи, а когда исполнитель дважды срывает уговор — в Главе III берёт ключевую операцию на себя."
    - "3. «Цари Афрон и Кусман» — Жёсткие кредиторы и контрагенты рынка: За любую ошибку на своей территории немедленно выставляют штрафной вексель, превращая одну простую задачу в цепочку обязательств."
    - "4. «Старшие братья» — Внутренние паразиты и охотники за чужим результатом: Просыпают всю тяжёлую работу на старте, но активизируются на финише, когда проект уже готов, чтобы присвоить плоды чужого труда."
  dve_lovushki:
    - "Глава I • Ловушка «Золотой клетки» (Вопрос: Где мы рискуем главным ради упаковки?): Жар-птица уже в руках, но исполнитель хочет «сделать ещё красивее» или выжать лишние 5% сверх договора — и срывает всю сделку. Берите суть (Жар-птицу) и выходите вовремя!"
    - "Глава II • Ловушка «Золотой уздечки» (Вопрос: Кому мы прощаем повторный срыв регламента?): Если сотрудник во второй раз нарушил прямое правило безопасности — значит, после первого раза он не сделал выводов. В третий раз поручать ему тот же шаг нельзя: «оставьте его у дуба»."
    - "★ Глава III • Секрет Серого Волка (Вопрос: Защищён ли наш результат на финише?): Критический шаг миссии выполняет лично Мастер, а на обратном пути запрещено «спать в чистом поле» (расслабляться), пока права, акты и деньги официально не закреплены во дворце."
  sekret_skazki_ru: "Один раз ошибся с клеткой — урок; второй раз с уздечкой — диагноз; в третий раз у руля встаёт сам Серый Волк."
  os_y_vertikalnaya:
    nazvanie_ru: "ИНИЦИАТИВА И СМЕЛОСТЬ («ДОБЫТЬ ЖАР-ПТИЦУ») →"
    niz_ru: "Низкая"
    verh_ru: "Высокая ↑"
  os_x_gorizontalnaya:
    nazvanie_ru: "ДИСЦИПЛИНА РЕГЛАМЕНТА И ЗАЩИТА РЕЗУЛЬТАТА"
    levo_ru: "Нарушение уговора («Хватать клетку»)"
    pravo_ru: "Точность и защита («Серый Волк»)"
  kvadraty:
    kvadrat_1_levyy_nizhniy:
      zagolovok_ru: "Квадрат 1 • Сон в карауле и зависть — СТАРШИЕ БРАТЬЯ"
      sut_ru: "Нулевая созидательная отдача на старте, отсутствие дисциплины и попытка выехать за счёт чужого результата через интриги."
    kvadrat_2_levyy_verhniy:
      zagolovok_ru: "Квадрат 2 • Увлекающийся авантюрист (Главы I–II) — ОХОТНИК ЗА ЗОЛОТЫМИ КЛЕТКАМИ"
      sut_ru: "Берётся за смелые задачи, но на каждом шаге нарушает инструкции, включает сигнализацию и обрастает новыми долгами перед контрагентами."
    kvadrat_3_pravyy_nizhniy:
      zagolovok_ru: "Квадрат 3 • Инструкция без огня — СПЯЩАЯ СТРАЖА ВО ДВОРЦЕ"
      sut_ru: "Формально стоят на посту по правилам, но не способны ни поймать Жар-птицу, ни заметить изменения на рынке."
    kvadrat_4_pravyy_verhniy_pravilnyy_otvet:
      zagolovok_ru: "★ Квадрат 4 (ПРАВЫЙ ВЕРХНИЙ УГОЛ): ТАНДЕМ «ЦАРЕВИЧ + СЕРЫЙ ВОЛК» (ГЛАВА III)"
      sut_ru: "Смелое видение цели соединено с железной дисциплиной исполнения, точным распределением ролей и полной защитой результата до финала."
  tri_pravila_perehoda_v_kvadrat_4:
    - "Правило Главы I. Принцип достаточной цели: Забрали ключевой результат («Жар-птицу») — немедленно фиксируйте сделку, не трогая «золотую клетку»."
    - "Правило Главы II. Правило двух сбоев: После второго нарушения инструкции сотрудник переводится в режим ожидания («у зелёного дуба»)."
    - "Правило Главы III. Броня на обратном пути: Проект считается завершённым только после подписания актов, оплаты и защиты авторских прав."
  tablica_rabochih_situaciy:
    - situaciya: "Глава I: Переговоры уже выиграны, но менеджер давит дальше"
      ubytschnyy_otvet: "Потянуться за «золотой клеткой» и сорвать подписанный контракт."
      pravilnyy_otvet_kvadrat_4: "Остановиться на достигнутом главном результате и спокойно закрыть сделку."
    - situaciya: "Глава II: Сотрудник во второй раз срывает дедлайн или регламент"
      ubytschnyy_otvet: "Снова поверить обещаниям и дать третью критическую задачу."
      pravilnyy_otvet_kvadrat_4: "Сказать «Жди у дуба!»: передать ключевой узел профи («Серому Волку») или закрыть лично."
    - situaciya: "Глава III: Сделка почти закрыта, команда расслабилась («сон в поле»)"
      ubytschnyy_otvet: "Оставить проект без юридического контроля перед сдачей заказчику."
      pravilnyy_otvet_kvadrat_4: "Держать «караул Серого Волка» до полного поступления средств и фиксации авторства."
    - situaciya: "Отношения с наставниками и ключевыми партнёрами"
      ubytschnyy_otvet: "Забыть о тех, кто вытащил проект из кризиса."
      pravilnyy_otvet_kvadrat_4: "Ценить и беречь своих «Серых Волков» как главный стратегический актив."
  krylatyy_slovar_komandy:
    - "«Бери Жар-птицу, а золотую клетку не трогай!» (Код Главы I) — Нам нужно забрать главный рабочий результат, не отвлекаясь на дорогую мишуру и лишний риск. (Действие: Фокусируемся строго на ядре задачи и выходим без потерь.)"
    - "«Мы опять снимаем со стены золотую уздечку!» (Код Главы II) — Команда повторяет ту же самую ошибку из-за азарта или нарушения регламента. (Действие: Немедленно останавливаем действие и возвращаемся к инструкции.)"
    - "«Ты жди у дуба, в этот раз я пойду сам!» (Код Главы III) — Задача слишком тонка и ответственна для делегирования новичку, который уже ошибался. (Действие: Руководитель или старший эксперт берёт переговоры в свои руки.)"
    - "«Не спим в чистом поле до самого дворца!» (Код финала) — Проект сделан, но ещё не сдан и юридически не защищён от «старших братьев». (Действие: Доводим оформление документов и оплату до 100% закрытия.)"
sovet_18_ekspertov:
  kontur_1_smysl_i_metodologiya:
    rol_01_dba_instrument: "Стратегический альянс с сильным экспертом-проводником (Trusted Advisor & Executive Delegation), дисциплина регламента («Не трогай золотую клетку») и защита от предательства внутри контура"
    rol_02_mckinsey_mece_proverka: "Ось X (Дисциплина соблюдения технологического регламента и слова) × Ось Y (Глубина доверия и благодарности сильному партнёру-проводнику) — переводят из самонадеянных срывов («схватил золотую клетку») к великому союзу победы (★ Кв. 4)."
    rol_03_edtech_perenos_v_privychku_24ch:
      dlya_semyi_segodnya_vecherom: "Обсудите с ребёнком правило «Слушай наставника в новом деле»: если тренер, учитель или родитель предупредил «бери саму Жар-птицу, а на блестящую клетку не зарься» — точность выполнения правила экономит три круга лишних трудностей."
      dlya_rukovoditelya_zavtra_utrom: "Проверьте 1 сложный проект выхода на новый рынок или внедрения ИИ: есть ли рядом с вами опытный «Серый Волк» (профильный архитектор/проводник) и соблюдаете ли вы его красный регламент безопасности без самодеятельности?"
    rol_04_skazochnik_transkreator: "T1 + T2 (Бережная эпическая редакция в 3 главах 6+): Сохранена вся красота большого русского эпоса (Жар-птица, Златогривый конь, Елена Прекрасная), а гибель и оживление поданы как волшебный сон и исцеление живой водой верного друга."
    rol_05_rezhisser_chteniya_vsluh_i_audio: "Былинный, торжественный распев в зачине; стремительный бег Серого Волка («земля под лапами гудит»); хрустальный звон золотой клетки и светлый колокольный финал."
    rol_06_briks_i_vostok_most: "Русский волшебный эпос: «Иван-царевич и Серый Волк»; Европа (братья Гримм «Золотая птица»); Индия («Рамаяна» — верный союз Рамы и Ханумана); Китай («Путешествие на Запад» — монах Сюаньцзан и Сунь Укун)."
  kontur_2_chetyre_auditorii:
    rol_07_deti_6_10_let: "1. Урок Главы I: Не меняй главное сокровище на блестящую мишуру и слушай совет наставника. 2. Урок Главы II: Учись с первого раза и не повторяй старую ошибку у золотой уздечки. 3. Урок Главы III: Храни верность друзьям и родным — правда всегда побеждает зависть."
    rol_08_semya_i_60_plyus: "100% чистый русский язык без англицизмов и жаргона; уважение к бабушкам и дедушкам (60+) как хранителям семейного лада."
    rol_09_upravlency_mba: "1. Тренируйте выдержку: Умение вовремя остановить руку перед «клеткой» — основа взрослой воли. 2. Наставничество с любовью: Обучайте на ошибках, оставаясь для ребёнка надёжным тылом. 3. Берегите единство детей: Воспитывайте в братьях и сёстрах взаимную радость вместо соперничества."
    rol_10_predprinimateli_sovladelcy: "Один раз ошибся с клеткой — урок; второй раз с уздечкой — диагноз; в третий раз у руля встаёт сам Серый Волк."
  kontur_3_vizual_produkt_pravo:
    rol_11_hudozhnik_illyustrator: "Пресет STYLE_1_RUSSIAN_TEREM, палитра #fbf6ec, #7a1c14, #b88938, #1e352f"
    rol_12_infodizayner_matric: "Правильный ответ всегда закреплён в Правом Верхнем Углу (★ Квадрат 4) с золотой рамкой и мгновенным считыванием за 3 секунды."
    rol_13_verstalshchik_gost: "Эталон 13 страниц (1 обложка + 12 страниц блока по ГОСТ Р 7.0.4-2020), висячие строки = 0, воздух ≥ 25%."
    rol_14_inzhener_pechati_kdp: "CMYK FOGRA39 (TAC ≤ 240%), вылеты 3.2 мм (0.125 in); индивидуальный выпуск 13 стр. для Kindle eBook + сборка в тома по 3 сказки (36 стр.) для KDP Paperback и по 8 сказок (108 стр.) для KDP Hardcover."
    rol_15_ii_pedagog_sokrat: "Сократический режим: ИИ-наставник сначала задаёт наводящий вопрос по сказке и хвалит за размышление; не собирает персональные данные детей (Zero PII)."
