celi_i_klyuchi:
  cel_rebenka_6plus: "Обманщики напугали взрослых тем, что «ткань не видит только глупец», и все стали врать из страха показаться глупыми. И только маленький мальчик не побоялся сказать чистую правду!"
  cel_roditelya_i_lidera: "Каждый раз, когда в компании обсуждается сложный проект или отчёт, за столом незримо присутствуют эти четыре персонажа:"
  zolotoy_klyuchik_malym_ru: "1. Верь своим глазам: Если станок пустой — не бойся сказать об этом честно. 2. Спрашивать не стыдно: Тот, кто задаёт вопросы, становится по-настоящему умным. 3. Цени суть, а не наряд: Ум, доброта и мастерство в сто раз важнее любых кафтанов."
  zolotoy_klyuchik_bolshim_ru: "1. Культура правды дома: Дом, где не страшно признаться в незнании, растит сильных лидеров. 2. Иммунитет к толпе: Учите детей распознавать манипуляцию «это видят только умные». 3. Быть, а не казаться: Личный пример родителей без показухи — лучший учебник честности."
  deviz_skazki_ru: "«Чистое сердце и честный взгляд видят правду там, где все молчат из страха»"
  deviz_upravleniya_ru: "«Компания начинает гибнуть в тот день, когда министры боятся сказать королю, что станок пуст»"
tekst_istorii:
  predislovie_avtora_ru: "Шедевр Х. К. Андерсена 1837 года «Новое платье короля» остаётся самым точным зеркалом и для семей, и для советов директоров: почему умные люди молчат перед очевидным обманом — и как один честный голос возвращает всем свободу и ясность. Почему целый город взрослых людей — от седого министра и самого короля до тысяч горожан на площади — громко восхищался пустым местом и боялся сказать правду? Потому что обманщики сыграли на человеческом страхе: «Кто не видит нашей ткани — тот глуп!». И каждый побоялся признаться, что ничего не видит. И только маленький мальчик с чистым и смелым сердцем звонко сказал то, что видел на самом деле: «А король-то голый!». Для ребёнка и подростка эта сказка — лучшая защита от давления толпы, ложной моды и страха задать честный вопрос на уроке или в жизни."
  predislovie_upravlenie_ru: "В мировом менеджменте сказка Андерсена «Новое платье короля» считается самым точным описанием институциональной слепоты. Как получается, что серьёзные корпорации и опытные собственники тратят миллионы на абсолютно пустые консалтинговые прожекты, неработающие ИТ-системы и дутые рекламные кампании, а вся команда единогласно аплодирует? Механизм всегда один и тот же: продавцы «воздуха» ставят условие — «кто не понимает гениальности нашего решения, тот отстал от жизни и сидит не на своём месте!». И дальше включается цепная реакция страха от топ-менеджера до рядового сотрудника. Перечитаем сказку и выстроим защиту от «невидимой ткани»."
  sceny_family_5str:
    - scena: 1
      aforizm_ru: "❧ Лист I. Король-модник и хитрая уловка заморских обманщиков ❧"
      tekst_ru: "Жил-был в одном королевстве король, который больше всего на свете любил новые наряды. Он менял кафтаны каждый час и тратил на бархат да парчу всю казну. И вот однажды явились в столицу два ловких обманщика, назвались заморскими ткачами и объявили, будто умеют ткать чудесную ткань небывалой красоты.\n\nА главное свойство этой ткани, по их словам, состояло в том, что она становится невидимой для всякого человека, который глуп или сидит не на своём месте! «Вот так диковина! — подумал король. — В таком платье я сразу узнаю, кто из моих вельмож умён, а кто глуп!» — и велел выдать ткачам сундуки золота и тончайшего шёлка."
    - scena: 2
      aforizm_ru: "❧ Лист II. Пустые станки и работа ножницами по воздуху ❧"
      tekst_ru: "Поставили мнимые ткачи во дворце два больших ткацких станка, спрятали царское золото и шёлк в свои дорожные сумы, а сами с утра до поздней ночи усердно махали локтями перед пустыми рамами да резали воздух большими ножницами без единой нитки.\n\nСкоро захотелось королю узнать, как движется работа, да страшновато стало идти самому. Решил он сперва послать своего самого честного старого министра: «Уж он-то человек умный и заслуженный, он всё разглядит лучше других!»"
    - scena: 3
      aforizm_ru: "❧ Лист III. Испуг старого министра: «Нельзя признаться, что я ничего не вижу!» ❧"
      tekst_ru: "Вошёл старый министр в мастерскую, протёр очки, посмотрел на пустые станки — и похолодел от страха: на рамах не было ни единой ниточки! А обманщики знай себе кланяются да спрашивают: «Не правда ли, дивный узор и какие благородные краски?»\n\n«Неужели я глуп и не гожусь для своей высокой должности? — испугался старый министр. — Ни в коем случае нельзя в этом сознаваться!». И он громко похвалил пустую раму, тщательно запомнил названия узоров и доложил королю, что ткань поистине восхитительна!"
    - scena: 4
      aforizm_ru: "❧ Лист IV. Король и свита восхищаются пустотой из страха показаться глупыми ❧"
      tekst_ru: "Вскоре пришёл взглянуть на ткань и сам король со всей придворной свитой. Глянул король на пустой станок — и у него замерло сердце: «Что за притча! Я ничего не вижу! Неужели я глуп и не достоин быть королём?!»\n\nИ чтобы никто ничего не заподозрил, король важно закивал головой и воскликнул: «О, это бесподобно! Высшее одобрение!». А все царедворцы смотрели на пустые станки, ничего не видели, но наперебой поддакивали королю и советовали непременно надеть новое платье на праздничное шествие!"
    - scena: 5
      aforizm_ru: "❧ Лист V. «А король-то голый!» — как один честный детский голос рассеял всеобщий обман ❧"
      tekst_ru: "В день праздника обманщики сделали вид, будто облачают короля в невидимые одежды, а камергеры с важным видом подняли с пола воздух, словно несли длинный шлейф мантии. Вышел король под роскошным балдахином на главную площадь, и все горожане из страха показаться глупцами громко кричали: «Какой бесподобный наряд! Какой дивный шлейф!»\n\nКак вдруг маленький мальчик с чистым сердцем звонко крикнул: «Да ведь на короле ничего нет! А король-то голый!». И тут весь народ зашумел: «Мальчик говорит правду — король-то голый!». Понял король, что его провели, но из ложной гордости ещё выше задрал нос, а свита продолжала нести за ним несуществующий шлейф."
  sceny_mgmt_3str:
    - scena: 1
      aforizm_ru: "❧ Лист I из III. Ловушка «невидимой ткани»: шантаж компетентностью и первый ложный отчёт ❧"
      tekst_ru: "В одном королевстве жил король, помешанный на внешних атрибутах и нарядах. Явились во дворец два ловких афериста и пообещали соткать чудесную ткань, которая «невидима для всякого, кто глуп или не годится для своей должности». Король щедро выдал им золото и шёлк.\n\nАферисты спрятали золото в сумы и принялись день и ночь щёлкать челноками на пустых станках. Послал король проверить работу своего лучшего старого министра. Министр увидел пустые рамы, но испугался потерять должность и доложил королю, что ткань и узоры великолепны!"
    - scena: 2
      aforizm_ru: "❧ Лист II из III. Круговая порука страха: когда первое лицо и свита утверждают иллюзию ❧"
      tekst_ru: "Пришёл в мастерскую сам король со свитой. Увидев пустые станки, король ужаснулся: «Неужели я глуп и не достоин трона?». И, спасая лицо, громко восхитился пустотой. Вся свита тут же единогласно подтвердила восторг монарха.\n\nВ день торжественного шествия камергеры несли за королём воздух вместо шлейфа, а горожане на улицах боялись прослыть дураками и кричали: «Какой бесподобный наряд!»"
    - scena: 3
      aforizm_ru: "❧ Лист III из III. Разрушение иллюзии одним честным голосом и инерция ложной гордости ❧"
      tekst_ru: "Как вдруг маленький мальчик, не включённый в придворную иерархию страха, громко сказал очевидный факт: «Да ведь на короле ничего нет! А король-то голый!»\n\nПравда мгновенно пронеслась по площади. Король понял, что обманут, но из ложной гордости продолжил шествие, а камергеры шли следом, поддерживая несуществующую мантию."
