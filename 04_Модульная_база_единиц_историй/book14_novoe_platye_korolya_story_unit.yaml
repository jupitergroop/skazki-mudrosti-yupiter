      sut_ru: "Жизнь напоказ («казаться, а не быть»), погоня за пустыми модными ярлыками и готовность поддакивать любой неправде ради одобрения толпы."
    kvadrat_2_levyy_verhniy:
      zagolovok_ru: "Урок II • Честный, но робкий — МОЛЧАЩИЙ ГОРОЖАНИН"
      sut_ru: "Ребёнок видит, что в компании творится неправда или травля, в душе не согласен, но молчит из страха оказаться в меньшинстве."
    kvadrat_3_pravyy_nizhniy:
      zagolovok_ru: "Урок III • Спор ради спора — УПРЯМЫЙ НАСМЕШНИК"
      sut_ru: "Ребёнок не зависит от чужого мнения, но выражает это через грубость и неуважение к старшим без поиска истины."
    kvadrat_4_pravyy_verhniy_pravilnyy_otvet:
      zagolovok_ru: "★ ГАРМОНИЯ В СЕМЬЕ И ЖИЗНИ — ЯСНЫЙ ВЗГЛЯД И ЧЕСТНЫЙ ГОЛОС"
      sut_ru: "В семье поддерживают право ребёнка на честный вопрос и собственное мнение, воспитывая тактичную, но непреклонную верность правде."
  tri_roditelskih_pravila:
    - "Правило 1. Поощряйте честный вопрос: Хвалите ребёнка каждый раз, когда он не постеснялся переспросить непонятное."
    - "Правило 2. Разбирайте уловку «Кто не с нами — тот глупый»: Объясните детям: этой фразой пользуются только «ткачи-обманщики», когда им нечего показать на деле."
    - "Правило 3. Быть, а не казаться: В семейном бюджете ставьте образование, здоровье и книги выше пустой ярмарки тщеславия."
  tablica_semeynyh_situaciy:
    - situaciya: "Ребёнок боится поднять руку в классе, когда не понял тему, чтобы не засмеяли"
      oshibochnaya_reakciya: "Ругать за плохую оценку."
      teplyy_i_mudryy_otvet: "«Вспомни старого министра у пустого станка! Глупым выглядит не тот, кто честно спросил, а тот, кто промолчал и сделал вид, что понял»."
    - situaciya: "Подросток требует купить пустую, но «модную у всех блогеров» вещь"
      oshibochnaya_reakciya: "Просто отказать в резкой форме."
      teplyy_i_mudryy_otvet: "Разобрать вместе с улыбкой: «Давай посмотрим — там правда есть чудесная ткань или это невидимое платье короля за большие деньги?»"
    - situaciya: "В школьном чате или классе все поддакивают несправедливости"
      oshibochnaya_reakciya: "Учить ребёнка «быть как все и не высовываться»."
      teplyy_i_mudryy_otvet: "Поддержать его внутреннее чувство правды: спокойное и вежливое слово честного человека меняет атмосферу во всём коллективе."
metodika_i_matrica_2x2:
  paradox_skazki_ru: "Построим карту по двум осям: Ось X — психологическая безопасность говорить правду в команде, Ось Y — опора на твёрдые факты и измеримый продукт (вместо внешней мишуры)."
  kto_est_kto_4_roli:
    - "1. «Заморские ткачи» — Продавцы модного воздуха и токсичные подрядчики: Используют сложный наукообразный жаргон и психологический шантаж: «Если вы не видите эффекта от нашей стратегии — вы просто ретрограды!». Прячут бюджет в сумы, имитируя бурную работу на пустых станках."
    - "2. «Старый министр и свита» — Заложники карьерного страха («Потёмкинская отчётность»): Даже честные и опытные руководители начинают рисовать зелёные отчёты о несуществующих успехах, если в компании стыдно или опасно принести плохую новость."
    - "3. «Король на шествии» — Лидер, попавший в плен собственного имиджа: Даже когда провал проекта уже очевиден («король голый»), продолжает финансировать убыточное направление, чтобы не признавать свою ошибку публично."
    - "4. «Мальчик на площади (Внутренний Аудитор Квадрата 4)» — Голос твёрдых фактов: Независимый взгляд (честный аналитик, тайный покупатель, прямая метрика кассы), который оценивает проект только по реальному наличию «ткани на станке»."
  dve_lovushki:
    - "Ловушка 1 — Покупка сложных технологий и консалтинга без проверки «на ощупь»: Аферисты всегда продают то, что «нельзя пощупать сегодня, а понять могут только избранные». В зрелом бизнесе действует правило: если подрядчик не может простыми словами объяснить механику прибыли и показать твёрдый образец ткани — станок пуст!"
    - "Ловушка 2 — Культура, где за плохую правду наказывают («Смерть гонца»): Почему министр соврал королю? Потому что сам король задал правило: «Кто не видит ткани — тот профнепригоден». Если собственник морщится от честных докладов о проблемах, через месяц вся его команда будет единогласно хвалить пустые станки."
    - "★ Секрет Зрелого Лидера — Награда за фразу «На станке нет ниток!»: Лидер Квадрата 4 первым задаёт простые вопросы и премирует сотрудника, который вовремя остановил неэффективный проект на ранней стадии."
  sekret_skazki_ru: "Любая стратегия, которую нельзя проверить простым вопросом ребёнка и цифрой в кассе, — это невидимое платье короля."
  os_y_vertikalnaya:
    nazvanie_ru: "ОПОРА НА ТВЁРДЫЕ ФАКТЫ И ПРОДУКТ →"
    niz_ru: "Низкая"
    verh_ru: "Высокая ↑"
  os_x_gorizontalnaya:
    nazvanie_ru: "КУЛЬТУРА ОТКРЫТОЙ ПРАВДЫ И ПРЯМОЙ ОБРАТНОЙ СВЯЗИ"
    levo_ru: "Страх оценки («Молчание свиты»)"
    pravo_ru: "Смелость сказать («Станок пуст!»)"
  kvadraty:
    kvadrat_1_levyy_nizhniy:
      zagolovok_ru: "Квадрат 1 • Торжественное шествие в пустоте — ДВОРЕЦ ГОЛОГО КОРОЛЯ"
      sut_ru: "Культ внешней показухи, единогласные «зелёные отчёты» при пустой кассе и продолжение убыточного курса ради сохранения лица."
    kvadrat_2_levyy_verhniy:
      zagolovok_ru: "Квадрат 2 • Скрытая проверка в одиночку — ОДИНОКИЙ КОНТРОЛЁР"
      sut_ru: "Руководитель пытается сам проверять все цифры, но команда боится говорить ему о рисках вслух. Половина проблем вскрывается слишком поздно."
    kvadrat_3_pravyy_nizhniy:
      zagolovok_ru: "Квадрат 3 • Разговоры без твёрдых метрик — ШУМНАЯ ПЛОЩАДЬ"
      sut_ru: "Все открыто критикуют всё подряд, но нет чётких критериев приёмки результата и дисциплины исполнения."
    kvadrat_4_pravyy_verhniy_pravilnyy_otvet:
      zagolovok_ru: "★ Квадрат 4 (ПРАВЫЙ ВЕРХНИЙ УГОЛ): ЗОРКАЯ КОМАНДА И НАСТОЯЩАЯ ТКАНЬ"
      sut_ru: "Каждый проект проверяется на твёрдую пользу, а любой сотрудник может открыто сказать «здесь пустой станок!» и получить за это благодарность лидера."
  tri_pravila_perehoda_v_kvadrat_4:
    - "Правило 1. Закон физического образца: Никаких оплат за «щелканье пустыми челноками»: каждый этап проекта должен сдаваться осязаемым результатом."
    - "Правило 2. Премия для «Мальчика»: Официально назначьте в каждом проекте роль Критика-Ревьюера, чья обязанность — искать пустые места."
    - "Правило 3. Остановка шествия без ложной гордости: Узнали, что проект пуст, — закройте его в ту же секунду, не несите дальше «воздушный шлейф»."
  tablica_rabochih_situaciy:
    - situaciya: "Подрядчик презентует сложную систему, засыпанную модными терминами"
      ubytschnyy_otvet: "Кивать с умным видом, боясь показаться несовременным."
      pravilnyy_otvet_kvadrat_4: "Сказать прямо: «Переведите на русский язык: где здесь нитки на станке и сколько денег это принесёт в кассу?»"
    - situaciya: "Совещание, где все единогласно хвалят сырой проект первого лица"
      ubytschnyy_otvet: "Принять лесть свиты за чистую монету."
      pravilnyy_otvet_kvadrat_4: "Спросить: «А теперь пусть каждый назовёт по одному риску, почему этот король может оказаться голым!»"
    - situaciya: "Сотрудник принёс горькую правду о том, что гипотеза не сработала"
      ubytschnyy_otvet: "Наказать или обвинить в некомпетентности."
      pravilnyy_otvet_kvadrat_4: "Поблагодарить за честность, сэкономившую компании месяцы работы вхолостую."
    - situaciya: "Убыточный проект, в который уже вложено много денег и гордости"
      ubytschnyy_otvet: "Продолжать «шествие под балдахином», чтобы не признавать ошибку."
      pravilnyy_otvet_kvadrat_4: "Немедленно остановить убытки и переключить ресурсы на реальную ткань."
  krylatyy_slovar_komandy:
    - "«Друзья, покажите нитки на станке — хватит щёлкать пустыми челноками!» — Отчёт полон рассказов о процессе, но нет ни одного готового результата. (Действие: Переводим разговор с процесса на проверку конкретного продукта.)"
    - "«Мы сейчас играем в старого министра или говорим как есть?» — Команда замалчивает очевидную проблему из боязни расстроить руководство. (Действие: Даём полную безопасность для озвучивания реальной картины.)"
    - "«Давайте честно: а король-то в этом проекте не голый?» — Красивая презентация или модная идея не имеет под собой твёрдой экономики. (Действие: Проводим жёсткий стресс-тест бизнес-модели.)"
    - "«Бросаем нести воздушный шлейф!» — Пора прекратить тратить время и бюджет на направление, которое уже доказало свою нежизнеспособность. (Действие: Закрываем иллюзорный проект без сожалений.)"
sovet_18_ekspertov:
