voprosy_i_zadaniya:
  tayna_skazki_2stroki_ru: "Обманщики напугали взрослых тем, что «ткань не видит только глупец», и все стали врать из страха показаться глупыми. И только маленький мальчик не побоялся сказать чистую правду!"
  voprosy_besedy_s_rebenkom:
    - "1. На какую хитрую удочку поймали обманщики короля и министров: Почему старый министр и сам король побоялись честно сказать: «На станке пусто!»? Чего они испугались больше — потери золота или чужого мнения?"
    - "2. Почему правду смог сказать именно маленький ребёнок: Мальчик не боялся потерять важную должность и не хотел притворяться — он просто доверял своим честным глазам и чистому сердцу!"
    - "3. Бывает ли «новое платье короля» в школе или во дворе: Когда ребята говорят: «Кто с нами так не делает или не знает этого — тот глупый!», или когда на уроке ты чего-то не понял, но стесняешься поднять руку и спросить."
  mudraya_poslovica_ru: "«Лучше задать честный вопрос и узнать правду, чем кивать вместе со всеми и остаться обманутым!»"
  volshebnye_slova_druzhby:
    - "Я никогда не боюсь признаться, если чего-то не знаю или не понял: спросить — признак ума, а не глупости."
    - "Я думаю своей головой и не повторяю неправду даже тогда, когда её говорят все вокруг."
  igra_vybor_3_dorogi:
    situaciya: "Представь: в школе учитель объяснил трудную тему, но ты её не понял; или компания ребят называет глупую и плохую выходку «самой модной и крутой». Какой путь ты выберешь?"
    variant_a_oshibka: "Путь 1 (Как Король и свита — «Притвориться из страха»): Важно кивать головой, делать вид, что всё понимаешь, или повторять за толпой неправду, лишь бы никто не засмеялся."
    variant_b_oshibka: "Путь 2 (Как Хитрые ткачи — «Брать других на слабо»): Самому дразнить ребят фразами «Кто так не сделает — тот трус и глупец!», заставляя их поступать плохо."
    variant_v_vernyy: "★ Путь 3 — Мудрый выбор! (Смелый и честный голос правды): Не бояться чужого смеха: если не понял на уроке — смело поднять руку и спросить; а если видишь неправду или глупость — спокойно сказать: «А король-то голый!»"
  tvorcheskoe_zadanie_risunok: "❖ Творческое задание: нарисуй смелого мальчика на городской площади и важную процессию под балдахином!"
  naputstvie_semye_ru: "«Пусть ваши дети растут с чистым зрением сердца, никогда не меняют правду на мишуру и смело идут по жизни своим честным путём!»"
  praktikum_rukovoditelya_5_tochek:
    - "1. Ревизия «пустых станков»: Нет ли у нас сейчас подрядчика или проекта, который много месяцев «машет локтями», но ещё не выдал ни одного метра реальной ткани?"
    - "2. Тест на страх министра: Насколько легко моим руководителям прийти ко мне и сказать: «Этот проект не работает, нужно менять курс»?"
    - "3. Иммунитет к пустой моде: Не покупаем ли мы какие-то инструменты или статусные вещи только ради того, чтобы «выглядеть современно в глазах рынка»?"
    - "4. Наличие независимого «Мальчика»: Есть ли у меня система независимого контроля (ИИ-тайный покупатель, сквозная аналитика, критик), которой всё равно на должности и регалии?"
    - "5. Свобода от ложной гордости: Готов ли я в одну минуту остановить неверное решение, не продолжая «шествие по площади» ради спасения лица?"
matrica_semeynaya_2x2:
  zagolovok_ru: "❖ ЧЕТЫРЕ УРОКА СКАЗКИ ДЛЯ СЕМЬИ И ВОСПИТАНИЯ ❖"
  vvodnaya_mysl_ru: "Для родителей подрастающих детей нет задачи важнее, чем сформировать у ребёнка иммунитет к манипуляции «Все так делают, а кто против — тот белая ворона!». Сказка Андерсена даёт ребёнку мощную опору на собственный здравый смысл."
