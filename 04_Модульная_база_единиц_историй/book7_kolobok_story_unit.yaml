celi_i_klyuchi:
  cel_rebenka_6plus: "Тот, кто замышляет недоброе, редко рычит как Медведь — чаще он улыбается как Лиса и хвалит тебя, чтобы ты сам подошёл поближе и забыл об осторожности!"
  cel_roditelya_i_lidera: "Сказка показывает фундаментальную разницу между прямым силовым давлением («Медведь») и тонким перехватом управления через тщеславие лидера («Лиса»)."
  zolotoy_klyuchik_malym_ru: "1. Береги связь с домом: Никогда не убегай без спроса от тех, кто тебя любит и бережёт. 2. Не зазнавайся в победе: Хвастовство закрывает глаза и мешает увидеть опасность. 3. Держи дистанцию с хитрецами: Чем слаще незнакомец зовёт поближе — тем быстрее зови родителей."
  zolotoy_klyuchik_bolshim_ru: "1. Учите распознавать лесть: Манипуляторы опаснее открытых хулиганов — разбирайте их приёмы заранее. 2. Наполняйте ребёнка теплом дома: Ребёнок, любимый в семье, не ищет сомнительной похвалы на стороне. 3. Доверие без страха: Пусть ребёнок знает, что с любой тревогой он может сразу прийти к вам."
  deviz_skazki_ru: "«Похвалу слушай с улыбкой, а безопасную дистанцию держи крепко»"
  deviz_upravleniya_ru: "«Прямая угроза собирает волю в кулак, а сладкая лесть усыпляет службу безопасности»"
tekst_istorii:
  predislovie_avtora_ru: "Родной брат европейского «Пряничного человечка» и басни Эзопа о Вороне и Лисице, сказка «Колобок» — лучший урок для детей и руководителей о том, как сладкая лесть усыпляет бдительность после первых побед. Мы с пелёнок знаем сказку про Колобка, но редко задумываемся, какой мощный урок безопасности и трезвости ума вложили в неё наши предки! Ведь Колобок не испугался ни Зайца, ни Волка, ни огромного Медведя, которые прямо говорили: «Я тебя съем!». От открытой угрозы ребёнок всегда знает, что нужно держаться подальше. А попался Колобок тогда, когда хитрая Лиса стала его нахваливать: «Какой ты пригожий, какая у тебя славная песенка, сядь ко мне на носок!». Эта книга научит вашего ребёнка не терять голову от чужой приторной похвалы на улице и в интернете и никогда не уходить без спроса из родного дома."
  predislovie_upravlenie_ru: "Если изучить историю громких банкротств и потерь капитала, откроется поразительный факт: сильные предприниматели и руководители почти никогда не гибнут от первых кризисов («Зайца, Волка и Медведя»). Открытое давление рынка, наоборот, мобилизует лидера и включает предельную скорость. Самая опасная точка в судьбе компании наступает сразу после серии ярких побед, когда у первого лица начинается головокружение от успехов («Я от всех ушёл!»). Именно в этот момент на дороге появляется «Лиса», которая не спорит и не атакует в лоб, а поёт оду вашей гениальности и просит «шагнуть на носок» без проверок и залогов. Перечитаем сказку и выстроим защиту Квадрата 4."
  sceny_family_5str:
    - scena: 1
      aforizm_ru: "❧ Лист I. Румяный Колобок на резном окошке родного дома ❧"
      tekst_ru: "Жили-были старик со старухой. Вот однажды и просит старик ласково: «Испеки-ка мне, старая, румяный колобок!» — «Да из чего печь-то? Муки ведь в ларе не осталось!» — «Эх, старушка! По амбару помети, по сусекам поскреби — вот и наберётся горсти две!»\n\nВзяла старушка гусиное крылышко, по амбару помела, по сусекам поскребла и набрала муки пригоршни две. Замесила тесто на густой сметане, скатала круглый колобок, изжарила его в топлёном масле да и положила на резное окошко простынуть."
    - scena: 2
      aforizm_ru: "❧ Лист II. Побег за ворота и первая лёгкая удача со встречным Зайцем ❧"
      tekst_ru: "Полежал Колобок на окошке, на солнышко поглядел, да и надоело ему смирно лежать: покатился он с окна на лавку, с лавки на пол, по полу к дверям, прыг через порог — в сени, из сеней на крыльцо, с крыльца на широкий двор, а со двора за ворота — дальше и дальше в зелёный лес!\n\nКатится Колобок по лесной дороге, а навстречу ему Косой Заяц бежит: «Колобок, Колобок! Я тебя съем!» — «Не ешь меня, Косой Зайчик, я тебе песенку спою: я Колобок, Колобок, по амбару метён, по сусекам скребён, на сметане мешён, в печку сажён, на окошке стужён! Я от дедушки ушёл, я от бабушки ушёл, а от тебя, Зайца, и подавно уйду!» — и покатился себе дальше!"
    - scena: 3
      aforizm_ru: "❧ Лист III. Встреча с Волком и Медведем: как три победы вскружили голову ❧"
      tekst_ru: "Катится Колобок по тропинке, а навстречу ему из чащи серый Волк выходит: «Колобок, Колобок, я тебя съем!». Запел Колобок свою хвастливую песенку — как от дедушки ушёл, от бабушки ушёл, от зайца ушёл — и от Волка укатился, только Волк его и видел!\n\nКатится дальше по сосновому бору, а навстречу ему косолапый Медведь идёт, хворост ломает, кусты к земле гнёт: «Колобок, Колобок, я тебя съем!» — «Где тебе, косолапому, съесть меня!» — засмеялся Колобок, пропел ему свою песню и ещё быстрее покатился по дорожке, думая, что теперь ему в целом свете никто не страшен."
    - scena: 4
      aforizm_ru: "❧ Лист IV. Медовая похвала Лисы Патрикеевны на лесной полянке ❧"
      tekst_ru: "Катится Колобок по солнечной полянке, а навстречу ему идёт Лиса Патрикеевна — поступь мягкая, шубка пушистая, глаза ласковые: «Здравствуй, Колобок! Какой же ты пригожий, румяный да душистый!»\n\nОбрадовался Колобок такой похвале, загордился ещё пуще и тут же запел свою любимую песню про то, как от дедушки, бабушки, зайца, волка и медведя ушёл. А Лисица слушает, головку набок склонила да ласково так приговаривает: «Ах, песенка какая славная! Да вот беда, голубчик: стара я стала, плохо слышу. Сядь-ка ко мне на носок да пропой ещё разок, погромче!»"
    - scena: 5
      aforizm_ru: "❧ Лист V. Роковой прыжок на носок: цена хвастовства и доверчивости к лести ❧"
      tekst_ru: "Растаял от сладких лисьих слов хвастливый Колобок, забыл про всякую осторожность, прыгнул Лисе прямо на нос и запел во весь голос свою песенку. А Лиса ему опять ещё ласковее шепчет: «Спасибо, Колобок! Славная песенка, ещё бы век слушала! Сядь-ка ко мне на язычок да пропой в последний разок!»\n\nПрыгнул глупый Колобок Лисе на язык, а Лиса — ам его! — и съела. Так и закончилось путешествие того, кто без спроса убежал из родного дома, смеялся над прямой опасностью, но потерял голову от первой же хитрой лести."
  sceny_mgmt_3str:
    - scena: 1
      aforizm_ru: "❧ Лист I из III. Отрыв от базы и три лёгкие победы над прямыми угрозами ❧"
      tekst_ru: "Жили-были старик со старухой. Попросил старик испечь колобок. Старуха по амбару помела, по сусекам поскребла, набрала две горсти муки, замесила на сметане, изжарила в масле и положила на окошко остыть. А Колобок полежал-полежал да и покатился со двора за ворота — прямо в незнакомый лес.\n\nКатится по дороге, а навстречу ему Заяц, затем — серый Волк, а после — косолапый Медведь. Каждый грозит в лоб: «Колобок, Колобок, я тебя съем!». И от каждого Колобок легко укатывается со своей победной песней: «Я по амбару метён, по сусекам скребён, от дедушки и бабушки ушёл, а от вас и подавно уйду!»"
    - scena: 2
      aforizm_ru: "❧ Лист II из III. Смена тактики противника: удар лестью в самое тщеславие ❧"
      tekst_ru: "После трёх побед подряд уверовал Колобок в свою полную неуязвимость. Катится по лесу, а навстречу ему Лиса Патрикеевна — не грозит, а восхищается: «Здравствуй, Колобок! Какой же ты пригожий, румяный да успешный!»\n\nГордо запел Колобок свою старую песню, а Лиса ласково вздохнула: «Ах, песенка какая славная! Да вот беда, голубчик: стара я стала, плохо слышу. Сядь-ка ко мне на носок да пропой ещё разок, погромче!»"
    - scena: 3
      aforizm_ru: "❧ Лист III из III. Добровольный прыжок в пасть из-за потери критического мышления ❧"
      tekst_ru: "Ослеплённый комплиментами, Колобок сам нарушил безопасную дистанцию и прыгнул Лисе на нос. А Лиса прошептала: «Спасибо, голубчик! Сядь-ка теперь ко мне на язычок да пропой в последний разок!»\n\nПрыгнул Колобок Лисе на язык, а Лиса — ам его! — и съела. Так погиб игрок, который легко побеждал силовое давление, но не выдержал испытания лестью."
