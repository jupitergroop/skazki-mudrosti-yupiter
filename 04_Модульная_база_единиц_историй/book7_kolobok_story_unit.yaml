voprosy_i_zadaniya:
  tayna_skazki_2stroki_ru: "Тот, кто замышляет недоброе, редко рычит как Медведь — чаще он улыбается как Лиса и хвалит тебя, чтобы ты сам подошёл поближе и забыл об осторожности!"
  voprosy_besedy_s_rebenkom:
    - "1. С какой первой ошибки начались приключения Колобка: Бабушка и дедушка испекли Колобка с любовью и положили на окошко, а он без спроса укатился за ворота в тёмный лес. Почему опасно убегать далеко от родителей?"
    - "2. Чем хитрая Лиса отличалась от Зайца, Волка и Медведя: Волк и Медведь пугали прямо, и Колобок держался от них на расстоянии. А какими ласковыми словами Лиса заставила Колобка самого прыгнуть к ней на нос?"
    - "3. Как отличить искреннюю похвалу от «песни Лисы»: Мама, папа и учитель хвалят тебя за добрый труд. А если незнакомец на улице или в онлайн-игре называет тебя «самым крутым» и просит подойти ближе или сказать секрет — что нужно делать?"
  mudraya_poslovica_ru: "«Сладкую похвалу проверяй умом, а от чужой Лисы держись подальше!»"
  volshebnye_slova_druzhby:
    - "Я никогда не ухожу со двора без спроса и не подхожу близко к незнакомым людям."
    - "Если кто-то чужой на улице или в телефоне слишком сладко хвалит меня и просит о секрете — я сразу расскажу родителям."
  igra_vybor_3_dorogi:
    situaciya: "Представь: ты одержал победу или гуляешь во дворе, а незнакомый человек (или кто-то в интернете) начинает громко восхищаться тобой и просит подойти поближе либо выдать семейный секрет. Какой путь ты выберешь?"
    variant_a_oshibka: "Путь 1 (Как Хвастливый Колобок — «Мне все нипочём!»): Зазнаться после первых удач, никого не слушать, убегать без спроса и хвастаться перед каждым встречным."
    variant_b_oshibka: "Путь 2 (Доверчивый прыжок «Лисе на носок»): Растаять от чужих комплиментов, подойти близко к незнакомцу или отправить в игре чужому человеку телефон и код родителей."
    variant_v_vernyy: "★ Путь 3 — Мудрый выбор! (Скромный, смелый и бдительный): Радоваться своим успехам без хвастовства, никогда не уходить без разрешения родителей, а при любой подозрительной лести держать дистанцию и сразу звать маму с папой!"
  tvorcheskoe_zadanie_risunok: "❖ Творческое задание: нарисуй румяного Колобка на уютном окошке у бабушки и дедушки или на лесной тропинке!"
  naputstvie_semye_ru: "«Пусть ваши дети растут смелыми, радостными и зоркими умом, всегда чувствуют тёплую опору родного дома и легко отличают правду от лукавой лести!»"
  praktikum_rukovoditelya_5_tochek:
    - "1. Проверка на головокружение: Не появилась ли у меня или у команды после недавних побед опасная уверенность, что «нам теперь море по колено»?"
    - "2. Ревизия льстецов в окружении: Есть ли рядом со мной люди, которые могут честно указать на ошибку, или все вокруг только хвалят мою «песенку»?"
    - "3. Защита дистанции в сделках: Не просит ли кто-то из новых партнёров «шагнуть на носок» (работать без предоплаты и гарантий) под сладкие речи о партнёрстве?"
    - "4. Обновление «песни»: Не пытаемся ли мы решать новые сложные задачи старым методом, который работал только против простых «Зайцев»?"
    - "5. Связь с базой и корнями: Сохранён ли у бизнеса крепкий финансовый и юридический тыл («дом дедушки и бабушки»)?"
matrica_semeynaya_2x2:
  zagolovok_ru: "❖ ЧЕТЫРЕ УРОКА СКАЗКИ ДЛЯ СЕМЬИ И ВОСПИТАНИЯ ❖"
  vvodnaya_mysl_ru: "Все родители учат детей бояться «злого Волка» (угрозы), но в реальной жизни и в интернете 95% опасностей приходят к ребёнку и подростку в образе ласковой Лисы — через лесть, игру на самолюбии и просьбу сократить дистанцию."
  os_y_vertikalnaya: "БДИТЕЛЬНОСТЬ И БЕЗОПАСНАЯ ДИСТАНЦИЯ →"
  os_x_gorizontalnaya:
    levo_ru: "Хвастовство и отрыв от дома"
    centr_ru: "СКРОМНОСТЬ И СВЯЗЬ С РОДИТЕЛЯМИ"
    pravo_ru: "Доверие семье и трезвый ум"
  kvadraty:
    kvadrat_1_levyy_nizhniy:
      zagolovok_ru: "Урок I • Головокружение и беда — КОЛОБОК НА ЯЗЫКЕ У ЛИСЫ"
      sut_ru: "Отрыв от родительского присмотра плюс детское тщеславие («я от всех ушёл!»). Первая же хитрая манипуляция приводит к потере."
    kvadrat_2_levyy_verhniy:
      zagolovok_ru: "Урок II • Страх без опоры — ЗАПУГАННЫЙ РЕБЁНОК"
      sut_ru: "Ребёнка пугают опасностями мира, но дома редко хвалят по душам. Из-за дефицита тепла он всё равно тянется к чужому одобрению."
    kvadrat_3_pravyy_nizhniy:
      zagolovok_ru: "Урок III • Домашняя наивность — ДОБРЫЙ, НО БЕЗЗАЩИТНЫЙ"
      sut_ru: "Ребёнок послушный и домашний, но не обучен распознавать хитрые уловки мошенников в интернете и не умеет говорить твёрдое «нет»."
    kvadrat_4_pravyy_verhniy_pravilnyy_otvet:
      zagolovok_ru: "★ ГАРМОНИЯ В СЕМЬЕ И ЖИЗНИ — КРЕПКИЙ ДОМ И ЗОРКИЙ УМ"
      sut_ru: "Ребёнок получает достаточно искренней любви и похвалы дома, поэтому чужая лесть не кружит ему голову, а правила дистанции выполняются твёрдо."
  tri_roditelskih_pravila:
    - "Правило 1. Закон безопасной дистанции: Учите ребёнка: пока Колобок катился по дорожке на расстоянии вытянутой руки, ни один хищник не мог его схватить."
    - "Правило 2. Празднуйте победы без зазнайства: После каждой пятёрки или медали радуйтесь вместе, но напоминайте: следующий шаг требует новой подготовки."
    - "Правило 3. Цифровая гигиена в играх: Разберите с ребёнком, что «бесплатные подарки и похвала» от незнакомцев в сети — это тот же прыжок Лисе на носок."
  tablica_semeynyh_situaciy:
    - situaciya: "Ребёнок зазнался после первых успехов и перестал готовиться"
      oshibochnaya_reakciya: "Обидно одёрнуть («Не воображай о себе!»)."
      teplyy_i_mudryy_otvet: "«Ты отлично справился с Зайцем и Волком! Но помни урок Колобка: настоящий чемпион никогда не зазнаётся и готовится дальше»."
    - situaciya: "Приятели во дворе берут ребёнка «на слабо» или льстят ради выгоды"
      oshibochnaya_reakciya: "Ругать друзей или запрещать гулять."
      teplyy_i_mudryy_otvet: "«Посмотри внимательно: тебя сейчас зовут в честную игру или поют лисью песенку, чтобы ты отдал своё?»"
    - situaciya: "Незнакомец в онлайн-игре хвалит ребёнка и просит номер карты или код"
      oshibochnaya_reakciya: "Отобрать телефон с криком."
      teplyy_i_mudryy_otvet: "Похвалить ребёнка за то, что он сразу показал переписку вам: «Ты раскусил Лису с первой секунды — настоящий молодец!»"
metodika_i_matrica_2x2:
  paradox_skazki_ru: "Построим карту по двум осям: Ось X — скромность, связь с системой и критичность к лести, Ось Y — скорость, смелость и умение проходить кризисы."
  kto_est_kto_4_roli:
    - "1. «Колобок на пике куража» — Лидер с синдромом непогрешимости: Энергичный и быстрый игрок, который оторвался от своих базовых регламентов и тыла («ушёл от дедушки и бабушки») и свято верит, что его прошлый успешный приём («песенка») сработает везде."
    - "2. «Заяц, Волк и Медведь» — Открытые рыночные кризисы и прямые конкуренты: Они действуют грубо и предсказуемо («я тебя съем!»). Против них отлично работает предпринимательская скорость и манёвренность, но победа над ними рождает опасную эйфорию."
    - "3. «Лиса Патрикеевна» — Манипулятор, использующий ваше самолюбие: Никогда не спорит с вами. Наоборот — называет вас гением рынка, притворяется слабой и просит ради «особого доверия» отключить юридический и финансовый контроль («сядь на носок»)."
    - "4. «Зрелый Руководитель Квадрата 4» — Трезвый ум при любой похвале: Вежливо благодарит за комплименты, но никогда не сокращает безопасную дистанцию сделки и не подписывает бумаг без твёрдых гарантий."
  dve_lovushki:
    - "Ловушка 1 — Вера в универсальность «старой песни»: Колобок думал, что если одна и та же песенка сработала против Зайца, Волка и Медведя, то и с Лисой не нужно менять стратегию. В бизнесе это попытка идти в сложные юридические или международные сделки на одном «обаянии и кураже» без расчёта."
    - "Ловушка 2 — Добровольный отказ от дистанции контроля под влиянием лести: Лиса не бежала за Колобком — она заставила его самого прыгнуть ей в пасть, сыграв на желании быть услышанным и признанным. Любая просьба партнёра «давайте без скучных договоров и залогов, мы же восхищаемся вами!» — это приглашение на язычок Лисе."
    - "★ Секрет иммунитета — Разделение эмоций и регламента безопасности: Пусть переговорщик сколько угодно хвалит вашу «песенку», но проверка контрагента, предоплата и защита активов идут по железному протоколу без исключений."
  sekret_skazki_ru: "Пока вы держите дистанцию и опору на систему — вы неуязвимы; как только тщеславие заставляет шагнуть на чужой «носок» — вы проиграли."
  os_y_vertikalnaya:
    nazvanie_ru: "СКОРОСТЬ И СМЕЛОСТЬ В ДЕЛАХ →"
    niz_ru: "Низкая"
    verh_ru: "Высокая ↑"
  os_x_gorizontalnaya:
    nazvanie_ru: "ТРЕЗВОСТЬ УМА И ЖЕЛЕЗНАЯ ДИСТАНЦИЯ КОНТРОЛЯ"
    levo_ru: "Тщеславие и отрыв («Хвастовство»)"
    pravo_ru: "Система и иммунитет к лести"
  kvadraty:
    kvadrat_1_levyy_nizhniy:
      zagolovok_ru: "Квадрат 1 • Слабость и тщеславие — ЛЁГКАЯ ДОБЫЧА НА СТАРТЕ"
      sut_ru: "Много громких слов и амбиций без реальной силы и без системы защиты — сходит с дистанции при первой же встрече с «Зайцем»."
    kvadrat_2_levyy_verhniy:
      zagolovok_ru: "Квадрат 2 • Кураж без тормозов — КОЛОБОК ПЕРЕД ЛИСОЙ"
      sut_ru: "Блестяще проходит прямые штормы, но теряет голову от собственных побед, окружает себя льстецами и отдаёт бизнес первому хитрому манипулятору."
    kvadrat_3_pravyy_nizhniy:
      zagolovok_ru: "Квадрат 3 • Осторожность без движения — ВЕЧНО НА ОКОШКЕ"
      sut_ru: "Боится любых рисков и вообще не выходит на рынок: капитал цел, но развития и новых побед нет."
    kvadrat_4_pravyy_verhniy_pravilnyy_otvet:
      zagolovok_ru: "★ Квадрат 4 (ПРАВЫЙ ВЕРХНИЙ УГОЛ): ЗРЕЛЫЙ СТРАТЕГ (СИЛА + БДИТЕЛЬНОСТЬ)"
      sut_ru: "Сохраняет высокую скорость и предпринимательскую смелость, но опирается на твёрдый тыл, ценит честную критику и никогда не меняет безопасность на комплименты."
  tri_pravila_perehoda_v_kvadrat_4:
    - "Правило 1. Максимальная охрана сразу после победы: Самый строгий аудит рисков включается тогда, когда кажется, что «мы всех победили»."
    - "Правило 2. Стоп-сигнал на приторную лесть: Чем громче новый контрагент поёт вам дифирамбы — тем глубже служба безопасности проверяет его баланс."
    - "Правило 3. Запрет на сокращение дистанции («Никаких прыжков на нос»): Все сделки проводятся только на нейтральной и юридически защищённой территории."
  tablica_rabochih_situaciy:
    - situaciya: "Предложение «эксклюзивной сделки для лидера рынка» без гарантий"
      ubytschnyy_otvet: "Поверить комплиментам и отгрузить ресурс без обеспечения."
      pravilnyy_otvet_kvadrat_4: "Поблагодарить за высокую оценку и выставить стандартный счёт на 100% предоплату."
    - situaciya: "Формирование команды вокруг первого лица"
      ubytschnyy_otvet: "Приближать тех, кто хвалит каждое решение («какая славная песенка!»)."
      pravilnyy_otvet_kvadrat_4: "Держать рядом «умного критика» и финансового контролёра, которые говорят правду в глаза."
    - situaciya: "Стратегия после 3 успешных кварталов подряд"
      ubytschnyy_otvet: "Решить, что старая модель будет работать вечно без обновлений."
      pravilnyy_otvet_kvadrat_4: "Пересмотреть уязвимости и обновить продукт раньше, чем рынок сменит правила игры."
    - situaciya: "Публичные выступления и переговоры с конкурентами"
      ubytschnyy_otvet: "Раскрывать внутренние секреты и кухню бизнеса ради похвалы."
      pravilnyy_otvet_kvadrat_4: "Держать закрытым ноу-хау компании: петь только то, что безопасно для дела."
  krylatyy_slovar_komandy:
    - "«Коллеги, нам сейчас поют лисью песню и зовут на носок!» — Контрагент осыпает нас комплиментами, чтобы мы подписали невыгодный пункт или дали отсрочку. (Действие: Отключаем эмоции, включаем юристов и требуем твёрдых гарантий.)"
    - "«Не пойте старую песенку Колобка — перед нами не Медведь, а Лиса!» — Команда пытается применить шаблонный старый приём против тонкого и хитрого игрока. (Действие: Меняем тактику переговоров и усиливаем защиту.)"
    - "«Убежали от Волка — не попадёмся на язык Лисе!» — Мы успешно прошли трудный кризис и рискуем расслабиться на этапе оформления сделки. (Действие: Удваиваем бдительность при фиксации прибыли и документов.)"
    - "«Держите дорожную дистанцию — на нос не прыгаем!» — Нас просят передать права, исходники или товар до расчёта «под честное слово». (Действие: Работаем строго по этапам оплаты без передачи контроля.)"
sovet_18_ekspertov:
  kontur_1_smysl_i_metodologiya:
    rol_01_dba_instrument: "Когнитивное искажение «Головокружение от успехов» (Hubris Syndrome & Overconfidence Bias по Д. Канеману), защита от социальной инженерии и лести в переговорах, опора на семейный и корпоративный периметр"
    rol_02_mckinsey_mece_proverka: "Ось X (Трезвость самооценки и иммунитет к лести) × Ось Y (Связь с опорной базой, семьёй и правилами безопасности) — раскладывают путь героя от слепого бегства и тщеславия (Кв. 1–2) к зрелой самостоятельности с надёжным тылом (★ Кв. 4)."
    rol_03_edtech_perenos_v_privychku_24ch:
      dlya_semyi_segodnya_vecherom: "Отработайте с ребёнком сегодня правило «Стоп-слово против хитрой похвалы»: если незнакомец или новый приятель слишком сладко хвалит и зовёт отойти подальше от родителей («сядь ко мне на носок»), нужно сразу сделать шаг назад к своим."
      dlya_rukovoditelya_zavtra_utrom: "Перед подписанием контракта с контрагентом, который осыпает вашу компанию комплиментами и обещает «особые условия без проверок», включите жёсткий чек-лист службы безопасности и независимый аудит рисков."
    rol_04_skazochnik_transkreator: "T1 + T2 (Информационная безопасность ребёнка 6+): Сказка превращена в главный семейный тренажёр защиты от манипуляторов и льстецов, а для руководителей — в прививку от потери бдительности после первых побед."
    rol_05_rezhisser_chteniya_vsluh_i_audio: "Весёлая, катящаяся песенка Колобка с ускорением темпа от Зайца к Медведю; медовый, усыпляющий шёпот Лисы в сцене 4 и чёткий, бодрый голос правила безопасности в разборе."
    rol_06_briks_i_vostok_most: "Европа и США: сказка о Пряничном человечке (The Gingerbread Man); античность (Эзоп): басня «Ворона и Лисица» (опасность лести); Китай: пословица «Сладкие речи часто прячут острый крючок»."
  kontur_2_chetyre_auditorii:
    rol_07_deti_6_10_let: "1. Береги связь с домом: Никогда не убегай без спроса от тех, кто тебя любит и бережёт. 2. Не зазнавайся в победе: Хвастовство закрывает глаза и мешает увидеть опасность. 3. Держи дистанцию с хитрецами: Чем слаще незнакомец зовёт поближе — тем быстрее зови родителей."
    rol_08_semya_i_60_plyus: "100% чистый русский язык без англицизмов и жаргона; уважение к бабушкам и дедушкам (60+) как хранителям семейного лада."
    rol_09_upravlency_mba: "1. Учите распознавать лесть: Манипуляторы опаснее открытых хулиганов — разбирайте их приёмы заранее. 2. Наполняйте ребёнка теплом дома: Ребёнок, любимый в семье, не ищет сомнительной похвалы на стороне. 3. Доверие без страха: Пусть ребёнок знает, что с любой тревогой он может сразу прийти к вам."
    rol_10_predprinimateli_sovladelcy: "Пока вы держите дистанцию и опору на систему — вы неуязвимы; как только тщеславие заставляет шагнуть на чужой «носок» — вы проиграли."
