celi_i_klyuchi:
  cel_rebenka_6plus: "Сначала сестрица забыла про наказ родителей и капризничала перед Печкой, Яблонькой и Речкой. Но когда она поняла свою ошибку, победила гордыню и научилась говорить «спасибо» — весь мир помог ей спасти братца!"
  cel_roditelya_i_lidera: "Сказка показывает, как руководитель проходит путь от беспечности и снобизма к зрелому антикризисному лидерству и умению строить союзы."
  zolotoy_klyuchik_malym_ru: "1. Береги родных: Старший в доме — первый защитник и опора для младшего. 2. Ошибся — исправь делом: Смелый не тот, кто не ошибается, а тот, кто сам бежит выручать. 3. Уважай простой хлеб: Скромность и доброе слово «спасибо» делают весь мир твоим другом."
  zolotoy_klyuchik_bolshim_ru: "1. Воспитывайте антихрупкость: Опыт самостоятельного спасения дела формирует взрослого лидера. 2. Убирайте снобизм в зародыше: Достаток семьи должен рождать благородство и простоту, а не спесь. 3. Связь братьев и сестёр: Совместно пережитые испытания сплачивают детей на всю жизнь."
  deviz_skazki_ru: "«Тому, кто сам исправляет свою ошибку и уважает чужой труд, помогает весь мир»"
  deviz_upravleniya_ru: "«Тот, кто говорит рынку „у батюшки и пшеничные не едятся“, остаётся в кризисе без единого союзника»"
tekst_istorii:
  predislovie_avtora_ru: "Перекликаясь с классическими сказками о спасении младшего брата и добрых помощниках на пути, история «Гуси-лебеди» показывает, как принятие ответственности и преодоление спеси превращают кризис в победу любви. «Гуси-лебеди» — одна из самых мудрых русских сказок о взрослении души. В начале истории девочка беспечна и капризна: она забывает о маленьком братце ради уличных игр, а когда бежит искать его — высокомерно воротит нос от ржаного пирожка Печки, лесного яблочка и простого киселька («у моего батюшки и пшеничные не едятся!»). Но любовь к брату и решимость спасти его меняют её сердце: на обратном пути она с уважением и благодарностью принимает простую помощь, и тогда и Молочная речка, и Яблонька, и Печка встают стеной на её защиту."
  predislovie_upravlenie_ru: "В сказке «Гуси-лебеди» зашифрован идеальный алгоритм зарождения и преодоления кризиса. Сначала происходит классический управленческий сбой: ответственный руководитель отвлёкся на «уличные игры» и оставил ключевой актив («братца под окошком») без контроля — и его мгновенно увели конкуренты («гуси-лебеди»). Но главный урок ждёт нас в ходе спасательной операции! Почему Печка, Яблонька и Речка отказывают героине в информации на пути туда, но спасают её на пути обратно? Потому что сначала она разговаривает со средой на языке столичного снобизма: «У моего батюшки и пшеничные не едятся!». Как только она убирает корону и принимает простые условия партнёров — вся экосистема закрывает её от погони."
  sceny_family_5str:
    - scena: 1
      aforizm_ru: "❧ Лист I. Забытый наказ родителей и налёт гусей-лебедей ❧"
      tekst_ru: "Жили-были мужик да баба, и росли у них дочка да сынок маленький. Собрались однажды отец с матерью в город на ярмарку и говорят старшей дочке: «Доченька, мы поедем за покупками, а ты береги братца! Не ходи со двора, будь умницей — мы тебе платочек шёлковый привезём».\n\nУехали старшие, а дочка посадила маленького братца на муравку под окошком, сама же побежала на улицу, заигралась, загулялась с подружками и совсем позабыла про родительский наказ! Налетели тут злые гуси-лебеди, подхватили мальчика на широкие крылья и унесли за тёмные леса."
    - scena: 2
      aforizm_ru: "❧ Лист II. Капризный ответ Печке, Яблоньке и Речке: «И пшеничные не едятся!» ❧"
      tekst_ru: "Вернулась девочка со двора, глядь — нет братца! Ахнула она, кинулась туда-сюда — нет нигде! Увидела только вдалеке за лесом мелькнувшие белые крылья гусей-лебедей, догадалась, что они братца унесли, и бросилась догонять. Бежит по чистому полю, видит — стоит в поле горячая Печка: «Печка, матушка, скажи, куда гуси-лебеди полетели?» — «Съешь моего ржаного пирожка — скажу!» — «Стану я ржаной пирожок есть! У моего батюшки и пшеничные не едятся!»\n\nПобежала дальше — стоит Яблонька с наливными лесными яблочками, просит съесть дикое яблочко, а девочка опять нос воротит: «У моего батюшки и садовые не кушаются!». Добежала до Молочной речки в кисельных берегах, но и простого киселька с молоком отведать не захотела — побежала дальше ни с чем."
    - scena: 3
      aforizm_ru: "❧ Лист III. Подсказка лесного Ёжика и смелое спасение братца у избушки ❧"
      tekst_ru: "Долго бы бегала она по полям да лесам, да попался ей навстречу маленький колючий Ёжик. Хотела она его толкнуть, да побоялась уколоться, пожалела и ласково попросила: «Ёжик, Ёжик, не видал ли ты, куда гуси-лебеди полетели?». Указал ей Ёжик заветную тропинку в дремучую чащу.\n\nПрибежала девочка к избушке на курьих ножках. Видит — сидит на лавке старая Баба-яга, кудель прядёт, а у окошка её маленький братец играет серебряными яблочками. Подкралась сестрица тихонько, подхватила братца на руки и бросилась бежать домой со всех ног, а гуси-лебеди увидали — да в погоню за ними!"
    - scena: 4
      aforizm_ru: "❧ Лист IV. Благодарное сердце: как Речка и Яблонька укрыли детей от погони ❧"
      tekst_ru: "Летят гуси-лебеди следом, крыльями шумят, того и гляди из рук братца вырвут! Прибежала девочка к Молочной речке и молит со слезами: «Речка, матушка, спрячь меня!» — «Поешь моего простого киселька!». Не стала девочка больше капризничать — поела киселька да поклонилась с благодарностью. Укрыла её речка под кисельным бережком — пролетели гуси мимо!\n\nВышла девочка, сказала «спасибо!» и опять бежит с братцем, а гуси-лебеди воротились, увидали её и летят навстречу! Подбежала она к Яблоньке: «Яблонька, матушка, спрячь меня!». Съела она с благодарностью лесное яблочко — заслонила её Яблонька ветвями да густыми листьями."
    - scena: 5
      aforizm_ru: "❧ Лист V. Спасение у доброй Печки и счастливое возвращение домой к родителям ❧"
      tekst_ru: "Побежала девочка дальше, а гуси-лебеди уж совсем близко — крыльями бьют, налетают! Добежала сестрица до горячей Печки: «Сударыня Печка, спрячь меня!» — «Поешь моего ржаного пирожка!». Быстро съела девочка тёплый ржаной пирожок, села с братцем в устье, закрылась заслонкой — полетали-полетали гуси, покричали да и вернулись к Бабе-яге ни с чем.\n\nА девочка поклонилась Печке: «Спасибо тебе за добрый хлеб да за спасение!» — и вместе с братцем прибежала домой. Умыла братца, причесала, посадила на лавочку, сама рядом села — и тут как раз отец с матерью с ярмарки приехали и шёлковый платочек дочке привезли!"
  sceny_mgmt_3str:
    - scena: 1
      aforizm_ru: "❧ Лист I из III. Потеря фокуса на активе и фиаско высокомерных переговоров ❧"
      tekst_ru: "Уехали отец с матерью в город и поручили дочке беречь маленького братца. А дочка посадила братца на травку под окошком, сама же побежала на улицу, заигралась и забыла про наказ. Налетели гуси-лебеди, подхватили мальчика и унесли за тёмные леса к Бабе-яге.\n\nБросилась девочка в погоню. Встретила в поле Печку: «Скажи, куда гуси полетели?» — «Съешь моего ржаного пирожка — скажу!» — «Стану я ржаной пирожок есть! У моего батюшки и пшеничные не едятся!». Так же высокомерно отказалась она от лесного яблочка Яблоньки и простого киселька Молочной речки — и не получила ни одной подсказки."
    - scena: 2
      aforizm_ru: "❧ Лист II из III. Перелом стратегии: уважение к среде открывает защиту союзников ❧"
      tekst_ru: "Лишь когда девочка ласково и уважительно обратилась к маленькому лесному Ёжику, тот указал ей путь к избушке Бабы-яги. Выждав момент, сестрица смело выхватила братца и побежала домой, а гуси-лебеди бросились в погоню.\n\nПеред лицом реальной опасности с девочки слетела вся спесь. Добежала она до Молочной речки, поклонилась, с благодарностью поела простого киселька — и речка укрыла их под кисельным бережком. Подбежала к Яблоньке, отведала лесного яблочка — и Яблонька заслонила их ветвями."
    - scena: 3
      aforizm_ru: "❧ Лист III из III. Полное закрытие кризиса своими руками до прихода собственников ❧"
      tekst_ru: "У самого дома настигали их гуси-лебеди, но девочка поклонилась Печке, съела тёплый ржаной пирожок, и Печка спрятала их в своём устье. Полетали гуси-лебеди да и вернулись ни с чем.\n\nПоблагодарила девочка Печку, прибежала с братцем домой, умыла его и привела всё в полный порядок ровно к возвращению родителей с ярмарки."
