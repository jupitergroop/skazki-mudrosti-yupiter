voprosy_i_zadaniya:
  tayna_skazki_2stroki_ru: "Сначала сестрица забыла про наказ родителей и капризничала перед Печкой, Яблонькой и Речкой. Но когда она поняла свою ошибку, победила гордыню и научилась говорить «спасибо» — весь мир помог ей спасти братца!"
  voprosy_besedy_s_rebenkom:
    - "1. Как поступила девочка, когда увидела, что братца унесли гуси-лебеди: Она не стала прятаться или сваливать вину на других, а сама смело побежала выручать маленького брата. Почему настоящий человек всегда сам исправляет свою оплошность?"
    - "2. Почему на пути ТУДА никто ей не помог, а на пути ОБРАТНО помогли все: Вспомни, как высокомерно она отвечала Печке и Яблоньке сначала («у моего батюшки и пшеничные не едятся!»). Что изменилось в её сердце на обратном пути?"
    - "3. Чему учит нас ржаной пирожок и лесное яблочко: Почему некрасиво капризничать за столом или в гостях и говорить «фу, я такое не ем!», когда люди с душой трудились и угощают тебя?"
  mudraya_poslovica_ru: "«Горделивому да капризному всяк чужой, а доброму да благодарному — весь мир родной!»"
  volshebnye_slova_druzhby:
    - "Я бережно забочусь о младших и всегда сам исправляю свои промахи до прихода родителей."
    - "Я никогда не капризничаю перед простым угощением и с уважением говорю «спасибо» за чужой труд."
  igra_vybor_3_dorogi:
    situaciya: "Представь: родители поручили тебе присмотреть за порядком дома или младшим братом, а ты заигрался; или бабушка угощает тебя простым домашним пирогом. Какой путь ты выберешь?"
    variant_a_oshibka: "Путь 1 (Как Капризная гордячка в начале сказки): Забыть про обещание, а когда нужна помощь — требовать её с капризами, задирая нос: «У нас дома всё лучше!»."
    variant_b_oshibka: "Путь 2 (Испугаться и спрятаться): Увидев, что случилась беда, сидеть на лавочке, плакать и ждать, пока всё само как-нибудь решится."
    variant_v_vernyy: "★ Путь 3 — Мудрый выбор! (Смелая и благодарная сестрица): Твёрдо помнить о заботе за младших, а если допустил промах — сразу бежать исправлять его делом, уважать простой труд и от души благодарить за каждую помощь!"
  tvorcheskoe_zadanie_risunok: "❖ Творческое задание: нарисуй добрую Печку с румяными пирожками, наливную Яблоньку и сестрицу с братцем!"
  naputstvie_semye_ru: "«Пусть старшие и младшие в вашем роду всегда берегут друг друга, а скромность и благодарное сердце открывают перед вашей семьёй все добрые дороги мира!»"
  praktikum_rukovoditelya_5_tochek:
    - "1. Охрана «младшего братца»: Не остался ли мой главный доходный проект или семейный приоритет без присмотра из-за второстепенной суеты?"
    - "2. Проверка на снобизм: Нет ли у нас в компании привычки смотреть свысока на «ржаные пирожки» — простых клиентов, смежников или региональных партнёров?"
    - "3. Контакт с «Ёжиками»: Слышу ли я честные подсказки рядовых специалистов и проводников на местах?"
    - "4. Скорость реакции на ЧП: Когда случается ошибка, бежим ли мы сразу исправлять её делом или тратим время на переживания?"
    - "5. Культура благодарности: Не забываю ли я сказать искреннее «спасибо» тем «Печкам, Яблонькам и Речкам», которые прикрывают наш бизнес в трудный час?"
matrica_semeynaya_2x2:
  zagolovok_ru: "❖ ЧЕТЫРЕ УРОКА СКАЗКИ ДЛЯ СЕМЬИ И ВОСПИТАНИЯ ❖"
  vvodnaya_mysl_ru: "В современном мире, где у детей есть всё, родителям особенно важно не вырастить синдром «у моего батюшки и пшеничные не едятся!». Сказка «Гуси-лебеди» даёт идеальный ключ к воспитанию благодарности и самостоятельности."
  os_y_vertikalnaya: "ОТВЕТСТВЕННОСТЬ И ГОТОВНОСТЬ ДЕЙСТВОВАТЬ →"
  os_x_gorizontalnaya:
    levo_ru: "Капризы и спесь («Пшеничные не ем!»)"
    centr_ru: "СКРОМНОСТЬ, БЛАГОДАРНОСТЬ И УВАЖЕНИЕ К МИРУ"
    pravo_ru: "Уважение и благодарность («Спасибо!»)"
  kvadraty:
    kvadrat_1_levyy_nizhniy:
      zagolovok_ru: "Урок I • Беспечность и каприз — ЗАБЫТЫЙ НАКАЗ У ОКОШКА"
      sut_ru: "И за младшим не уследили, и перед всем светом нос задрали. Итог — потеря самого дорогого."
    kvadrat_2_levyy_verhniy:
      zagolovok_ru: "Урок II • Погоня в короне (Путь туда) — СПЕСИВАЯ ПРОСИТЕЛЬНИЦА"
      sut_ru: "Ребёнок активен и бежит к цели, но разговаривает со старшими, учителями и сверстниками свысока — и остаётся в одиночестве без подсказки и поддержки."
    kvadrat_3_pravyy_nizhniy:
      zagolovok_ru: "Урок III • Вежливость без поступка — ТИХАЯ ОЖИДАТЕЛЬНИЦА"
      sut_ru: "Ребёнок вежливый и послушный, но при первой же трудности теряется и не умеет самостоятельно принять решение и спасти ситуацию."
    kvadrat_4_pravyy_verhniy_pravilnyy_otvet:
      zagolovok_ru: "★ ГАРМОНИЯ В СЕМЬЕ И ЖИЗНИ — СМЕЛОЕ И БЛАГОДАРНОЕ СЕРДЦЕ (Путь домой)"
      sut_ru: "Любовь к брату, личная смелость и искреннее уважение к Печке, Яблоньке и Речке превращают весь окружающий мир в добрых защитников семьи."
  tri_roditelskih_pravila:
    - "Правило 1. Забота о младших — это честь, а не наказание: Доверяйте старшему ребёнку маленькие поручения с уважением, подчёркивая его взрослость."
    - "Правило 2. Табу на фразу «У нас дома лучше!»: В гостях, в школе и в поездках воспитывайте культуру благодарности к любому угощению и труду."
    - "Правило 3. Оценивайте финал, если ошибка исправлена: Если ребёнок оступился, но сам всё исправил до вашего прихода — поддержите его победу."
  tablica_semeynyh_situaciy:
    - situaciya: "Ребёнок заигрался в телефоне или во дворе и забыл о домашнем поручении"
      oshibochnaya_reakciya: "Кричать или молча сделать работу за него."
      teplyy_i_mudryy_otvet: "«Кажется, гуси-лебеди унесли твоё время! Как ты сейчас, как старшая сестрица в сказке, успеешь всё спасти до ужина?»"
    - situaciya: "Морщит нос за столом или в гостях: «Я такое простое не ем!»"
      oshibochnaya_reakciya: "Бежать готовить третье блюдо по капризу."
      teplyy_i_mudryy_otvet: "С улыбкой напомнить: «Помнишь, что говорила девочка Печке про ржаной пирожок? Мудрый человек ценит простой и добрый хлеб»."
    - situaciya: "Старший ребёнок помог младшему или сам навёл порядок после промаха"
      oshibochnaya_reakciya: "Вспоминать старую вину."
      teplyy_i_mudryy_otvet: "Обнять и подарить «шёлковый платочек» похвалы: «Ты поступил по-взрослому и сам сберёг мир в нашем доме!»"
metodika_i_matrica_2x2:
  paradox_skazki_ru: "Построим карту по двум осям: Ось X — уважение к партнёрам и среде (отсутствие снобизма), Ось Y — личная решимость исправить ошибку и спасти актив."
  kto_est_kto_4_roli:
    - "1. «Младший братец на травке» — Ключевой актив или ядро клиентской базы: Самое ценное, что поручено вашей заботе. Стоит руководителю «убежать играть на улицу» в модные побочные тусовки — как тут же налетают «гуси-лебеди» конкурентов и уносят актив."
    - "2. «Сестрица на пути туда» — Руководитель в короне («Пшеничные не едятся!»): Менеджер, который кичится былыми заслугами или статусом холдинга, смотрит свысока на «простых» подрядчиков, регионы и смежные отделы — и остаётся в информационном вакууме."
    - "3. «Печка, Яблонька, Речка и Ёжик» — Партнёры, регионы и инфраструктура рынка: Они готовы дать вам и разведданные, и защиту от любой погони, но требуют одного: уважения к их «ржаному пирожку» (местным правилам и взаимному обмену)."
    - "4. «Сестрица на обратном пути» — Антикризисный лидер Квадрата 4: Берёт 100% ответственности за исправление сбоя, снимает спесь, уважительно закрывает сделки с каждым партнёром и возвращает актив до отчётного часа."
  dve_lovushki:
    - "Ловушка 1 — Оставить «братца под окошком» ради шума на улице: Крупнейшие потери в бизнесе случаются тогда, когда базовое доходное направление считают «скучным и понятным» и перестают его охранять, переключая всё внимание на внешние развлечения."
    - "Ловушка 2 — Корпоративный и личный снобизм («Стану я ржаной пирожок есть!»): Когда переговорщик приходит в новый регион, новую страну (например, на рынки БРИКС) или в смежный цех с высокомерным лицом — среда молча блокирует ему доступ к информации. Без уважения к местному «кисельку» двери не открываются."
    - "★ Секрет антикризисного перелома — Снять корону и включить взаимность: Съесть пирожок Печки и снять тяжёлое яблочко с ветки Яблоньки — значит сначала принести малую пользу партнёру и проявить уважение к его труду, и тогда он укроет вас своими ветвями."
  sekret_skazki_ru: "Сначала уважь чужой «ржаной пирожок» — и только потом проси указать дорогу или укрыть от бури."
  os_y_vertikalnaya:
    nazvanie_ru: "ЛИЧНАЯ РЕШИМОСТЬ И ОТВЕТСТВЕННОСТЬ →"
    niz_ru: "Низкая"
    verh_ru: "Высокая ↑"
  os_x_gorizontalnaya:
    nazvanie_ru: "УВАЖЕНИЕ К ПАРТНЁРАМ И ЗАКОН ВЗАИМНОСТИ"
    levo_ru: "Снобизм («Пшеничные не едятся!»)"
    pravo_ru: "Уважение и благодарность («Спасибо!»)"
  kvadraty:
    kvadrat_1_levyy_nizhniy:
      zagolovok_ru: "Квадрат 1 • Безответственность и спесь — ПОТЕРЯ АКТИВА И ОПРАВДАНИЯ"
      sut_ru: "Проглядели увод ключевого актива («заигрались на улице»), а вместо спасения ищут виноватых и ждут приезда «родителей»."
    kvadrat_2_levyy_verhniy:
      zagolovok_ru: "Квадрат 2 • Высокомерный штурм (Путь туда) — БЕГ В КОРОНЕ БЕЗ СОЮЗНИКОВ"
      sut_ru: "Лидер пытается решить кризис в одиночку, разговаривая с рынком и людьми через губу. Теряет время, силы и остаётся без информации."
    kvadrat_3_pravyy_nizhniy:
      zagolovok_ru: "Квадрат 3 • Вежливость без смелости — ДОБРЫЙ ПУТНИК БЕЗ ЦЕЛИ"
      sut_ru: "Со всеми любезен, со всеми пьёт киселёк, но в логово кризиса («к избушке Бабы-яги») забирать свой актив идти боится."
    kvadrat_4_pravyy_verhniy_pravilnyy_otvet:
      zagolovok_ru: "★ Квадрат 4 (ПРАВЫЙ ВЕРХНИЙ УГОЛ): ЗРЕЛОЕ СПАСЕНИЕ И ЭКОСИСТЕМА (Путь домой)"
      sut_ru: "Мгновенное принятие ответственности плюс глубокое уважение к каждому встречному партнёру (от Ёжика до Печки) позволяют вернуть актив и закрыть кризис точно в срок."
  tri_pravila_perehoda_v_kvadrat_4:
    - "Правило 1. Неприкосновенный дозор у главного актива: Уходя на любые внешние проекты, убедитесь, что «младший братец» под двойной защитой."
    - "Правило 2. Закон «Ржаного пирожка» в переговорах: Никогда не обесценивайте чужой продукт, регион или культуру — ищите точку взаимного уважения."
    - "Правило 3. Исправить до возвращения заказчика: Высший класс управления — локализовать и полностью устранить сбой своими силами в срок."
  tablica_rabochih_situaciy:
    - situaciya: "Уход крупного клиента к конкурентам («гусям-лебедям»)"
      ubytschnyy_otvet: "Ждать квартального отчёта и оправдываться рынком."
      pravilnyy_otvet_kvadrat_4: "Немедленно лично выехать к клиенту, признать недоработку и вернуть его в компанию."
    - situaciya: "Переговоры с региональными или международными партнёрами"
      ubytschnyy_otvet: "Учить их жизни свысока («у нас в столице пшеничные булки»)."
      pravilnyy_otvet_kvadrat_4: "С уважением принять местный деловой уклад («ржаной пирожок») и получить полную поддержку на месте."
    - situaciya: "Отношение к «маленьким людям» (курьерам, секретарям, техникам)"
      ubytschnyy_otvet: "Не замечать или разговаривать свысока."
      pravilnyy_otvet_kvadrat_4: "Помнить урок лесного Ёжика: именно скромный специалист на месте часто знает короткую тропу к решению."
    - situaciya: "Внутренний сбой в отделе или проекте"
      ubytschnyy_otvet: "Вываливать сырую проблему на акционеров («родителей»)."
      pravilnyy_otvet_kvadrat_4: "Мобилизовать команду, вычистить ошибку и доложить уже о решённой задаче."
  krylatyy_slovar_komandy:
    - "«Кто оставил братца на травке, пока мы гуляли на улице?» — Мы увлеклись второстепенными задачами и ослабили контроль над главным источником дохода. (Действие: Немедленно возвращаем лучших людей на защиту основного бизнеса.)"
    - "«Хватит говорить рынку: „У батюшки и пшеничные не едятся!“» — Команда капризничает перед рабочими инструментами, простыми клиентами или условиями партнёров. (Действие: Убираем снобизм и с благодарностью включаемся в реальную работу.)"
    - "«Не обижайте Ёжика — он знает дорогу к избушке!» — Мы недооцениваем рядового сотрудника или локального эксперта, владеющего ключевой информацией. (Действие: Проявляем уважение и внимательно слушаем практику с земли.)"
    - "«Успеть вернуть братца и умыть до приезда с ярмарки!» — У нас есть жёсткое окно времени, чтобы исправить сбой без репутационных потерь. (Действие: Включаем антикризисную скорость и закрываем проблему под ключ.)"
sovet_18_ekspertov:
  kontur_1_smysl_i_metodologiya:
    rol_01_dba_instrument: "Антикризисное принятие ответственности (Extreme Ownership), преодоление статусной гордыни перед партнёрами («Съешь моего ржаного пирожка») и построение сети взаимной выручки"
    rol_02_mckinsey_mece_proverka: "Ось X (Личная ответственность и готовность сразу действовать для исправления ошибки) × Ось Y (Уважение к простым союзникам и скромность в диалоге) — переводят из капризного высокомерия («у моего батюшки и пшеничные не едят!») к спасительной коалиции (★ Кв. 4)."
    rol_03_edtech_perenos_v_privychku_24ch:
      dlya_semyi_segodnya_vecherom: "Потренируйте с ребёнком сегодня правило Машеньки: если допустил оплошность — не прячься и не ищи виноватых, а сразу берись исправлять дело и вежливо проси помощи у старших."
      dlya_rukovoditelya_zavtra_utrom: "Вспомните 1 партнёра, подрядчика или линейную службу («Печку, Яблоньку, Речку»), чьё простое предложение вы когда-то отвергли свысока: сделайте шаг уважения первым — именно они прикроют вашу компанию в час шторма."
    rol_04_skazochnik_transkreator: "T1 + T2 (Бережная трансформация героя 6+): Страх потери братика превращён в школу взросления характера девочки Машеньки: как только она меняет капризную гордость на уважение и заботу (подпирает ветки яблоньки, расчищает ручеёк), весь мир становится её союзником."
    rol_05_rezhisser_chteniya_vsluh_i_audio: "Шум крыльев Гусей-лебедей в вышине; капризная интонация в первой половине пути и тёплый, заботливый, благодарный голос Машеньки на обратном пути к дому."
    rol_06_briks_i_vostok_most: "Восточнославянский и европейский фольклор: сказка о спасении младшего брата (братья Гримм «Братец и сестрица»); Китай: конфуцианский принцип «Сяо и Ти» (забота старшей сестры о младшем брате и скромность перед миром)."
  kontur_2_chetyre_auditorii:
    rol_07_deti_6_10_let: "1. Береги родных: Старший в доме — первый защитник и опора для младшего. 2. Ошибся — исправь делом: Смелый не тот, кто не ошибается, а тот, кто сам бежит выручать. 3. Уважай простой хлеб: Скромность и доброе слово «спасибо» делают весь мир твоим другом."
    rol_08_semya_i_60_plyus: "100% чистый русский язык без англицизмов и жаргона; уважение к бабушкам и дедушкам (60+) как хранителям семейного лада."
    rol_09_upravlency_mba: "1. Воспитывайте антихрупкость: Опыт самостоятельного спасения дела формирует взрослого лидера. 2. Убирайте снобизм в зародыше: Достаток семьи должен рождать благородство и простоту, а не спесь. 3. Связь братьев и сестёр: Совместно пережитые испытания сплачивают детей на всю жизнь."
