voprosy_i_zadaniya:
  tayna_skazki_2stroki_ru: "Медвежата нашли целую головку вкусного сыра, но так боялись уступить родному брату лишнюю крошку, что отдали почти весь сыр хитрой Лисе! Где между братьями мир и щедрость — там всегда сытость и радость."
  voprosy_besedy_s_rebenkom:
    - "1. О чём просила медвежат мама перед дорогой и почему они забыли её слова: Мама наказала им держаться друг за друга и делить всё по-братски. Что случилось с братьями, когда они увидели большую головку сыра?"
    - "2. Почему Лиса нарочно разломила сыр неровно с самого начала: Хотела ли Лиса на самом деле помирить медвежат? Как она использовала их жадность и спор, чтобы съесть весь сыр самой?"
    - "3. Как медвежатам нужно было поступить без всякой Лисы: Что было бы, если бы один брат с улыбкой сказал другому: «Возьми кусок побольше, ты мой родной брат!»? Сколько сыра досталось бы тогда каждому?"
  mudraya_poslovica_ru: "«Где братья друг другу уступают — там богатство в доме пребывает, а где спорят из-за крошки — там всё уносит Лиса!»"
  volshebnye_slova_druzhby:
    - "Для родного брата, сестры и друга мне никогда не жалко самого лучшего кусочка."
    - "Все споры в нашей семье мы решаем сами с любовью, не приглашая хитрую «Лису»."
  igra_vybor_3_dorogi:
    situaciya: "Представь: вы с братом, сестрой или лучшим другом нашли или получили одно большое угощение или интересную игру. Какой путь ты выберешь?"
    variant_a_oshibka: "Путь 1 (Как Жадные медвежата — «У тебя кусок больше!»): Спорить с линейкой над каждой крошкой, рычать друг на друга, отнимать и никому не давать радости."
    variant_b_oshibka: "Путь 2 (Позвать чужую «Лису» разбирать вашу ссору): Жаловаться чужим людям на родного брата или сестру и ждать, пока посторонний хитрец заберёт ваше общее дело себе."
    variant_v_vernyy: "★ Путь 3 — Мудрый выбор! (Щедрое братское сердце): Разделить самим по-доброму и с радостью сказать родному человеку: «Бери большую половинку на здоровье!» — и тогда весь сыр и вся дружба останутся в вашей семье!"
  tvorcheskoe_zadanie_risunok: "❖ Творческое задание: нарисуй двух помирившихся медвежат, которые дружно пьют чай с большой головкой золотистого сыра!"
  naputstvie_semye_ru: "«Пусть ваши дети идут по жизни рука об руку, как верные братья и сёстры, всегда хранят наказ родителей и умножают любовь и достаток своего рода!»"
  praktikum_rukovoditelya_5_tochek:
    - "1. Чистота договорённостей на берегу: Зафиксированы ли у меня со всеми ключевыми партнёрами ясные и прозрачные правила деления результата до начала больших проектов?"
    - "2. Отсутствие «внешних Лис»: Нет ли вокруг нашей компании или семьи людей, которые питаются внутренними разногласиями и шепчут «тебя обделили»?"
    - "3. Скорость закрытия внутренних споров: Умеем ли мы внутри команды решать любой спорный вопрос за 15 минут за закрытой дверью?"
    - "4. Фокус на создании нового «сыра»: Направлена ли энергия моей команды на завоевание новых рынков, а не на перетягивание каната внутри офиса?"
    - "5. Завет единства для детей и преемников: Передаю ли я своим детям главное правило рода: всегда держаться друг за друга и быть щедрыми к родным?"
matrica_semeynaya_2x2:
  zagolovok_ru: "❖ ЧЕТЫРЕ УРОКА СКАЗКИ ДЛЯ СЕМЬИ И ВОСПИТАНИЯ ❖"
  vvodnaya_mysl_ru: "Самое большое счастье родителей — знать, что и через тридцать лет их выросшие дети будут стоять друг за друга горой, никогда не деля «сыр» через чужих «лис». Эта сказка закладывает золотой фундамент семейного братства."
  os_y_vertikalnaya: "БРАТСКАЯ ЛЮБОВЬ И УСТУПЧИВОСТЬ СВОИМ →"
  os_x_gorizontalnaya:
    levo_ru: "Вынос ссор наружу («Звать Лису»)"
    centr_ru: "УМЕНИЕ ДОГОВАРИВАТЬСЯ ВНУТРИ СЕМЬИ"
    pravo_ru: "Решать вопросы по-родственному"
  kvadraty:
    kvadrat_1_levyy_nizhniy:
      zagolovok_ru: "Урок I • Жадность и две крошки — ОБЕД ДЛЯ ЧУЖОЙ ЛИСЫ"
      sut_ru: "Мелочный счёт между родными людьми («кому досталось больше») и втягивание чужаков в семейные споры. Итог — потеря и добра, и мира."
    kvadrat_2_levyy_verhniy:
      zagolovok_ru: "Урок II • Доброта без уговора — НАИВНЫЕ МИШКИ"
      sut_ru: "Дети любят друг друга, но не умеют сами спокойно договориться о правилах игры и слишком легко доверяют посторонним советчикам."
    kvadrat_3_pravyy_nizhniy:
      zagolovok_ru: "Урок III • Холодный делёж по линейке — СУХАЯ БУХГАЛТЕРИЯ"
      sut_ru: "Чужих в дом не пускают, но внутри семьи считают каждую копейку и каждую минуту с ревнивой подозрительностью."
    kvadrat_4_pravyy_verhniy_pravilnyy_otvet:
      zagolovok_ru: "★ ГАРМОНИЯ В СЕМЬЕ И ЖИЗНИ — КРЕПКОЕ БРАТСТВО И ПОЛНЫЙ ДОМ"
      sut_ru: "В семье действует закон: родной человек всегда важнее лишней крошки сыра. Дети сами делят всё с щедростью и берегут единство рода."
  tri_roditelskih_pravila:
    - "Правило 1. Закон семейного круга: Любой спор между своими решается только внутри дома — с теплом и уважением."
    - "Правило 2. Радость великодушия: Сильный в семье не тот, кто урвал больше, а тот, кто с улыбкой позаботился о родном."
    - "Правило 3. Стоп-фраза «Не будем кормить Лису!»: Используйте эту весёлую фразу при любой мелкой ссоре детей из-за игрушек или сладостей."
  tablica_semeynyh_situaciy:
    - situaciya: "Дети спорят из-за того, кому достался кусок торта или подарок больше"
      oshibochnaya_reakciya: "Измерять куски линейкой и ругать обоих."
      teplyy_i_mudryy_otvet: "Улыбнуться: «Ой, кажется, сейчас из леса выйдет Лиса Патрикеевна помогать вам уравнивать торт! Или сами поделите по-братски?»"
    - situaciya: "Один ребёнок жалуется посторонним на родного брата или сестру"
      oshibochnaya_reakciya: "Поддерживать жалобу при чужих."
      teplyy_i_mudryy_otvet: "Мягко объяснить наедине: «Мы с братом — одна семья. Дома мы всё разберём по справедливости, а перед чужими людьми всегда бережём друг друга»."
    - situaciya: "Старший ребёнок сам уступил младшему в игре или угощении"
      oshibochnaya_reakciya: "Воспринять как должное и промолчать."
      teplyy_i_mudryy_otvet: "Горячо отметить поступок: «Ты поступил как настоящий мудрый старший брат — поэтому в нашем доме всегда будет целый сыр!»"
metodika_i_matrica_2x2:
  paradox_skazki_ru: "Построим матрицу по двум осям: Ось X — способность договариваться напрямую внутри своего круга, Ось Y — великодушие и фокус на росте общего пирога («сыра»)."
  kto_est_kto_4_roli:
    - "1. «Головка сыра» — Совместно созданный бизнес, прибыль или капитал семьи: Ценный актив, которого с избытком хватило бы обоим партнёрам для сытой жизни и развития, если разделить его быстро и по-доброму (даже 55 на 45)."
    - "2. «Два жадных медвежонка» — Соучредители, ослеплённые борьбой за 1% перевеса: Вместо того чтобы смотреть на абсолютный размер своего куска, они смотрят только в тарелку партнёра: «Лишь бы ему не досталось на крошку больше!». Из-за этого парализуется управление и открываются ворота для чужаков."
    - "3. «Лиса-уравнительница» — Выгодоприобретатель чужого раздора (Захватчики, лукавые посредники, конкуренты): Лиса никогда не заинтересована в быстром мире! Её расчёт — специально ломать сыр неровно, поддерживать вражду между братьями и на каждом витке «откусывать» лучшую долю общего дела."
    - "4. «Мудрые Партнёры Квадрата 4» — Мастера прямого внутреннего соглашения: Знают железное правило: худой мир внутри семьи и товарищества на 50% выгоднее любой «идеальной справедливости» через пасть внешней Лисы."
  dve_lovushki:
    - "Ловушка 1 — Относительная зависть вместо счёта абсолютной выгоды: В теории игр это ошибка нулевой суммы: партнёр готов потерять полголовы сыра, лишь бы второй партнёр потерял столько же! Всегда считайте, сколько сыра останется у вас на столе, а не сколько у соратника."
    - "Ловушка 2 — Вынос внутреннего спора во внешний контур (Приглашение Лисы): Как только учредители перестают разговаривать напрямую за закрытой дверью и начинают воевать через внешние силы, блокировать счета и останавливать отгрузки — они передают нож и сам сыр в лапы Лисы."
    - "★ Секрет Несокрушимого Партнёрства — Формула деления ДО находки сыра + Великодушие: Договаривайтесь о правилах распределения прибыли на берегу («наказ медведицы»), используйте механизм «один режет — другой выбирает» и помните: уступить партнёру 5% в спорном вопросе в двадцать раз дешевле, чем кормить Лису."
  sekret_skazki_ru: "Никогда не отдавайте право резать ваш общий сыр тому, кто сам голоден и не строил ваш бизнес."
  os_y_vertikalnaya:
    nazvanie_ru: "ФОКУС НА РОСТЕ ОБЩЕГО АКТИВА («СЫРА») →"
    niz_ru: "Низкая"
    verh_ru: "Высокая ↑"
  os_x_gorizontalnaya:
    nazvanie_ru: "СПОСОБНОСТЬ ДОГОВАРИВАТЬСЯ ВНУТРИ СЕМЬИ И ПАРТНЁРСТВА"
    levo_ru: "Внешний конфликт («Звать Лису»)"
    pravo_ru: "Прямой внутренний договор"
  kvadraty:
    kvadrat_1_levyy_nizhniy:
      zagolovok_ru: "Квадрат 1 • Две крошки на зубок — КРАХ ОТ МЕЛОЧНОЙ ЖАДНОСТИ"
      sut_ru: "Потеряли и бизнес, и братские отношения ради копеечного принципа «пусть никому не достанется»."
    kvadrat_2_levyy_verhniy:
      zagolovok_ru: "Квадрат 2 • Битва амбиций через посредников — КОРМЛЕНИЕ ВНЕШНЕЙ ЛИСЫ"
      sut_ru: "Бизнес крупный и доходный, но соучредители воюют за контроль через внешние структуры. Лиса съедает компанию кусок за куском."
    kvadrat_3_pravyy_nizhniy:
      zagolovok_ru: "Квадрат 3 • Мелкая делёжка без роста — ДЕЛЁЖ СЛИШКОМ МАЛОГО ПИРОГА"
      sut_ru: "Не ссорятся при чужих, но вместо того чтобы вместе искать новые «головки сыра» на рынке, часами взвешивают каждую крошку старого."
    kvadrat_4_pravyy_verhniy_pravilnyy_otvet:
      zagolovok_ru: "★ Квадрат 4 (ПРАВЫЙ ВЕРХНИЙ УГОЛ): БРАТСКИЙ КАПИТАЛ И УМНОЖЕНИЕ СЫРА"
      sut_ru: "Прозрачные правила на берегу, взаимная щедрость к своим и железный запрет на вынос разногласий наружу. 100% капитала работает на семью и дело."
  tri_pravila_perehoda_v_kvadrat_4:
    - "Правило 1. Партнёрское соглашение на берегу: Прописывайте формулу распределения прибыли и выхода из споров ДО того, как нашли «большой сыр»."
    - "Правило 2. Принцип «Один делит — другой выбирает»: Лучший механизм оценки долей и активов без привлечения внешних «уравнителей»."
    - "Правило 3. Бонус за уступку внутри своих: В спорном вопросе между своими всегда выгоднее уступить 5% сегодня и сразу идти зарабатывать следующий миллион."
  tablica_rabochih_situaciy:
    - situaciya: "Спор соучредителей о распределении годовой премии или долей"
      ubytschnyy_otvet: "Встать в позу и парализовать работу компании на полгода."
      pravilnyy_otvet_kvadrat_4: "Сесть вдвоём за закрытой дверью, посчитать цену простоя («аппетит Лисы») и за 1 час подписать компромисс."
    - situaciya: "Конфликт между отделом продаж и производством за «кто главнее»"
      ubytschnyy_otvet: "Жаловаться внешним консультантам и саботировать общие заказы."
      pravilnyy_otvet_kvadrat_4: "Напомнить команде: «Сыр один на всех! Если уроним клиента — останемся с двумя крошками»."
    - situaciya: "Наследственное и семейное планирование активов"
      ubytschnyy_otvet: "Оставить нечёткие устные договорённости."
      pravilnyy_otvet_kvadrat_4: "Заранее создать прозрачный семейный уклад и реестр активов, исключающий любые споры между детьми."
    - situaciya: "Появление внешнего «советчика», разжигающего недоверие между партнёрами"
      ubytschnyy_otvet: "Слушать сплетни о том, что «у брата кусок больше»."
      pravilnyy_otvet_kvadrat_4: "Мгновенно распознать Лису Патрикеевну и выставить её за дверь."
  krylatyy_slovar_komandy:
    - "«Друзья, мы сейчас делим сыр сами или позовём Лису?» — Внутренний спор затянулся и грозит выйти за пределы компании или привести к прямым убыткам. (Действие: Мгновенно прекращаем препирательства и договариваемся напрямую.)"
    - "«Не смотри, на сколько грамм больше у брата, — смотри, чтобы весь сыр остался в семье!» — Партнёр или руководитель отдела зациклился на мелочном сравнении вместо общей выгоды. (Действие: Переключаем фокус на сохранение и рост общего результата.)"
    - "«Хоть и помалу, зато поровну — это финал Лисы, а не наш!» — Уравнительное решение ведёт к тому, что проигрывают все участники проекта. (Действие: Отказываемся от вредной уравниловки в пользу большой общей прибыли.)"
    - "«Кто ломает сыр неровно — тот хочет откусить от обеих половин!» — Третья сторона искусственно стравливает два отдела или двух партнёров. (Действие: Объединяем позиции против внешнего манипулятора.)"
sovet_18_ekspertov:
  kontur_1_smysl_i_metodologiya:
    rol_01_dba_instrument: "Транзакционные издержки конфликта (Transaction Cost Economics по Р. Коузу / О. Уильямсону), переговорная формула справедливого раздела «Один делит — другой выбирает» (Cut-and-Choose) и защита семьи/партнёрства от внешних хищников-арбитров"
    rol_02_mckinsey_mece_proverka: "Ось X (Способность договариваться напрямую внутри семьи/команды по честной формуле) × Ось Y (Взаимное доверие и приоритет общего пирога над миллиметровой завистью) — спасают от потери всего актива в пользу «Лисы-посредника» (Кв. 1) и выводят к братскому согласию (★ Кв. 4)."
    rol_03_edtech_perenos_v_privychku_24ch:
      dlya_semyi_segodnya_vecherom: "Внедрите сегодня же дома золотое правило «Один режет — другой выбирает»: когда дети делят пирожное, яблоко или время за игрой, первый делит на две части, а второй первым выбирает себе кусочек — споры исчезают за одну секунду!"
      dlya_rukovoditelya_zavtra_utrom: "Если между соучредителями или департаментами возник спор о разделе бюджета/бонуса, решите его внутри по формуле симметричного выбора за 24 часа — никогда не выносите внутренний конфликт в затяжную войну, где 90% «головки сыра» съедят внешние консультанты и конкуренты."
    rol_04_skazochnik_transkreator: "T1 + T4: В финале медвежата не остаются в горькой ссоре — увидев крошки сыра после лисьей «помощи», братья обнимаются, смеются над своей ошибкой и договариваются отныне всегда делить всё по-братски: один режет, другой выбирает."
    rol_05_rezhisser_chteniya_vsluh_i_audio: "Тёплый лесной колорит; смешное ворчание двух медвежат («у тебя кусочек толще!»); вкрадчивое «хрум-хрум» Лисы, уравнивающей сыр, и дружный братский смех прозрения в финале."
    rol_06_briks_i_vostok_most: "Венгерский и славянский фольклор: сказка «Два жадных медвежонка»; Индия (Панчатантра) и Эзоп: притча о двух котах и обезьяне с весами; древнее право: ветхозаветный и римский принцип «Раздели и дай выбрать»."
  kontur_2_chetyre_auditorii:
    rol_07_deti_6_10_let: "1. Не жадничай со своими: Уступить брату или сестре — значит сохранить всё богатство в семье. 2. Договаривайся сам: Умные братья делят сыр по совести, не зовя хитрую Лису. 3. Помни наказ мамы: Дружба родных людей — самое большое сокровище на свете."
    rol_08_semya_i_60_plyus: "100% чистый русский язык без англицизмов и жаргона; уважение к бабушкам и дедушкам (60+) как хранителям семейного лада."
    rol_09_upravlency_mba: "1. Учите детей договариваться: Дайте детям простые инструменты честного деления без посредников. 2. Воспитывайте великодушие: Щедрость к близким делает человека по-настоящему богатым. 3. Храните единство рода: Пока семья едина изнутри — ни одна внешняя «Лиса» ей не страшна."
    rol_10_predprinimateli_sovladelcy: "Никогда не отдавайте право резать ваш общий сыр тому, кто сам голоден и не строил ваш бизнес."
  kontur_3_vizual_produkt_pravo:
