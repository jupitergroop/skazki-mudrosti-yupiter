celi_i_klyuchi:
  cel_rebenka_6plus: "Медвежата нашли целую головку вкусного сыра, но так боялись уступить родному брату лишнюю крошку, что отдали почти весь сыр хитрой Лисе! Где между братьями мир и щедрость — там всегда сытость и радость."
  cel_roditelya_i_lidera: "Сказка показывает экономическую анатомию любого корпоративного, акционерного или наследственного конфликта:"
  zolotoy_klyuchik_malym_ru: "1. Не жадничай со своими: Уступить брату или сестре — значит сохранить всё богатство в семье. 2. Договаривайся сам: Умные братья делят сыр по совести, не зовя хитрую Лису. 3. Помни наказ мамы: Дружба родных людей — самое большое сокровище на свете."
  zolotoy_klyuchik_bolshim_ru: "1. Учите детей договариваться: Дайте детям простые инструменты честного деления без посредников. 2. Воспитывайте великодушие: Щедрость к близким делает человека по-настоящему богатым. 3. Храните единство рода: Пока семья едина изнутри — ни одна внешняя «Лиса» ей не страшна."
  deviz_skazki_ru: "«Лучше уступить родному брату лишнюю крошку, чем отдать весь сыр хитрой Лисе»"
  deviz_upravleniya_ru: "«В любой войне двух партнёров за лишний процент выигрывает только третья сторона — Лиса»"
tekst_istorii:
  predislovie_avtora_ru: "Любимая с детства сказка «Два жадных медвежонка», перекликающаяся с древней притчей Панчатантры о двух котах и судье с весами, дарит семье и бизнесу главное правило разрешения споров: когда братья воюют из-за миллиметра, всю головку сыра съедает Лиса. В каждой семье, где растут дети, знакома картина: «Почему у него кусок пирога на миллиметр больше моего?!». Из-за этого пустякового спора родные братья и сёстры порой готовы рассориться до слёз и испортить весь праздник. Сказка «Два жадных медвежонка» лечит эту детскую болезнь за пять минут весёлого чтения! Стоит ребёнку увидеть, как хитрая Лиса «уравнивала» головку сыра, откусывая то от одной, то от другой половины, пока не оставила медвежатам две крошки на зубок, — и дети сами начинают с улыбкой уступать друг другу лучший кусок."
  predislovie_upravlenie_ru: "В практике корпоративного управления и арбитража нет сюжета более частой и трагичной точности, чем сказка «Два жадных медвежонка». Два партнёра (или два наследника, или два ключевых отдела) вместе находят и выращивают великолепный рыночный актив — «большую круглую головку сыра». И в момент деления прибыли им кажется несправедливым, что партнёру достанется на 3–5% больше! Начинается принципиальный конфликт, в который приглашается третья сторона — «Лиса» (рейдеры, затяжные суды, внешние управляющие или конкуренты). Лиса с радостью начинает «уравнивать доли», откусывая кусок за куском, пока от цветущей компании не остаются две крошки. Перечитаем сказку и выстроим защиту партнёрства."
  sceny_family_5str:
    - scena: 1
      aforizm_ru: "❧ Лист I. Наказ мамы-медведицы: «Берегите друг друга и всё делите по-братски!» ❧"
      tekst_ru: "Подросли однажды за густым сосновым лесом два брата-медвежонка и решили пойти по белу свету счастья искать. Обняли они на прощание старую медведицу-мать, а она им ласково да строго наказала: «Смотрите же, сынки, живите дружно, друг от друга в пути не отставайте и всё, что найдёте, делите по-честному, по-братски!»\n\nОбещали медвежата свято исполнить материнский наказ и бодро зашагали по лесной дороге. Шли они день, шли другой — вот и закончились у них все дорожные припасы, проголодались братья не на шутку."
    - scena: 2
      aforizm_ru: "❧ Лист II. Ссора над головкой сыра и появление ласковой Лисы ❧"
      tekst_ru: "Вдруг видят медвежата: лежит на зелёной траве под берёзой большая круглая головка душистого золотистого сыра! Обрадовались братья, хотели было разделить сыр пополам, да взяла их жадность — каждый боялся, что другому достанется кусок хоть на крошечку побольше!\n\nСпорили они, спорили, рычали друг на друга, тянули сыр каждый в свою сторону — никак поделить не могут. Тут откуда ни возьмись подошла к ним рыжая Лиса Патрикеевна, поклонилась ласково и спрашивает: «О чём вы, милые медвежатки, спорите да ссоритесь?»"
    - scena: 3
      aforizm_ru: "❧ Лист III. Хитрая делёжка: «Этот кусок больше — нечестно!» ❧"
      tekst_ru: "Рассказали медвежата Лисе про свою беду. А Лисица сладко улыбнулась и говорит: «Экая беда! Давайте я вам сыр поровну разделю: мне что младший, что старший — оба одинаково любы!»\n\nОбрадовались глупые медвежата: «Дели, Лисонька!». Взяла Лиса круглую головку сыра да нарочно и разломила её надвое так, что один кусок вышел заметно больше другого! Медвежата в один голос закричали: «Этот кусок больше! Нечестно!»"
    - scena: 4
      aforizm_ru: "❧ Лист IV. Как Лиса «уравнивала» сыр, откусывая то справа, то слева ❧"
      tekst_ru: "Лиса успокоила их: «Тише, молодцы, эта беда поправимая! Сейчас я сама всё подровняю!» — да как откусит огромный кусок от большей половины и проглотит!\n\nТеперь меньший кусок стал больше! Медвежата снова забеспокоились: «И так неровно!». Лиса посмотрела на них укоризненно: «Ну полно вам, я сама своё дело знаю!» — и откусила добрый кусок от второй половины! Стал опять первый кусок больше, а Лиса знай себе кусает то от одного, то от другого куска — «уравнивает»!"
    - scena: 5
      aforizm_ru: "❧ Лист V. «Хоть и помалу, да поровну!» — горький урок для жадных братьев ❧"
      tekst_ru: "До тех пор «ровняла» хитрая Лиса сыр, пока сама досыта не наелась, а от большой круглой головки остались два крохотных кусочка — как раз на один зубок! Протянула она эти крошки остолбеневшим медвежатам, вильнула пушистым хвостом и сказала со смехом: «Ну вот, теперь куски совершенно ровные! Хоть и помалу, да поровну! Кушайте на здоровье!»\n\nПосмотрели медвежата на две крошки, вспомнили материнский наказ да и поняли: кто жадничает перед родным братом и зовёт делить добро чужую Лису — тот всегда остаётся голодным."
  sceny_mgmt_3str:
    - scena: 1
      aforizm_ru: "❧ Лист I из III. Конфликт совладельцев над активом и передача контроля внешнему «арбитру» ❧"
      tekst_ru: "Два брата-медвежонка отправились в путь, пообещав матери жить дружно и всё делить по-братски. В лесу они нашли большую круглую головку сыра. Хотели разделить её пополам, но каждого заела жадность и страх, что брату достанется кусок чуть больше.\n\nНа шум их яростного спора подошла Лиса Патрикеевна и ласково предложила услуги «независимого арбитра»: «Давайте я вам сыр поровну разделю!». Медвежата с радостью отдали актив в руки Лисы."
    - scena: 2
      aforizm_ru: "❧ Лист II из III. Механизм поглощения актива через затяжное «уравнивание» сторон ❧"
      tekst_ru: "Лиса нарочно разломила сыр неровно, чтобы разжечь спор ещё сильнее. Когда медвежата закричали «Нечестно!», Лиса охотно взялась «уравнивать» доли — и откусила огромный кусок от большей половины.\n\nТеперь перевес оказался на другой стороне! И под видом борьбы за абсолютную справедливость Лиса стала откусывать то от правого, то от левого куска на каждом новом раунде спора."
    - scena: 3
      aforizm_ru: "❧ Лист III из III. «Хоть и помалу, да поровну!» — цена корпоративной войны со своими ❧"
      tekst_ru: "До тех пор «ровняла» Лиса сыр, пока сама досыта не наелась, а медвежатам оставила две крохотные крошки со словами: «Хоть и помалу, зато совершенно поровну! Кушайте на здоровье!»\n\nТак из-за мелочной жадности к родному партнёру братья отдали 98% своего богатства чужому хищнику."
