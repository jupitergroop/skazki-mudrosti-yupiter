celi_i_klyuchi:
  cel_rebenka_6plus: "Понять, почему знания природы и честный труд всегда сильнее ленивого рыка и почему вчерашний ответ не подходит к новой задаче."
  cel_roditelya_i_lidera: "Увидеть, почему сильный игрок с ресурсом («Медведь»), не разбирающийся в сути продукта, дважды остаётся с ботвой, и выстроить «Союз Мастера и Ресурса»."
  zolotoy_klyuchik_malym_ru: "1. Учись и познавай мир: кто знает, как растёт репа и пшеница, того никто не проведёт. 2. Трудись честно: урожай любит заботливые руки, а не ленивый рык. 3. Делись по справедливости."
  zolotoy_klyuchik_bolshim_ru: "1. Стремитесь в Правый Верхний Квадрат (Квадрат 4): экспертиза в продукте + честный дизайн сделки. 2. Ищите суть ценности: не путайте пышную форму («ботву») с реальным активом («корнем»). 3. Отказ от шаблонов на новом рынке."
  golden_key_children_en: "Knowledge and honest work beat a loud roar every time; always learn where the true fruit grows."
  golden_key_adults_en: "Capital without domain expertise buys useless tops; unite deep product mastery with fair profit-sharing in the final harvest."
tekst_istorii:
  predislovie_avtora_ru: "Перекликаясь с мировой притчей о «Вершках и корешках», история Мужика и Медведя показывает детям и основателям бизнеса, почему хитрая уловка в первом сезоне всегда стоит потери партнёра во втором. Сказка «Вершки и корешки» за две минуты объясняет то, чему на программах управления учат годами. Ребёнок с улыбкой видит, почему знание природы и трудолюбие крестьянина оказываются сильнее медвежьей лапы. А взрослый руководитель и инвестор узнаёт в Медведе типичную ошибку сильного игрока, который диктует условия сделки («мне вершки!», «теперь мне корешки!»), не разбираясь в сути самого продукта — и дважды остаётся с сухой ботвой."
  sceny_family_5str:
    - scena: 1
      aforizm_ru: "Кто дело до корня знает, тот и при грозном соседе со своим урожаем останется."
      tekst_ru: "Выехал ранней весной трудолюбивый Мужик на лесную поляну землю пахать да сладкую репу сеять. Только проложил первую борозду, как выходит из дубравы косолапый Медведь — хозяин лесной — и рычит грозно: «Мужик, а Мужик! Зачем в моём лесу пашешь? Вот я тебя сейчас поломаю!» Не растерялся сметливый пахарь, снял шапку да ласково отвечает: «Не губи меня, Михайло Потапыч! Давай лучше вместе репу сеять: я землю вспашу, семена брошу да выхожу урожай, а осенью поделим по уговору. Чур, кому вершки, а кому корешки?» Подумал Медведь: «Вершки-то на солнышке растут, зелёные да пышные!» — и прогремел: «Мне — вершки, а тебе — корешки!»"
    - scena: 2
      aforizm_ru: "Осенний делёж: Мужик складывает на телегу янтарную репу, а Медведь уносит гору зелёной ботвы."
      tekst_ru: "Всё лето трудился Мужик на полосе: репу полол, ключевой водой поливал. Выросла к осени репа крупная, круглая, ровно янтарное золото в земле светится! Вышел Мужик с телегой урожай копать, а тут и Медведь из чащи шагает: «Ну, Мужик, давай по уговору делить — подавай мои вершки!» Срезал Мужик всю зелёную ботву и сложил Медведю целую гору: «Бери, Михайло Потапыч, всё до единого листочка по нашему слову!» Обрадовался Медведь, что его куча вдвое выше телеги, сгрёб охапку ботвы в лапы и важно зашагал в берлогу, а Мужик сложил сладкую золотую репу на воз и повёз в город продавать."
    - scena: 3
      aforizm_ru: "Встреча на лесной дороге: Медведь пробует сладкую пареную репку и требует сменить уговор."
      tekst_ru: "Сел Медведь на лесной пенёк, стал свои зелёные вершки жевать — а ботва-то жёсткая да горькая! Вдруг слышит: едет по дороге Мужик на расписной телеге да румяной пареной репой полавливается. «Мужик, а Мужик, что это ты ешь?» — «А это, Михайло Потапыч, мои корешки!» Дал Мужик Медведю одну репку попробовать. Раскусил её косолапый — слаще мёда! Заревел тогда Медведь от досады: «Обманул ты меня, Мужик! Твои корешки сладкие, а мои вершки горькие! Ну, погоди: на будущий год посеешь у леса — мне отдашь корешки, а себе оставишь вершки!»"
    - scena: 4
      aforizm_ru: "Второе лето: среди золотой пшеницы Медведь грозно требует себе корешки."
      tekst_ru: "На следующую весну приехал Мужик на ту же лесную опушку, только посеял он на этот раз не репу, а золотую пшеницу. Заколосилась к концу лета нива — стоит стеной янтарной, тяжёлыми зёрнами на солнце переливается. Приходит Медведь на жнивье, грозно лапой в землю тычет: «Помнишь, Мужик, наш уговор? В прошлом году я на вершках прогадал — теперь меня не проведёшь! Подавай мне корешки, а себе забирай вершки!» Поклонился Мужик спокойно: «Как скажешь, Михайло Потапыч, пусть будет по-твоему!»"
    - scena: 5
      aforizm_ru: "Жатва: Мужик увозит полные снопы пшеницы на белый хлеб, а Медведь остаётся с сухой стернёй."
      tekst_ru: "Сжали они пшеницу: Мужик собрал на телегу полные, налитые колосья — вершки, а Медведю оставил целое поле сухих да колючих пшеничных корней. Намолотил Мужик белой муки, напёк пышных ситных калачей да пирогов, а Медведь бился-бился над сухими корешками — в рот не возьмёшь! Рассердился тогда Медведь пуще прежнего, что снова с пустыми лапами остался, махнул в глухую чащу и с той поры в крестьянские дела соваться зарёкся. А Мужик со своей семьёй всю зиму белый хлеб ел да добрым людям помогал."
