  kontur_1_smysl_i_metodologiya:
    rol_01_dba_instrument: "Архитектура справедливого партнёрского соглашения (Shareholders' Agreement / SLA), привязка распределения прибыли к реальной цепочке создания ценности и аудит предмета сделки"
    rol_02_mckinsey_mece_proverka: "Ось X (Глубина знания матчасти и предмета договора) × Ось Y (Справедливость учёта вклада второго партнёра) — дают 4 точных сценария: от дилетантского спора (Кв. 1) и хищнического перекоса «вершки/корешки» (Кв. 2–3) к долгосрочному совместному предприятию (★ Кв. 4)."
    rol_03_edtech_perenos_v_privychku_24ch:
      dlya_semyi_segodnya_vecherom: "При любом общем домашнем деле сегодня сначала вместе назовите, что в этом деле «сладкий корень», а что «ботвушка», и разделите и труд, и радость пополам."
      dlya_rukovoditelya_zavtra_utrom: "Перечитайте 1 действующий партнёрский или подрядный договор: проверьте, привязано ли вознаграждение к конечному полезному продукту («съедобной части урожая»), а не к формальному объёму отчётов («ботве»)."
    rol_04_skazochnik_transkreator: "T1 + T4: Сказка переведена из плоскости «как перехитрить соседа» в плоскость «почему сделка с односторонней выгодой разрушает партнёрство уже на второй сезон и как делить урожай по совести»."
    rol_05_rezhisser_chteniya_vsluh_i_audio: "Контраст басовитого, нетерпеливого голоса Медведя и спокойного, рассудительного тона Мужика; выразительные паузы перед объявлением «А теперь, Михайло Потапыч, твои вершки!»."
    rol_06_briks_i_vostok_most: "Европа (братья Гримм, Рабле): сказка о крестьянине и разделе урожая репы и пшеницы; Индия: притча о разделе коровы и пальмы; Китай: принцип «Гун Ин» (взаимный выигрыш в торговом товариществе)."
  kontur_2_chetyre_auditorii:
    rol_07_deti_6_10_let: "1. Учись и познавай мир: кто знает, как растёт репа и пшеница, того никто не проведёт. 2. Трудись честно: урожай любит заботливые руки, а не ленивый рык. 3. Делись по справедливости."
    rol_08_semya_i_60_plyus: "100% чистый русский язык без англицизмов и жаргона; уважение к бабушкам и дедушкам (60+) как хранителям семейного лада."
    rol_09_upravlency_mba: "1. Стремитесь в Правый Верхний Квадрат (Квадрат 4): экспертиза в продукте + честный дизайн сделки. 2. Ищите суть ценности: не путайте пышную форму («ботву») с реальным активом («корнем»). 3. Отказ от шаблонов на новом рынке."
    rol_10_predprinimateli_sovladelcy: "1. Стремитесь в Правый Верхний Квадрат (Квадрат 4): экспертиза в продукте + честный дизайн сделки. 2. Ищите суть ценности: не путайте пышную форму («ботву») с реальным активом («корнем»). 3. Отказ от шаблонов на новом рынке."
  kontur_3_vizual_produkt_pravo:
    rol_11_hudozhnik_illyustrator: "Пресет STYLE_1_RUSSIAN_TEREM, палитра #fbf6ec, #7a1c14, #b88938, #1e352f"
    rol_12_infodizayner_matric: "Правильный ответ всегда закреплён в Правом Верхнем Углу (★ Квадрат 4) с золотой рамкой и мгновенным считыванием за 3 секунды."
    rol_13_verstalshchik_gost: "Эталон 13 страниц (1 обложка + 12 страниц блока по ГОСТ Р 7.0.4-2020), висячие строки = 0, воздух ≥ 25%."
    rol_14_inzhener_pechati_kdp: "CMYK FOGRA39 (TAC ≤ 240%), вылеты 3.2 мм (0.125 in); индивидуальный выпуск 13 стр. для Kindle eBook + сборка в тома по 3 сказки (36 стр.) для KDP Paperback и по 8 сказок (108 стр.) для KDP Hardcover."
    rol_15_ii_pedagog_sokrat: "Сократический режим: ИИ-наставник сначала задаёт наводящий вопрос по сказке и хвалит за размышление; не собирает персональные данные детей (Zero PII)."
    rol_16_prodyuser_amazon_kdp: "Наднациональное позиционирование 'Tops and Bottoms (The Bear and the Farmer): Fairness, Work, and Honest Sharing' + западный культурный мостик в 1-й строке предисловия."
    rol_17_yurist_rf: "ГК РФ ст. 1041–1048 (Договор простого товарищества и распределение прибыли пропорционально реальному вкладу), ст. 432 (Существенные условия о предмете договора), ст. 178 (Недействительность сделки, совершённой под влиянием существенного заблуждения о природе актива)."
