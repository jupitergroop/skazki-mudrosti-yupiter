      pravilnyy_otvet_kvadrat_4: "Провести свежий аудит: где именно рождается ключевая ценность в новом продукте."
    - situaciya: "Переговоры с обладателем крупного ресурса"
      ubytschnyy_otvet: "Уйти в скрытую информационную войну («оставить с ботвой»)."
      pravilnyy_otvet_kvadrat_4: "Перевести диалог на язык взаимной выгоды: «Мой труд + ваша защита = 80/20 в готовом зерне»."
  krylatyy_slovar_komandy:
    - "«Унести ботву» — забрать формально большую, но бесполезную часть сделки из-за незнания продукта."
    - "«Ошибка Медведя на пшенице» — слепо применить вчерашнее правило к новой задаче."
