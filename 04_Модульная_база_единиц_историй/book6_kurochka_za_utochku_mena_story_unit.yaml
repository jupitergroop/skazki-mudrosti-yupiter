celi_i_klyuchi:
  cel_rebenka_6plus: "Дедушка не хотел сделать плохо — он просто уставал в дороге и каждый раз менял большое, но трудное дело на маленькое и лёгкое, пока не остался с пустыми руками. Зато бабушка показала, что такое настоящая семейная любовь!"
  cel_roditelya_i_lidera: "Сказка показывает сразу две стороны жизни лидера: как не растерять капитал в цепочке мелких уступок на внешнем рынке и как сохранить единство внутри семьи и команды."
  zolotoy_klyuchik_malym_ru: "1. Думай перед меной: Не отдавай большое и доброе дело за пустяк только потому, что устал в пути. 2. Говори правду дома: Родные всегда поймут и поддержат тебя, если рассказать всё честно. 3. Люби своих близких: Тёплое слово и объятие сильнее любой неудачи."
  zolotoy_klyuchik_bolshim_ru: "1. Приоритет родного человека: Ни одна разбитая или потерянная вещь не стоит слёз и потери доверия в семье. 2. Урок масштаба: Учите детей не снижать планку мечты при первых трудностях. 3. Несокрушимый тыл: Семья, где стоят друг за друга горой, выигрывает любой жизненный спор."
  deviz_skazki_ru: "«Добро — дело наживное, а любовь и мир в родном доме дороже золота»"
  deviz_upravleniya_ru: "«Большие состояния теряются не сразу, а через цепочку мелких уступок ради удобства»"
tekst_istorii:
  predislovie_avtora_ru: "Перекликаясь со сказками Андерсена «Что муженёк ни сделает, всё хорошо» и братьев Гримм «Ганс в счастье», эта ярмарочная история раскрывает сразу два секрета: как не терять капитал на эмоциональных обменах и как беречь мир в семье. В русской сказке «Курочка за уточку (Мена)» спрятаны сразу два удивительных сокровища. Первое — для детского ума: как легко потерять хорошую, ценную вещь или важное дело, если при первой же усталости менять его на что-то полегче да помельче: коня — на корову, корову — на овечку, уточку — на курочку, а курочку — на иголочку! А второе сокровище — для самого сердца: посмотрите, как мудрая старуха встретила вернувшегося старика! Она не стала бранить его за потерю, обняла с теплом и сказала: «Слава Богу, что ты сам живой да здоровый вернулся, а добро — дело наживное!». И именно эта любовь вернула в их дом сторицей всё потерянное."
  predislovie_upravlenie_ru: "Ни один руководитель и ни один взрослый человек в здравом уме не согласится напрямую обменять горшок золота или породистого коня на пустую швейную иголку. Но почему тогда в бизнесе сплошь и рядом сильные проекты, высокая маржа и блестящие стартовые позиции за год стачиваются в ноль? Сказка «Курочка за уточку (Мена)» показывает этот механизм с поразительной точностью: деградация цели всегда идёт маленькими шагами («конь → корова → овца → свинья → гусь → утка → курица → иголка»), когда уставший человек каждый раз выбирает вариант чуть проще и мельче. Но финал сказки открывает и второй секрет — силу безусловного тыла."
  sceny_family_5str:
    - scena: 1
      aforizm_ru: "❧ Лист I. Лесной клад и покупка резвого гнедого коня ❧"
      tekst_ru: "Жили-были в одной деревне старик со старухой — жили душа в душу, никогда друг друга худым словом не попрекали. Пошёл однажды старик в лес по дрова, стал сухой пень корчевать, глядь — а под корнями чугунок со старинными золотыми монетами стоит!\n\nПринёс старик клад домой, а старуха и говорит: «Поезжай-ка ты, старый, на ярмарку да купи нам доброго коня в хозяйство». Пошёл старик по дороге, видит — ведёт навстречу прохожий резвого гнедого коня. Отдал старик горшочек с золотом за коня и радостно повёл его домой."
    - scena: 2
      aforizm_ru: "❧ Лист II. Первые уступки в пути: конь на корову, корова на овечку ❧"
      tekst_ru: "Ведёт старик коня, а конь горячий, норовистый — дёргает за повод, того и гляди вырвется. Утомился старик, а навстречу ему пастух гонит пёструю корову. Подумал старик: «На что мне конь? С коровой спокойнее, да и старуха молочка попьёт!» — и выменял коня на корову.\n\nПрошёл ещё две версты — устала корова, упёрлась рогами и ни с места. А навстречу идёт мужик с кудрявой овечкой. «Дай-ка, — думает старик, — поменяю корову на овечку: она и легче идёт, и шерсти на валенки даст!» Выменял корову на овечку и зашагал дальше."
    - scena: 3
      aforizm_ru: "❧ Лист III. Овечка на поросёнка, гусь на уточку, а уточка — за курочку! ❧"
      tekst_ru: "Дошёл старик до околицы, а овечка блеет да в кусты тянет. Повстречался ему мужик с розовым поросёнком — поменял старик овечку на поросёнка. Завизжал поросёнок на всю дорогу — поменял его старик у птичницы на белого гуся!\n\nА гусь шипит да за пятки щиплет! Увидел старик у пруда бабу с серой уточкой и говорит: «Возьми, хозяюшка, гуся, а мне отдай уточку!» Прошёл ещё немного, глядит — бежит по двору рябая курочка-хлопотунья. Не удержался старик и выменял уточку за курочку!"
    - scena: 4
      aforizm_ru: "❧ Лист IV. Последняя мена у ворот: курочка за швейную иголочку ❧"
      tekst_ru: "У самых деревенских ворот встретился старику весёлый коробейник с лотком и говорит: «На что тебе, дедушка, одна курица? Возьми-ка лучше у меня стальную швейную иголочку — старухе обновки шить, подарок хоть куда!»\n\nОбрадовался простодушный старик, отдал рябую курочку за иголочку, сунул иголку за обшлаг кафтана да полез через плетень к соседу поделиться радостью — а иголочка возьми да и выскользни в густую траву! Искал-искал старик в потёмках — так и не нашёл."
    - scena: 5
      aforizm_ru: "❧ Лист V. Тёплое слово жены, которое оказалось дороже золотого клада ❧"
      tekst_ru: "Сосед услыхал всю историю да и говорит со смехом: «Ну, сосед, теперь твоя старуха тебя со свету сживёт! Бьюсь об заклад на сто рублей, что она тебя и на порог не пустит!» Поспорили они и пошли в избу. Рассказал старик жене всё как на духу: как коня на корову сменял, корову на овцу, овцу на поросёнка, поросёнка на гуся, гуся на уточку, уточку на курочку, а курочку на иголку — да и ту в траве обронил!\n\nА добрая старуха обняла его ласково и говорит: «Слава Богу, что ты сам, мой родной, живой да здоровый домой вернулся! А добро — дело наживное!» Удивился сосед, отдал старику сто рублей за проигранный спор, и зажили старик со старухой в согласии да в достатке."
  sceny_mgmt_3str:
    - scena: 1
      aforizm_ru: "❧ Лист I из III. Эрозия масштаба: как усталость в пути заставляет менять коня на корову и овцу ❧"
      tekst_ru: "Жили старик со старухой в ладу да согласии. Нашёл старик в лесу под пнём чугунок с золотом, выменял на него доброго коня и повёл домой. Дорогой конь стал горячиться и рвать повод. Утомился старик и подумал: «Обменяю-ка я коня на корову — с ней и спокойнее, и молоко будет!»\n\nПрошёл ещё две версты — устала корова, упёрлась рогами. Повстречался старику пастух с овечкой — выменял старик корову на овечку. Заблеяла овечка — выменял её на поросёнка. Завизжал поросёнок — отдал его за белого гуся!"
    - scena: 2
      aforizm_ru: "❧ Лист II из III. Гусь за уточку, курочка за иголочку — и спор с соседом у плетня ❧"
      tekst_ru: "Ущипнул гусь старика за пятку — сменял он гуся на серую уточку, а уточку у околицы отдал за рябую курочку. У самых ворот встретился ему ловкий коробейник и уговорил отдать курочку за стальную швейную иголочку — старухе в подарок.\n\nСунул старик иголку за обшлаг кафтана, полез через плетень к богатому соседу похвалиться — да и обронил иголочку в траву! Сосед рассмеялся: «Ну, теперь старуха тебя со свету сживёт! Бьюсь об заклад на сто рублей, что накричит и выгонит!»"
    - scena: 3
      aforizm_ru: "❧ Лист III из III. Триумф надёжного тыла: «Слава Богу, что ты сам живой вернулся!» ❧"
      tekst_ru: "Пришёл старик в избу и честно, без утайки рассказал жене всю цепочку обменов — от золотого клада и коня до потерянной в сене иголки. А мудрая старуха обняла его ласково и сказала: «Слава Богу, что ты сам, мой родной, живой да здоровый вернулся! А добро — дело наживное!»\n\nПотрясённый сосед вынужден был тут же выложить старику сто рублей за проигранный спор — и вернулся в дружную семью достаток ещё больше прежнего."
