voprosy_i_zadaniya:
  tayna_skazki_2stroki_ru: "Дедушка не хотел сделать плохо — он просто уставал в дороге и каждый раз менял большое, но трудное дело на маленькое и лёгкое, пока не остался с пустыми руками. Зато бабушка показала, что такое настоящая семейная любовь!"
  voprosy_besedy_s_rebenkom:
    - "1. Почему дедушка каждый раз менял большее на меньшее: Вести коня было трудно — он взял корову; корова упёрлась — взял овечку. Что бывает, когда мы бросаем хорошее большое дело при первой же усталости и выбираем то, что полегче?"
    - "2. Как не поменять своего «коня» на «иголочку»: Представь, что кто-то во дворе предлагает обменять твою хорошую книгу или игрушку на пустой блестящий фантик. Как вовремя остановиться и посоветоваться с родителями?"
    - "3. Почему бабушка не отругала дедушку и как сосед проиграл сто рублей: Богатый сосед поспорил на сто рублей, что бабушка рассердится из-за пропавшего коня. Но для бабушки родной дедушка был дороже любых денег! Почему её ласковое слово принесло в дом и мир, и сто рублей?"
  mudraya_poslovica_ru: "«Перед обменом подумай головой, а родного человека встречай тёплым сердцем!»"
  volshebnye_slova_druzhby:
    - "Прежде чем меняться чем-то важным, я подумаю и посоветуюсь с мамой и папой."
    - "В нашей семье человек всегда дороже любой вещи: мы не ругаемся из-за случайных потерь."
  igra_vybor_3_dorogi:
    situaciya: "Представь две ситуации: тебе предлагают невыгодный обмен во дворе, или твой младший брат случайно потерял на прогулке общую игрушку. Какой путь ты выберешь?"
    variant_a_oshibka: "Путь 1 (Беспечная мена — «Курочка за иголочку»): Не думая, отдать ценную вещь или променять время учёбы на пустяковую забаву, а потом плакать у плетня."
    variant_b_oshibka: "Путь 2 (Как Насмешливый сосед — «Упрёки и ссора»): Если брат или сестра случайно что-то потеряли или разбили — кричать на них, дразнить и ябедничать."
    variant_v_vernyy: "★ Путь 3 — Мудрый выбор! (Разумный ум и тёплое сердце): Свои вещи и время беречь с умом и не менять на пустяки, а если близкий человек оступился — обнять его и сказать: «Главное, что ты сам цел, а дело мы вместе поправим!»"
  tvorcheskoe_zadanie_risunok: "❖ Творческое задание: нарисуй весёлую цепочку из сказки — коня, корову, овечку, гуся, уточку и рябую курочку!"
  naputstvie_semye_ru: "«Пусть в вашем доме никогда не звучат горькие попрёки из-за вещей, а взаимная любовь и лад возвращают любое добро во сто крат!»"
  praktikum_rukovoditelya_5_tochek:
    - "1. Ревизия цепочки уступок: Нет ли у меня сейчас проекта, который начинался как «золотой конь», а после пяти компромиссов превратился в «уточку»?"
    - "2. Управление сложным масштабом: От какого крупного и перспективного дела я хочу отказаться только потому, что им непривычно и трудно управлять?"
    - "3. Защита от усталых решений: Принимаю ли я финансовые и кадровые решения только в ресурсном, выспавшемся состоянии?"
    - "4. Культура честного доклада: Могут ли мои сотрудники и близкие сразу сказать мне горькую правду об ошибке, не боясь взрыва эмоций?"
    - "5. Крепость семейного тыла: Чувствуют ли мои родные, что в нашем доме человек всегда важнее любой материальной потери?"
matrica_semeynaya_2x2:
  zagolovok_ru: "❖ ЧЕТЫРЕ УРОКА СКАЗКИ ДЛЯ СЕМЬИ И ВОСПИТАНИЯ ❖"
  vvodnaya_mysl_ru: "Эта народная сказка удивительно точно соединяет финансовое воспитание ребёнка (как не разменивать главное на мелкое) и высшую культуру семейных отношений, где атмосфера безусловного доверия делает семью неуязвимой."
  os_y_vertikalnaya: "ТЕПЛО И ПОДДЕРЖКА В СЕМЬЕ →"
  os_x_gorizontalnaya:
    levo_ru: "Размен на пустяки («Иголка»)"
    centr_ru: "БЕРЕЖНОСТЬ К ДЕЛУ, ВРЕМЕНИ И ВЕЩАМ"
    pravo_ru: "Разумный выбор («Конь»)"
  kvadraty:
    kvadrat_1_levyy_nizhniy:
      zagolovok_ru: "Урок I • Потеря и скандал — МЕЧТА ЗЛОГО СОСЕДА"
      sut_ru: "И дело разменяли впустую, и дома из-за потерянной вещи устроили громкую ссору с упрёками. Двойное поражение семьи."
    kvadrat_2_levyy_verhniy:
      zagolovok_ru: "Урок II • Доброта без бережливости — ПРОСТОДУШНЫЙ СТАРИК В ДОРОГЕ"
      sut_ru: "В семье все любят друг друга, но не умеют беречь время, деньги и начатые дела, легко поддаваясь на уговоры «коробейников»."
    kvadrat_3_pravyy_nizhniy:
      zagolovok_ru: "Урок III • Вещи важнее людей — ХОЛОДНЫЙ СУНДУК"
      sut_ru: "За разбитую чашку, порванную куртку или потерянный телефон ребёнка сурово наказывают. Вещи целы, но ребёнок начинает бояться и скрывать правду."
    kvadrat_4_pravyy_verhniy_pravilnyy_otvet:
      zagolovok_ru: "★ ГАРМОНИЯ В СЕМЬЕ И ЖИЗНИ — КРЕПКИЙ ДОМ И МУДРЫЙ СЧЁТ"
      sut_ru: "Детей учат ценить труд и не менять «коня на иголку», но если близкий человек ошибся — дома его всегда ждёт безусловная поддержка и любовь."
  tri_roditelskih_pravila:
    - "Правило 1. Человек всегда важнее потери: Первая фраза при любой бытовой оплошности ребёнка или супруга: «Главное, что ты сам цел и здоров!»"
    - "Правило 2. Разбор ценности — на спокойную голову: Учите ребёнка сравнивать масштаб: «Стоит ли менять большое интересное дело на минутную лень?»"
    - "Правило 3. Никогда не ссорьтесь на глазах у «соседей»: Единство мужа и жены, родителей и детей перед внешним миром — ваша главная сила."
  tablica_semeynyh_situaciy:
    - situaciya: "Ребёнок потерял в школе сменную обувь или перчатки"
      oshibochnaya_reakciya: "«Вечно ты всё теряешь! Голова садовая, сколько можно покупать!»"
      teplyy_i_mudryy_otvet: "«Главное, что ты сам не замёрз и вернулся домой! А теперь давай придумаем, как прикрепить вещи, чтобы они не терялись, как иголочка в траве»."
    - situaciya: "Отдал во дворе хорошую игрушку за сломанную безделушку"
      oshibochnaya_reakciya: "Бежать ругаться с чужими детьми или стыдить своего ребёнка."
      teplyy_i_mudryy_otvet: "«У тебя сегодня вышла настоящая сказка про курочку за уточку! Зато теперь ты знаешь, как важно подумать перед обменом»."
    - situaciya: "Супруг совершил неудачную покупку или ошибся в расчёте"
      oshibochnaya_reakciya: "Припоминать ошибку неделями при каждом разговоре."
      teplyy_i_mudryy_otvet: "«Слава Богу, что мы с тобой живы, здоровы и дружны, а деньги — дело наживное, заработаем вместе ещё больше!»"
metodika_i_matrica_2x2:
  paradox_skazki_ru: "Соединим оба главных урока сказки по двум осям: Ось X — единство, доверие и поддержка внутри семьи/команды, Ось Y — твёрдость в сохранении и умножении ценности актива вовне."
  kto_est_kto_4_roli:
    - "1. «Старик в дороге» — Уставший руководитель, бегущий от сложности масштаба: Крупный актив («конь») всегда норовист и требует мастерства управления. Как только лидер устаёт и хочет «чтобы было потише и попроще», он сам начинает разменивать большой проект на мелкие и дешёвые сделки."
    - "2. «Менялы и Коробейник» — Охотники за вашей усталостью: Рынок мгновенно чувствует, когда переговорщик утомлён и хочет быстрее закрыть вопрос, и тут же предлагает ему с улыбкой отдать «курочку за блестящую иголочку»."
    - "3. «Сосед у плетня» — Внешний конкурент, делающий ставку на ваш раскол: Окружение часто ждёт, что после финансовой неудачи соучредители или супруги начнут рвать друг друга на части и окончательно добьют своё дело."
    - "4. «Мудрая жена» — Стратегический тыл, превращающий поражение в победу: Её выдержка, уважение к мужу и отсутствие истерики не только сохранили семью и честную обратную связь, но и мгновенно принесли в дом новые 100 рублей!"
  dve_lovushki:
    - "Ловушка 1 — Эрозия сделки мелкими шагами («Уступка по 15% на каждом этапе»): Сначала дали клиенту скидку 15%, потом согласились на постоплату через 90 дней, потом взяли на себя доставку и доработки — и в итоге высокомаржинальный «конь» превратился в убыточную «иголку»."
    - "Ловушка 2 — Принятие стратегических решений в состоянии дорожной усталости: Все свои семь невыгодных обменов старик совершил на ходу, когда устал. В управлении действует железное правило: на усталую голову вечером нельзя подписывать договоры, давать скидки и менять стратегию."
    - "★ Секрет двойной защиты — Якорь изначальной цели + Безусловный тыл: Сравнивайте каждый компромисс не с предыдущим шагом («курочка почти как уточка»), а с вашей начальной целью («где мой конь?»). А внутри команды и дома держите культуру честности без страха расправы."
  sekret_skazki_ru: "Крупный актив требует крупного характера: учитесь объезжать коня, а не менять его на курицу."
  os_y_vertikalnaya:
    nazvanie_ru: "СОХРАНЕНИЕ ЦЕННОСТИ В СДЕЛКАХ →"
    niz_ru: "Низкая"
    verh_ru: "Высокая ↑"
  os_x_gorizontalnaya:
    nazvanie_ru: "ЕДИНСТВО И ДОВЕРИЕ ВНУТРИ СЕМЬИ И КОМАНДЫ"
    levo_ru: "Внутренние упрёки и раскол"
    pravo_ru: "Крепкий тыл («Добро наживём!»)"
  kvadraty:
    kvadrat_1_levyy_nizhniy:
      zagolovok_ru: "Квадрат 1 • Двойное крушение — ПОТЕРЯННАЯ ИГОЛКА И СКАНДАЛ"
      sut_ru: "На рынке разменяли капитал на пустяки, а вернувшись домой или в совет директоров — устроили взаимное уничтожение на радость конкурентам."
    kvadrat_2_levyy_verhniy:
      zagolovok_ru: "Квадрат 2 • Жёсткий счёт без душевного тыла — ХОЛОДНАЯ КАЗНА (СТРАХ ОШИБКИ)"
      sut_ru: "Деньги считают жёстко, но за любой промах своих казнят. В итоге сотрудники и близкие боятся инициативы и прячут ошибки до катастрофы."
    kvadrat_3_pravyy_nizhniy:
      zagolovok_ru: "Квадрат 3 • Душевность без финансовой дисциплины — ДОБРЫЙ СТАРИК НА ЯРМАРКЕ"
      sut_ru: "Внутри семьи и коллектива все друг друга любят и прощают, но на рынке раздают активы за бесценок любому коробейнику."
    kvadrat_4_pravyy_verhniy_pravilnyy_otvet:
      zagolovok_ru: "★ Квадрат 4 (ПРАВЫЙ ВЕРХНИЙ УГОЛ): ЗОЛОТОЙ КОНЬ И КРЕПКИЙ ДОМ"
      sut_ru: "Во внешних сделках твёрдо держат цену и масштаб («не меняют коня на утку»), а внутри дома и команды хранят абсолютное доверие и взаимную опору."
  tri_pravila_perehoda_v_kvadrat_4:
    - "Правило 1. Нижний порог сделки: Заранее фиксируйте письменно предел уступок, ниже которого сделка отменяется."
    - "Правило 2. Запрет на мены с устатку: Любое предложение «обменять коня на корову» откладывается до утра."
    - "Правило 3. Закон открытой правды: За честный доклад о проблеме человека поддерживают и сразу включают план спасения."
  tablica_rabochih_situaciy:
    - situaciya: "Переговоры о цене с жёстким заказчиком"
      ubytschnyy_otvet: "Уступать шаг за шагом по 10%, пока проект не уйдёт в минус («иголку»)."
      pravilnyy_otvet_kvadrat_4: "Держать базовую стоимость: любая скидка возможна только при уменьшении объёма работ."
    - situaciya: "Трудности при запуске масштабного продукта"
      ubytschnyy_otvet: "Испугаться сложности («конь брыкается») и урезать продукт до серой заурядности."
      pravilnyy_otvet_kvadrat_4: "Нанять опытного «берейтора» (эксперта), обучить команду и довести сильный продукт до рынка."
    - situaciya: "Распределение времени руководителя"
      ubytschnyy_otvet: "С утра взяться за стратегию, а к обеду разменять день на мелкие поручения и чаты."
      pravilnyy_otvet_kvadrat_4: "Первые 3 часа дня неприкосновенны для главного проекта-«Коня»."
    - situaciya: "Реакция на промах партнёра или близкого"
      ubytschnyy_otvet: "Устроить разнос при посторонних («соседях»)."
      pravilnyy_otvet_kvadrat_4: "Держать единый фронт перед внешним миром, сохранить дух и отыграть потерю вдвойне."
  krylatyy_slovar_komandy:
    - "«Друзья, мы сейчас меняем коня на корову, а уточку на курочку!» — В ходе обсуждения мы шаг за шагом снижаем планку качества и доходности проекта. (Действие: Останавливаем компромиссы и возвращаемся к исходному ТЗ («коню»).)"
    - "«От этого контракта у нас осталась одна швейная иголка!» — После всех скидок и дополнительных условий клиента сделка потеряла экономический смысл. (Действие: Пересматриваем экономику договора или вежливо выходим из сделки.)"
    - "«Не слушайте коробейников у ворот на усталую голову!» — В конце трудного дня нам предлагают сомнительное «быстрое решение». (Действие: Берём паузу на 24 часа и проверяем цифры утром.)"
    - "«Главное — сам живой вернулся, а добро наживём!» — В проекте случилась потеря, но команда честна, едина и сохранила ключевую компетенцию. (Действие: Без паники и упрёков закрываем убыток и запускаем следующий сильный шаг.)"
sovet_18_ekspertov:
  kontur_1_smysl_i_metodologiya:
    rol_01_dba_instrument: "Различие Потребительной и Меновой стоимости (Value in Use vs Value in Exchange), защита капитала от эмоциональных сделок (Unit-экономика шага) и сохранение семейного согласия"
    rol_02_mckinsey_mece_proverka: "Ось X (Трезвый расчёт ценности и сохранение актива) × Ось Y (Теплота, мир и поддержка в семье/команде) — показывают, как соединить бережливый финансовый фильтр с безусловным уважением к близким (★ Кв. 4)."
    rol_03_edtech_perenos_v_privychku_24ch:
      dlya_semyi_segodnya_vecherom: "Перед любой спонтанной покупкой сегодня примените правило «Золотой паузы на 24 часа»: спросите вместе с ребёнком, станет ли эта вещь полезнее того, что мы отдаём взамен."
      dlya_rukovoditelya_zavtra_utrom: "Проверьте все текущие инициативы «обмена шила на мыло» (ребрендинги, смены платформ, бартерные сделки): запретите любой шаг, где фундаментальная ценность актива после обмена становится ниже исходной."
    rol_04_skazochnik_transkreator: "T1 + T4: Подчёркнуты оба полюса мудрости сказки — и опасность бесцельной мены без счёта, и великая ценность семейного лада, когда супруга ставит мир в доме выше потерянного кошеля."
    rol_05_rezhisser_chteniya_vsluh_i_audio: "Бодрый ярмарочный ритм в сценах 1–4 (звон бубенцов, смена голосов купцов); мягкий, светлый и умиротворяющий тон домашнего очага в сцене 5."
    rol_06_briks_i_vostok_most: "Европа (Х. К. Андерсен «Что муженёк ни сделает, всё хорошо», братья Гримм «Ганс в счастье»); Китай: притча о покупке лакированной шкатулки и возврате жемчужины (Май Чжу Хуань Чжу)."
  kontur_2_chetyre_auditorii:
    rol_07_deti_6_10_let: "1. Думай перед меной: Не отдавай большое и доброе дело за пустяк только потому, что устал в пути. 2. Говори правду дома: Родные всегда поймут и поддержат тебя, если рассказать всё честно. 3. Люби своих близких: Тёплое слово и объятие сильнее любой неудачи."
    rol_08_semya_i_60_plyus: "100% чистый русский язык без англицизмов и жаргона; уважение к бабушкам и дедушкам (60+) как хранителям семейного лада."
    rol_09_upravlency_mba: "1. Приоритет родного человека: Ни одна разбитая или потерянная вещь не стоит слёз и потери доверия в семье. 2. Урок масштаба: Учите детей не снижать планку мечты при первых трудностях. 3. Несокрушимый тыл: Семья, где стоят друг за друга горой, выигрывает любой жизненный спор."
    rol_10_predprinimateli_sovladelcy: "Крупный актив требует крупного характера: учитесь объезжать коня, а не менять его на курицу."
  kontur_3_vizual_produkt_pravo:
    rol_11_hudozhnik_illyustrator: "Пресет STYLE_1_RUSSIAN_TEREM, палитра #fbf6ec, #7a1c14, #b88938, #1e352f"
    rol_12_infodizayner_matric: "Правильный ответ всегда закреплён в Правом Верхнем Углу (★ Квадрат 4) с золотой рамкой и мгновенным считыванием за 3 секунды."
    rol_13_verstalshchik_gost: "Эталон 13 страниц (1 обложка + 12 страниц блока по ГОСТ Р 7.0.4-2020), висячие строки = 0, воздух ≥ 25%."
    rol_14_inzhener_pechati_kdp: "CMYK FOGRA39 (TAC ≤ 240%), вылеты 3.2 мм (0.125 in); индивидуальный выпуск 13 стр. для Kindle eBook + сборка в тома по 3 сказки (36 стр.) для KDP Paperback и по 8 сказок (108 стр.) для KDP Hardcover."
    rol_15_ii_pedagog_sokrat: "Сократический режим: ИИ-наставник сначала задаёт наводящий вопрос по сказке и хвалит за размышление; не собирает персональные данные детей (Zero PII)."
    rol_16_prodyuser_amazon_kdp: "Наднациональное позиционирование 'The Great Market Trade: Smart Choices, True Value, and Peace at Home' + западный культурный мостик в 1-й строке предисловия."
    rol_17_yurist_rf: "ГК РФ ст. 567–571 (Договор мены и презумпция равноценности обмениваемых товаров), ст. 179 (Кабальная сделка на крайне невыгодных условиях), Семейный кодекс РФ ст. 35 (Согласие супруга на распоряжение общим имуществом), ГК РФ ст. 1062 (Недействительность требований, связанных с играми и пари)."
